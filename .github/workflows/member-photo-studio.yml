name: Cireng Indi Member Photo Studio
on:
  push:
    paths:
      - 'tools/standardize_member_photos.py'
      - '.github/workflows/member-photo-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Generate 31 consistent offline WebP thumbnails
        run: python tools/standardize_member_photos.py --deploy
      - name: Validate embedded catalog and size
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('apps/member/app/src/main/assets/index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/)[1];
          new Function(js);
          const section=html.slice(html.indexOf('/* CI_NORMALIZED_PHOTO_START */'),
              html.indexOf('/* CI_NORMALIZED_PHOTO_END */'));
          const products=[...section.matchAll(/data:image\/webp;base64,/g)].length;
          if(products!==31)throw Error('Expected exactly 31 embedded product photos, got '+products);
          if(Buffer.byteLength(html,'utf8')>=512*1024)throw Error('OTA source too large');
          console.log('PASS: 31 fixed offline thumbnails; OTA length='+html.length);
          NODE
      - name: Commit and publish fixed Member photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/member/app/src/main/assets/index.html
          if ! git diff --staged --quiet; then
            git commit -m 'Publish 31 studio-balanced fixed product thumbnails for Member OTA'
            git push origin HEAD:main
          fi
