name: Cireng Indi Member HD Photo Audit
on:
  push:
    paths:
      - 'apps/member/app/src/main/assets/index.html'
      - 'apps/member/app/src/main/assets/assets/official_*.webp'
      - '.github/workflows/member-photo-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebP image reader
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Audit all 31 bundled HD product originals
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('apps/member/app/src/main/assets')
          html=(root/'index.html').read_text(encoding='utf8')
          assert 'CI_NORMALIZED_PHOTOS' not in html, 'Old 208px inlined product photos must not be used'
          assert "photoAttrs(p,'hero')" in html, 'Product hero must use original HD image'
          assert 'const source=stablePhotoSource(id,resolved?.name)' in html, 'Product cards must also use originals'
          assert 'new MutationObserver(' not in html, 'Photos should never swap on scroll'
          dims=[]
          for i in range(1,32):
              file=root/'assets'/f'official_{i:02d}.webp'
              assert file.is_file(),f'Missing SKU {i:02d}'
              with Image.open(file) as im:
                  im.verify()
              with Image.open(file) as im:
                  w,h=im.size
              dims.append((i,w,h))
              print(f'SKU {i:02d}: {w}x{h} (bundled original)',flush=True)
          low=[f'{i:02d}:{w}x{h}' for i,w,h in dims if min(w,h)<512]
          print('TOTAL:',len(dims),'originals | min:',min(min(w,h) for _,w,h in dims),'pixels')
          if low:print('LOW_RES_ORIGINALS_TO_REVIEW:',', '.join(low))
          assert all(min(w,h)>=256 for _,w,h in dims), 'Source image too small for product detail'
          assert (root/'index.html').stat().st_size<512*1024, 'OTA code limit exceeded'
          print('PASS: Member uses all 31 stable original product images, not tiny thumbnail tiles')
          PY
