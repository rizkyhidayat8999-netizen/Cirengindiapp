name: Cireng Indi Member Photo Studio
on:
  push:
    paths:
      - 'tools/standardize_member_photos.py'
      - '.github/workflows/member-photo-studio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Preview normalized product photos
        run: python tools/standardize_member_photos.py --preview-only
