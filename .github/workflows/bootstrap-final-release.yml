name: Build First Signed Cireng Indi OTA Production APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-final-release.yml'
permissions:
  contents: read
jobs:
  bootstrap-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate and privately sign production APKs
        shell: bash
        run: |
          set -euo pipefail
          set +x
          export CI_SIGNING_KEYSTORE="$RUNNER_TEMP/cirengindi-release.jks"
          export CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          export CI_KEY_PASSWORD="$CI_STORE_PASSWORD"
          export CI_KEY_ALIAS="cirengindi-production"
          keytool -genkeypair -noprompt -storetype JKS \
            -alias "$CI_KEY_ALIAS" -keystore "$CI_SIGNING_KEYSTORE" \
            -storepass "$CI_STORE_PASSWORD" -keypass "$CI_KEY_PASSWORD" \
            -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000 \
            -dname "CN=Cireng Indi, OU=Mobile, O=Cireng Indi, L=Tanah Grogot, ST=Kalimantan Timur, C=ID"
          chmod 600 "$CI_SIGNING_KEYSTORE"
          gradle -p apps/member :app:assembleRelease --stacktrace
          gradle -p apps/owner :app:assembleRelease --stacktrace
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs apps/member/app/build/outputs/apk/release/app-release.apk
          "$SIGNER" verify --verbose --print-certs apps/owner/app/build/outputs/apk/release/app-release.apk
          sha256sum apps/member/app/build/outputs/apk/release/app-release.apk
          sha256sum apps/owner/app/build/outputs/apk/release/app-release.apk
          printf 'CI_STORE_PASSWORD=%s\nCI_KEY_PASSWORD=%s\nCI_KEY_ALIAS=%s\n' \
            "$CI_STORE_PASSWORD" "$CI_KEY_PASSWORD" "$CI_KEY_ALIAS" \
            > "$RUNNER_TEMP/cirengindi-signing-credentials.txt"
          chmod 600 "$RUNNER_TEMP/cirengindi-signing-credentials.txt"
          tar -czf "$RUNNER_TEMP/cirengindi-secret-recovery.tar.gz" \
            -C "$RUNNER_TEMP" cirengindi-release.jks cirengindi-signing-credentials.txt
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$RUNNER_TEMP/cirengindi-secret-recovery.tar.gz" \
            -out "$RUNNER_TEMP/cirengindi-encrypted-recovery.cms" \
            -recip .github/cirengindi-release-encryption.crt
          test -s "$RUNNER_TEMP/cirengindi-encrypted-recovery.cms"
      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Member-v2.0.0-PRODUCTION
          path: apps/member/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Owner-v2.0.0-PRODUCTION
          path: apps/owner/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Encrypted-Release-Signing-Recovery
          path: ${{ runner.temp }}/cirengindi-encrypted-recovery.cms
          if-no-files-found: error
          retention-days: 30
      - name: Erase plaintext signing materials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/cirengindi-release.jks" \
            "$RUNNER_TEMP/cirengindi-signing-credentials.txt" \
            "$RUNNER_TEMP/cirengindi-secret-recovery.tar.gz"
