name: Build Cireng Indi MEMBER Google Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main, codex/member-play-readiness]
    paths:
      - "apps/member/**"
      - ".github/workflows/google-play-member-aab.yml"

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Detect protected signing key
        id: signing
        env:
          KEY_BASE64: ${{ secrets.CI_MEMBER_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CI_MEMBER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_MEMBER_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CI_MEMBER_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEY_BASE64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/cirengindi-member-upload.jks"
            chmod 600 "$RUNNER_TEMP/cirengindi-member-upload.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Member upload key configured; generating an unsigned bundle for local signing."
          fi
      - name: Build MEMBER Android App Bundle
        env:
          CI_SIGNING_KEYSTORE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/cirengindi-member-upload.jks', runner.temp) || '' }}
          CI_STORE_PASSWORD: ${{ secrets.CI_MEMBER_STORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_MEMBER_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_MEMBER_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/member :app:bundleRelease --stacktrace
          FILE=apps/member/app/build/outputs/bundle/release/app-release.aab
          test -s "$FILE"
          unzip -tqq "$FILE"
          unzip -Z1 "$FILE" | grep -q '^base/manifest/AndroidManifest.xml$'
          cp "$FILE" CirengIndi-Member-v2.1.1.aab
          sha256sum CirengIndi-Member-v2.1.1.aab
      - name: Verify upload signature
        if: steps.signing.outputs.configured == 'true'
        run: jarsigner -verify -strict CirengIndi-Member-v2.1.1.aab
      - name: Upload signed bundle
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Member-v2.1.1-PLAY-READY
          path: CirengIndi-Member-v2.1.1.aab
          if-no-files-found: error
          retention-days: 90
      - name: Upload unsigned bundle for local signing
        if: steps.signing.outputs.configured == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Member-v2.1.1-UNSIGNED
          path: CirengIndi-Member-v2.1.1.aab
          if-no-files-found: error
          retention-days: 90
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cirengindi-member-upload.jks"
