name: Build Cireng Indi Owner Google Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/owner/**"
      - ".github/workflows/google-play-owner-aab.yml"

permissions:
  contents: read

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Detect protected upload signing key
        id: signing
        env:
          KEY_BASE64: ${{ secrets.CI_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CI_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEY_BASE64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/cirengindi-upload.jks"
            chmod 600 "$RUNNER_TEMP/cirengindi-upload.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No production upload keystore was configured. The bundle will be UNSIGNED and cannot be uploaded to Google Play yet."
          fi
      - name: Build Android App Bundle
        env:
          CI_SIGNING_KEYSTORE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/cirengindi-upload.jks', runner.temp) || '' }}
          CI_STORE_PASSWORD: ${{ secrets.CI_STORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/owner :app:bundleRelease --stacktrace
          FILE=apps/owner/app/build/outputs/bundle/release/app-release.aab
          test -s "$FILE"
          unzip -tqq "$FILE"
          unzip -Z1 "$FILE" | grep -q '^base/manifest/AndroidManifest.xml$'
          cp "$FILE" "CirengIndi-Owner-v2.0.2.aab"
          sha256sum "CirengIndi-Owner-v2.0.2.aab"
      - name: Verify Play upload signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -strict "CirengIndi-Owner-v2.0.2.aab"
          echo "Signed AAB verified."
      - name: Upload signed Google Play bundle
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Owner-v2.0.2-PLAY-READY
          path: CirengIndi-Owner-v2.0.2.aab
          if-no-files-found: error
          retention-days: 90
      - name: Save unsigned bundle (not Play-ready)
        if: steps.signing.outputs.configured == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Owner-v2.0.2-UNSIGNED
          path: CirengIndi-Owner-v2.0.2.aab
          if-no-files-found: error
          retention-days: 90
      - name: Erase signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cirengindi-upload.jks"
