name: Synchronize 31 Official Website Product Photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sync_cirengindi_website_photos.py"
      - ".github/workflows/sync-official-photos.yml"
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Fetch original website photos and harmonize each product
        run: python tools/sync_cirengindi_website_photos.py
      - name: Validate all 31 product images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path('apps/member/app/src/main/assets/assets').glob('official_??.webp'))
          assert len(files)==31, len(files)
          for f in files:
            with Image.open(f) as image:
              assert image.size==(900,900),(f,image.size)
          print('PASS: 31 website photos, distinct names, 900 x 900 px')
          PY
      - name: Commit completed real product photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cirengindi-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/member/app/src/main/assets/assets/official_*.webp
          if git diff --cached --quiet; then
            echo "Photo assets unchanged"
          else
            git commit -m "Sync all 31 original Cireng Indi website photos in matching studio style"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble Member APK with actual photos packaged for offline use
        run: gradle -p apps/member :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-31-Website-Photos-and-Member-APK
          path: |
            apps/member/app/src/main/assets/assets/official_*.webp
            apps/member/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
