name: Verify Cireng Indi Operations
on:
  push:
    paths:
      - 'apps/**'
      - 'supabase/functions/**'
      - '.github/workflows/verify-operations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax, catalogue and authorization gates
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const member=fs.readFileSync('apps/member/app/src/main/assets/index.html','utf8');
          const owner=fs.readFileSync('apps/owner/app/src/main/assets/index.html','utf8');
          const backend=fs.readFileSync('supabase/functions/cirengindi-backend/index.ts','utf8');
          for(const [label,html] of [['Member',member],['Owner',owner]]){
            const js=html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
            if(!js)throw Error(label+' script missing');
            new Function(js);
            if(label==='Member' && js.includes('function top(')) throw Error('Reserved top() causes blank Member WebView');
          }
          for(const needle of ['payment_proof_upload','payment_review','ci_assign_courier_safe','ci_checkout','set_bank_transfer'])if(!backend.includes(needle))throw Error('Missing backend operation '+needle);
          if(!member.includes('Lupa password?</button>')||member.includes('>Lupa PW</button>'))throw Error('Member reset link should be below password, not a third login tab');
          if(!member.includes("repeat(2,1fr)"))throw Error('Member auth layout should have two tabs');
          if(!owner.includes('resendOwnerVerification(this)')||!owner.includes('email_not_confirmed'))throw Error('Owner must support secure verification recovery');
          if(!backend.includes('EMAIL_SERVICE_RATE_LIMIT'))throw Error('Backend must map email provider throttle into a stable error');
          if(!member.includes('authStatus')||!member.includes('email_service_rate_limit'))throw Error('Member must explain rate-limited signup inline');
          if(!member.includes('auth--register'))throw Error('Registration form must use scroll-safe layout');
          if(owner.includes('/auth/v1/signup'))throw Error('Do not duplicate Owner account creation when account already exists');
          if(!owner.includes('Verifikasi Owner'))throw Error('Missing secure owner activation guidance');
          // UI must never block taps behind a full-screen waiting overlay.
          if(member.includes('id="loader"')||owner.includes('id="loading"'))throw Error('A modal loading overlay was reintroduced');
          for(const [name,source] of [['Member',member],['Owner',owner]]){
            if(!source.includes('const instantViews=new Map()')||!source.includes('previewPage('))throw Error(name+' instant-route cache missing');
            if(!source.includes('instantViews.clear()'))throw Error(name+' must discard cached private content on logout');
            if(!source.includes('navId'))throw Error(name+' navigation race guard missing');
          }
          // Home is now rendered synchronously; subsequent API responses only refresh while Home is active.
          if(!member.includes("function renderHome()")||!member.includes("if(state.route==='home')"))
            throw Error('Instant Home render or response guard missing');
          for(const p of ['store','addresses','cart','checkout','orders','rewards','profile']){
            if(!member.includes("state.route!=='"+p+"'"))throw Error('Member stale-response guard missing for '+p);
          }
          if(member.includes('m.profile.level||"Classic"')||!member.includes('Voucher <span data-voucher-count>'))
            throw Error('Home must show owner-issued Voucher instead of Classic');
          if(!member.includes("async function vouchers()")||!member.includes("id=\"checkoutVoucher\"")||!member.includes("voucher_id,address_id"))
            throw Error('Member voucher screen/checkout is not wired');
          if(!member.includes('orderTimeline(o)')||!owner.includes("ready_for_pickup"))
            throw Error('Pick Up/Delivery order steps missing');
          for(const operation of ["voucher_create","voucher_issue","ci_checkout_with_voucher","ci_order_status_events"]){
            if(!backend.includes(operation))throw Error('Backend voucher or timeline missing '+operation);
          }
          for(const p of ['dashboard','orders','products','members','rewards','operations','settings']){
            if(!owner.includes("state.page!=='"+p+"'"))throw Error('Owner stale-response guard missing for '+p);
          }
          if(!member.includes('onchange="uploadProof('))throw Error('Missing member file input');
          if(!member.includes('id="cobank"')||!member.includes('bank_code'))throw Error('Member bank selection missing');
          const bankSQL=fs.readFileSync('supabase/migrations/20261016_two_bank_checkout.sql','utf8');
          for(const s of ['ci_checkout_with_bank','bank_snapshot','7306336217','457901008978533'])if(!bankSQL.includes(s))throw Error('Two-bank migration missing '+s);
          if(!owner.includes('raw.githubusercontent.com'))throw Error('Owner remote theme configuration missing');
          if(!owner.includes("onclick=\"registerOwner()\""))throw Error('Missing owner activation');
          const m=member.match(/const SB='([^']+)', KEY='([^']+)'/);
          if(!m)throw Error('Missing mobile backend config');
          const [,base,key]=m;
          const call=async (endpoint,action)=>{
            const response=await fetch(base+'/functions/v1/'+endpoint,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({action})});
            let data;try{data=await response.json()}catch{throw Error('Invalid JSON from '+endpoint+' ('+response.status+')')}
            return {status:response.status,data};
          };
          (async()=>{
            const boot=await call('cirengindi-mobile-api','bootstrap');
            if(boot.status!==200)throw Error('Bootstrap failed '+boot.status+': '+JSON.stringify(boot.data));
            for(const [n,cnt] of [['products',31],['variants',42],['couriers',3]])if(boot.data[n]?.length!==cnt)throw Error('Unexpected '+n+' count: '+boot.data[n]?.length);
            // Regression: API response must already be sorted ascending for the Member view.
            // Sorting a copy before checking would miss the old Rengginang-first bug.
            const serverCategoryOrder=(boot.data.categories||[]).map(c=>c.name);
            const serverProductOrder=(boot.data.products||[]).map(p=>p.name);
            if(serverCategoryOrder.join('|')!=='Cireng|Frozen|Jamu|Lainnya' ||
               serverProductOrder[0]!=='Cireng'||serverProductOrder[1]!=='Cireng Isi'||
               serverProductOrder.at(-1)!=='Rengginang')
              throw Error('Bootstrap must return website order directly (Cireng first): '+JSON.stringify(serverProductOrder.slice(0,5)));
            if(!member.includes('storeCatalogByCategory(ps,cats,b)')||
               !member.includes('function applyCatalogFilter(')||
               !member.includes('item.hidden=!visible')||
               !member.includes('data-ci-category')||
               !member.includes('ciBestSellerBadge')||
               !member.includes("setCat('bestseller')"))
              throw Error('Member website category grouping or Best Seller controls missing');
            // Catch broken pickup/delivery header markup and unnecessary catalogue repaints.
            const storePage=member.slice(member.indexOf('async function store(){'),
              member.indexOf('const CIRENG_OUTLET_GOOGLE_MAPS'));
            const filterFn=member.slice(member.indexOf('function setCat('),
              member.indexOf('async function openP('));
            if(!storePage.includes('Pick Up</button>')||!storePage.includes('Delivery</button>')||
               !storePage.includes('fulfillmentLocationRow()'))
              throw Error('Pick Up/Delivery header incomplete');
            if(filterFn.includes('products.innerHTML')||filterFn.includes('await store()'))
              throw Error('Store filters must toggle visibility without re-rendering photos');
            if(!member.includes('data:image/webp;base64,')||member.includes('new MutationObserver('))
              throw Error('Approved AI photos must stay pinned without late source swapping');
            const websiteCategories=['Cireng','Frozen','Jamu','Lainnya'];
            const actualCategories=boot.data.categories.map(c=>c.name);
            if(JSON.stringify(actualCategories)!==JSON.stringify(websiteCategories))
              throw Error('Website category order mismatch '+JSON.stringify(actualCategories));
            const websiteOrder=[
              'Cireng','Cireng Isi','Cilok','Sempol Ayam','Tahu Bakso','Pempek Ikan Tenggiri',
              'Nugget Ayam','Chicken Katsu','Bakso Ayam','Bola Ayam Keju','Bitterballen','Ayam Ungkep',
              'Jamu Manjakani','Jamu Komplit','Kunyit Asam','Jahe Latte','Jahe Original','Sari Kacang Hijau',
              'Ebi Furai','Baceman Frozen','Dimsum Crispy','Rollade Ayam','Kebab Pisang','Kebab Daging',
              'Corndog','Churros','Kentang Goreng','Frozen Mix Platter','Puding Mix','Salad Jelly','Rengginang'
            ];
            const actualOrder=boot.data.products.map(p=>p.name);
            if(JSON.stringify(websiteOrder)!==JSON.stringify(actualOrder))
              throw Error('Website product order mismatch '+JSON.stringify(actualOrder));
            if(boot.data.products[0].name!=='Cireng'||boot.data.products[0].best_seller!==true)
              throw Error('Cireng must be the top best-seller in public catalogue');
            if(!member.includes("function websiteCatalogueOrder(")||!member.includes("setCat('bestseller')")||
               !member.includes('ciBestSellerBadge'))
              throw Error('Member must sort website products and expose Best Seller filter/labels');
            for(let i=1;i<=31;i++){
              const photo='apps/member/app/src/main/assets/assets/official_'+String(i).padStart(2,'0')+'.webp';
              if(!fs.existsSync(photo)||fs.statSync(photo).size<1500)
                throw Error('Official website photo not packaged: '+photo);
            }
            if(!member.includes('OFFICIAL_IMAGE_SLUGS')||!member.includes('photoFallback'))
              throw Error('Official website photo selection/fallback absent from Member');
            // Fixed no-flicker photos: 31 local official assets plus two embedded,
            // approved AI WebP images work on both existing and future APKs.
            const legacyRoot='apps/member/app/src/main/assets/assets/';
            for(const asset of ['banner_reseller.webp','banner_churros.webp','banner_cafe.webp','banner_puding.webp',
             'product_cireng.webp','product_cireng_isi.webp','product_cilok.webp',
             'ai_cireng_styled.webp','ai_cireng_partner.webp','logo_cireng_indi.png']){
              if(!fs.existsSync(legacyRoot+asset))throw Error('Missing local fallback photo '+asset);
            }
            if(!member.includes('function stablePhotoSource(')||
               !member.includes("return 'assets/official_'")||
               !member.includes("AI_CIRENG_PHOTO_URL='data:image/webp;base64,")||
               !member.includes("AI_PARTNER_PHOTO_URL='data:image/webp;base64,")||
               member.includes('upgradeImageWhenReady')||
               member.includes('new MutationObserver('))
              throw Error('Member photos must be fixed offline sources with no image replacement after loading');
            const memberGo=member.slice(member.indexOf('async function go(r)'),member.indexOf('const MEMBER_HERO_PROMOS',member.indexOf('async function go(r)')));
            if(!memberGo.includes('state.route=r;')||memberGo.includes('previewPage(r)'))
              throw Error('Member navigation must not flash a loading preview or stale HTML');
            if(!member.includes('id="launchBrand"') || !member.includes('assets/logo_cireng_indi.png') ||
               !member.includes("classList.add('hide')"))
              throw Error('Opening Cireng Indi logo not wired for existing APKs');
            if(!member.includes('Number(a.price||Infinity)-Number(b.price||Infinity)'))
              throw Error('Starting price should use the cheapest available variant');
            if(!member.includes('cartScreen')||!member.includes('photoAttrs(prd)'))
              throw Error('Compact cart/checkout photos must match main catalogue');


            if(boot.data.bank_transfer?.enabled!==true)throw Error('Live bank transfer not enabled');
          const banks=boot.data.bank_transfer?.accounts||[];
          for(const [code,number] of [['BSI','7306336217'],['BRI','457901008978533']]){
            const account=banks.find(b=>b.code===code);
            if(!account||account.account_number!==number||account.account_holder!=='Intan Istiqomah')
              throw Error('Live '+code+' account incorrect');
          }
          if(banks.length!==2)throw Error('Expected exactly two bank recipients');
          const logo=fs.readFileSync('apps/member/app/src/main/assets/assets/logo_cireng_indi.png');
          for(const path of [
            'apps/owner/app/src/main/assets/assets/logo_cireng_indi.png',
            'apps/member/app/src/main/res/drawable-nodpi/logo_cireng_indi.png',
            'apps/owner/app/src/main/res/drawable-nodpi/logo_cireng_indi.png'
          ])if(!fs.readFileSync(path).equals(logo))throw Error('Brand logo differs: '+path);
          if(!member.includes('Tanah Grogot')||member.includes('Surabaya'))throw Error('Incorrect outlet location');
          // Old APK visual restoration is intentional: use the historical local CSS layout.
          if(member.includes('premium-overrides.css'))throw Error('Member historic layout must not be overridden remotely');
          if(!member.includes('linear-gradient(122deg,#5d3027')||!member.includes('.storeHead h1 .storeLogo'))
            throw Error('Historic premium Member header layout missing');
          if(member.includes('/* Studio26:')||member.includes('studioObserver'))
            throw Error('Experimental studio UI/remote image hydration must stay removed');
          if(owner.lastIndexOf('premium-overrides.css')<owner.lastIndexOf('</style>'))
            throw Error('Owner theme stylesheet incorrectly ordered');
            const secret=[['cirengindi-mobile-api','orders'],['cirengindi-mobile-api','checkout'],['cirengindi-mobile-api','payment_proof_upload'],['cirengindi-owner-api','orders'],['cirengindi-owner-api','assign_courier'],['cirengindi-owner-api','payment_review'],['cirengindi-owner-api','set_bank_transfer']];
            for(const [ep,action] of secret){const r=await call(ep,action);if(r.status!==401)throw Error('Unauthorized action '+ep+'/'+action+' returned '+r.status)}
            console.log('PASS: scripts parse, catalogue 31/42/3, BSI/BRI live, matching official logo, OTA style and 7 protected operations');
          })().catch(e=>{console.error(e);process.exit(1)})
          JS