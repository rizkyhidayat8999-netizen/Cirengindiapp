name: Build Cireng Indi Owner FINAL v2.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-final-v201.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Import ORIGINAL Cireng Indi production signing key
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.CI_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_BASE64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::error::Original release signing secrets not configured. Cannot ship a compatible production update."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/cirengindi-release.jks"
          chmod 600 "$RUNNER_TEMP/cirengindi-release.jks"
      - name: Build and verify production Owner APK
        shell: bash
        env:
          CI_SIGNING_KEYSTORE: ${{ runner.temp }}/cirengindi-release.jks
          CI_STORE_PASSWORD: ${{ secrets.CI_STORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p apps/owner :app:assembleRelease --stacktrace
          APK="apps/owner/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected="d45744c0d692272e96b4c1a10b57dfd657306c8a31c9dba6e689d7aded1"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Signer mismatch: will NOT distribute this APK as compatible update."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Owner-FINAL-v2.0.1
          path: apps/owner/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Erase temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cirengindi-release.jks"
