name: Capture Cireng Indi Member Store Screenshots

on:
  workflow_dispatch:
  push:
    branches: [codex/member-play-readiness]
    paths:
      - "apps/member/**"
      - ".github/workflows/member-screenshots.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Member debug APK
        run: gradle -p apps/member :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture actual Member screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb wait-for-device
            adb install -r apps/member/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.cirengindi.member.internal -c android.intent.category.LAUNCHER 1
            sleep 10
            adb exec-out screencap -p > /tmp/member-login.png
            adb shell input tap 235 245
            sleep 3
            adb exec-out screencap -p > /tmp/member-register.png

      - name: Validate screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for name in ("login", "register"):
              path = Path("/tmp/member-" + name + ".png")
              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit("missing or empty screenshot: " + str(path))
              data = path.read_bytes()
              if data[:8] != b"\\x89PNG\\r\\n\\x1a\\n":
                  raise SystemExit("not a PNG: " + str(path))
              width, height = struct.unpack(">II", data[16:24])
              print(name, width, height, path.stat().st_size, "bytes")
              if width < 200 or height < 400:
                  raise SystemExit("unexpected screenshot dimensions: " + str(path))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CirengIndi-Member-Store-Screenshots
          path: |
            /tmp/member-login.png
            /tmp/member-register.png
          if-no-files-found: error
          retention-days: 90
