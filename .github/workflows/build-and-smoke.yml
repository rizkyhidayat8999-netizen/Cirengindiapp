name: Build and Smoke Test Cireng Indi Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "apps/**"
      - ".github/workflows/build-and-smoke.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Member
        run: gradle -p apps/member :app:clean :app:assembleDebug :app:lintDebug --stacktrace

      - name: Build Owner
        run: gradle -p apps/owner :app:clean :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/member/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/owner/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/member/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/owner/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Member-Test-APK
          path: apps/member/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Owner-Test-APK
          path: apps/owner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build both APKs
        run: |
          gradle -p apps/member :app:assembleDebug --stacktrace
          gradle -p apps/owner :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/member/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.cirengindi.member.internal -c android.intent.category.LAUNCHER 1
            sleep 14
            adb logcat -d -t 1200 > /tmp/member-log.txt
            ! grep -E "FATAL EXCEPTION|ANR in com.cirengindi.member.internal" /tmp/member-log.txt
            adb exec-out screencap -p > /tmp/member-login.png

            adb install -r apps/owner/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.cirengindi.owner.internal -c android.intent.category.LAUNCHER 1
            sleep 14
            adb logcat -d -t 1200 > /tmp/owner-log.txt
            ! grep -E "FATAL EXCEPTION|ANR in com.cirengindi.owner.internal" /tmp/owner-log.txt
            adb exec-out screencap -p > /tmp/owner-login.png


      - name: Upload emulator startup evidence even if screenshot assertion fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Diagnostics
          path: |
            /tmp/member-login.png
            /tmp/owner-login.png
            /tmp/member-log.txt
            /tmp/owner-log.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Assert both WebViews render visible content (not a blank screen)
        shell: bash
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from collections import Counter
          from PIL import Image
          for name in ('member','owner'):
              image=Image.open('/tmp/'+name+'-login.png').convert('RGB')
              center=image.crop((5,70,image.width-5,image.height-85))
              pixels=center.width*center.height
              ratio=Counter(center.getdata()).most_common(1)[0][1]/pixels
              print(f'{name} dominant color ratio: {ratio:.3f}')
              if ratio > 0.92:
                  raise SystemExit(f'FAIL: {name} WebView is nearly blank ({ratio:.2%})')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CirengIndi-Smoke-Screenshots
          path: |
            /tmp/member-login.png
            /tmp/owner-login.png
          if-no-files-found: error
          retention-days: 30
