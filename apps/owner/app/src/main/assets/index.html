<script>
const SUPABASE_URL="https://tbviryuimoxgapubdjio.supabase.co";
const KEY="sb_publishable_DxP6XDJP2XfZAC45pAniHQ_1WJqC4Fr";
const state={session:null,page:"dashboard",cache:{}};
const root=document.getElementById("root");
const instantViews=new Map();let navId=0;
function previewPage(page){
 const old=instantViews.get(page);
 if(old){root.innerHTML=old;return;}
 const titles={dashboard:'Dashboard',orders:'Pesanan & Pembayaran',products:'Produk & Stok',members:'Member',rewards:'Reward & Penukaran',operations:'Pengaturan Operasional',settings:'Lainnya'};
 root.innerHTML=shell(`<div class="section"><h2>${esc(titles[page]||'Cireng Indi Owner')}</h2></div>`,['rewards','operations'].includes(page)?'settings':page);
}
const icon=(id)=>`<svg class="icon"><use href="#${id}"></use></svg>`;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp"+Number(n||0).toLocaleString("id-ID");
function busy(v){/* No blocking spinner */}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function getSession(){try{const s=Native.getSession();return s?JSON.parse(s):null}catch(e){return null}}
function saveSession(s){state.session=s;Native.saveSession(JSON.stringify(s))}
function clearSession(){state.session=null;instantViews.clear();Native.clearSession()}

async function parse(r){const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch(e){}if(!r.ok){const reason=d.error_code||d.error_description||d.msg||d.message||d.error||((typeof d.code==='string'&&!/^\d+$/.test(d.code))?d.code:null)||('HTTP_'+r.status);const error=new Error(String(reason));error.status=r.status;throw error;}return d}
async function loginAuth(email,password){
 return parse(await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
  method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})
 }))
}
async function refresh(){
 const s=state.session||getSession();if(!s?.refresh_token)throw new Error("AUTH_REQUIRED");
 const d=await parse(await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
  method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})
 }));
 saveSession(d);return d
}
async function ownerApi(action,payload={},retry=true){
 let s=state.session||getSession();state.session=s;if(!s?.access_token)throw new Error("AUTH_REQUIRED");
 const r=await fetch(SUPABASE_URL+"/functions/v1/cirengindi-owner-api",{
  method:"POST",
  headers:{"apikey":KEY,"Authorization":"Bearer "+s.access_token,"Content-Type":"application/json"},
  body:JSON.stringify({action,...payload})
 });
 if(r.status===401&&retry&&s?.refresh_token){await refresh();return ownerApi(action,payload,false)}
 return parse(r)
}
async function verifyStaff(){try{await ownerApi("me");return true}catch(e){return false}}

function shell(body,active){
 const nav=[["dashboard","i-home","Dashboard"],["orders","i-order","Pesanan"],["products","i-box","Produk"],["members","i-users","Member"],["settings","i-settings","Lainnya"]];
 return `<div class="app"><div class="top"><div class="logo"><img class="officialLogo" src="assets/logo_cireng_indi.png" alt="Logo Cireng Indi"></div><div class="grow"><b>Cireng Indi Owner</b><span>Operasional & manajemen</span></div></div>${body}<nav class="nav">${nav.map(n=>`<button class="${active===n[0]?"active":""}" onclick="go('${n[0]}')">${icon(n[1])}${n[2]}</button>`).join("")}</nav></div>`
}
function renderLogin(msg=""){
 root.innerHTML=`<section class="login"><div class="loginbox"><div class="loginbrand"><img class="officialLogo" src="assets/logo_cireng_indi.png" alt="Logo Cireng Indi"></div><h1>Cireng Indi Owner</h1><p>Masuk menggunakan akun owner/staff.</p>${msg?`<div class="notice auth-message" role="alert">${esc(msg)}</div>`:""}<label>Email</label><input id="email" type="email" autocomplete="username" placeholder="indicireng@gmail.com" value="indicireng@gmail.com"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Masukkan password Owner"><button class="full" onclick="doLogin()">Masuk Owner</button><div class="auth-help"><span class="muted">Belum menerima email verifikasi?</span><div id="ownerAuthStatus" role="alert" aria-live="polite" class="auth-message"></div><div><button type="button" class="auth-text-action" onclick="resendOwnerVerification(this)">Kirim ulang email verifikasi</button></div></div><button type="button" class="btn secondary" style="width:100%;margin-top:13px" onclick="registerOwner()">Panduan Verifikasi Owner</button></div></section>`
}
function registerOwner(){
 const email='indicireng@gmail.com';
 root.innerHTML=`<section class="login"><div class="loginbox">
 <div class="loginbrand"><img class="officialLogo" src="assets/logo_cireng_indi.png" alt="Logo Cireng Indi"></div>
 <h1>Verifikasi Owner</h1>
 <p>Aktivasi akun pengelola Cireng Indi</p>
 <div class="notice auth-message">Akun <b>${esc(email)}</b> sudah terdaftar. Buka email verifikasi yang dikirim oleh Supabase, lalu klik tautannya satu kali. Periksa juga folder Spam atau Semua Email.</div>
 <div id="ownerAuthStatus" class="auth-message" role="alert" aria-live="polite"></div>
 <div class="auth-help"><button type="button" class="auth-text-action" onclick="resendOwnerVerification(this)">Kirim ulang tautan verifikasi</button></div>
 <p class="auth-password-info">Pengiriman email dibatasi oleh penyedia. Jika diminta menunggu, jangan mendaftar atau mengirim berulang kali.</p>
 <button type="button" class="btn secondary" style="width:100%;margin-top:12px" onclick="renderLogin()">Kembali ke Login</button>
 </div></section>`;
}

async function resendOwnerVerification(button){
 const email='indicireng@gmail.com';
 if(button){button.disabled=true;button.textContent='Mengirim…';}
 try{
  await parse(await fetch(SUPABASE_URL+'/auth/v1/resend?redirect_to='+encodeURIComponent('https://cirengindi.com/'),{
    method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
    body:JSON.stringify({type:'signup',email})
  }));
  const box=document.getElementById('ownerAuthStatus');if(box)box.textContent='Jika akun masih menunggu verifikasi, email terbaru telah diminta. Periksa inbox dan spam.';else toast('Periksa email verifikasi terbaru.');
 }catch(e){
  const box=document.getElementById('ownerAuthStatus'),msg=errorText(e.message);if(box)box.textContent=msg;else toast(msg);
 }finally{
  if(button){button.textContent='Kirim ulang email verifikasi';setTimeout(()=>{if(button.isConnected)button.disabled=false;},60000);}
 }
}
async function doLogin(){
 const mail=document.getElementById("email").value.trim(),password=document.getElementById("pw").value;
 if(!mail||!password)return toast("Isi email dan password.");
 busy(true);try{
  const d=await loginAuth(mail,password);saveSession(d);
  await ownerApi('me');
  await go("dashboard");toast("Login berhasil.");
 }catch(e){clearSession();renderLogin(errorText(e.message))}finally{busy(false)}
}
function errorText(m){
 const code=String(m||'').trim();
 const map={AUTH_REQUIRED:"Sesi berakhir. Silakan masuk kembali.",STAFF_REQUIRED:"Akun belum mempunyai akses Owner. Pastikan email sudah diverifikasi, lalu masuk ulang.",
 email_not_confirmed:"Email Owner belum diverifikasi. Buka pesan verifikasi dari Supabase di inbox atau spam, lalu coba masuk kembali.",
 invalid_credentials:"Email atau password tidak sesuai. Periksa kembali atau buat akun Owner terlebih dahulu.",
 user_not_found:"Akun belum terdaftar. Gunakan menu Aktivasi Akun Owner.",
 over_email_send_rate_limit:"Terlalu sering meminta email. Coba lagi beberapa menit kemudian.",
 over_request_rate_limit:"Terlalu banyak percobaan. Tunggu sebentar sebelum mencoba lagi.",
 signup_disabled:"Pendaftaran Owner sementara tidak tersedia. Hubungi administrator.",
 email_exists:"Akun sudah terdaftar. Jika belum diverifikasi, gunakan Kirim ulang email verifikasi.",
 INVALID_STATUS_TRANSITION:"Perubahan status pesanan tidak diizinkan.",INVALID_STOCK:"Stok tidak valid."};
 const lower=code.toLowerCase();
 if(lower.includes('email not confirmed')||lower.includes('email_not_confirmed'))return map.email_not_confirmed;
 if(lower.includes('invalid login credentials')||lower.includes('invalid_credentials'))return map.invalid_credentials;
 if(lower.includes('email rate limit')||lower.includes('rate limit'))return map.over_email_send_rate_limit;
 if(lower.includes('already registered')||lower.includes('user already registered'))return map.email_exists;
 return map[code]||map[lower]||((code==='HTTP_400'||code==='400')?'Permintaan login ditolak. Verifikasi email Owner dengan tautan terbaru, lalu coba lagi.':code.replaceAll('_',' '));
}
function fail(e){const m=String(e?.message||e);if(m.includes("AUTH_REQUIRED")||m.includes("JWT")){clearSession();renderLogin("Sesi berakhir. Silakan masuk lagi.")}else if(m.includes("STAFF_REQUIRED")){clearSession();renderLogin("Akun tidak memiliki akses Owner/Staff.")}else toast(errorText(m))}
async function go(p){
 const previous=state.page;
 if(previous!==p&&root.querySelector('.app'))instantViews.set(previous,root.innerHTML);
 state.page=p;const key=++navId;
 previewPage(p);
 try{
  if(p==='dashboard')await dashboard();else if(p==='orders')await orders();else if(p==='products')await products();else if(p==='members')await members();else if(p==='rewards')await rewards();else if(p==='operations')await operations();else if(p==='settings')await settings();
  if(key===navId&&state.page===p&&root.querySelector('.app'))instantViews.set(p,root.innerHTML);
 }catch(e){if(key===navId)fail(e)}
}

async function dashboard(){
 busy(true);try{
  const d=await ownerApi("dashboard");
  if(state.page!=='dashboard')return;root.innerHTML=shell(`<div class="section"><h2>Ringkasan Hari Ini</h2><div class="grid">
   <div class="metric"><div class="label">Pesanan hari ini</div><strong>${Number(d.today_orders||0)}</strong><div class="hint">Semua status</div></div>
   <div class="metric"><div class="label">Omzet selesai</div><strong>${rp(d.today_completed_revenue)}</strong><div class="hint">Hari ini</div></div>
   <div class="metric"><div class="label">Perlu diproses</div><strong>${Number(d.pending_processing||0)}</strong><div class="hint">Pending + proses</div></div>
   <div class="metric"><div class="label">Stok menipis</div><strong>${Number(d.low_stock||0)}</strong><div class="hint">≤ 5 unit</div></div>
   <div class="metric"><div class="label">Produk aktif</div><strong>${Number(d.active_products||0)}</strong><div class="hint">Katalog</div></div>
   <div class="metric"><div class="label">Member aktif</div><strong>${Number(d.active_members||0)}</strong><div class="hint">${Number(d.pending_redemptions||0)} reward menunggu</div></div>
  </div></div><div class="section"><h2>Pesanan Terbaru</h2>${(d.latest_orders||[]).map(orderCard).join("")||'<div class="empty">Belum ada pesanan.</div>'}</div>`,"dashboard")
 }catch(e){fail(e)}finally{busy(false)}
}
function orderCard(o){
 return `<div class="card"><div class="row"><div class="grow"><b>${esc(o.order_number||"Pesanan")}</b><div class="muted">${new Date(o.created_at).toLocaleString("id-ID")}</div></div><span class="badge ${esc(o.status)}">${esc(o.status)}</span></div><div class="row" style="margin-top:10px"><div class="grow money">${rp(o.total)}</div><button class="btn secondary" onclick="go('orders')">Buka</button></div></div>`
}

async function orders(){
 busy(true);try{
  const [d,settings]=await Promise.all([ownerApi('orders',{limit:150}),ownerApi('settings')]);
  const os=d.orders||[];state.cache.orders=os;state.cache.couriers=settings.couriers||[];
  if(state.page!=='orders')return;root.innerHTML=shell(`<div class="section"><h2>Pesanan & Pembayaran</h2><div class="subnav">${['','pending','processing','shipped','completed','cancelled'].map(x=>`<button onclick="filterOrderStatus('${x}')">${x||'Semua'}</button>`).join('')}</div><div class="search"><input placeholder="Cari nomor pesanan" oninput="filterOrders(this.value)"></div><div id="ordersList">${os.map(orderManageCard).join('')||'<div class="empty">Belum ada pesanan.</div>'}</div></div>`,'orders');
 }catch(e){fail(e)}finally{busy(false)}
}
function orderManageCard(o){
 const p=o.payment||{},next=o.status==='pending'?'processing':o.status==='processing'?(o.fulfillment_type==='pickup'?'completed':'shipped'):o.status==='shipped'?'completed':null;
 const first=o.items?.[0],c=o.courier||{},cs=state.cache.couriers||[];
 const canContinue=p.method==='cod'||p.status==='paid';
 return `<div class="card order-item" data-status="${esc(o.status)}" data-q="${esc(((o.order_number||'')+' '+o.status+' '+(first?.product_name||'')).toLowerCase())}">
  <div class="row"><div class="grow"><b>${esc(o.order_number||o.id)}</b><div class="muted">${new Date(o.created_at).toLocaleString('id-ID')} • ${o.fulfillment_type==='pickup'?'Pick Up':'Delivery'}</div></div><span class="badge ${esc(o.status)}">${esc(o.status)}</span></div>
  ${first?`<div style="margin-top:10px"><b>${esc(first.product_name)}</b><div class="muted">${(o.items||[]).length} jenis produk</div></div>`:''}
  <div class="money" style="margin-top:10px">${rp(o.total)}</div>
  <div class="row" style="margin-top:12px"><div class="grow"><b>Pembayaran: ${p.method==='transfer'?'Transfer':'COD'}</b><div class="muted">Status: ${esc(p.status||'pending')}${p.review_note?' • '+esc(p.review_note):''}</div></div></div>
  ${p.proof_url?`<button class="btn secondary" style="margin-top:8px" onclick="Native.openUrl('${esc(p.proof_url)}')">Lihat Bukti Transfer</button>`:''}
  ${p.method==='transfer'&&p.status==='submitted'&&o.status!=='cancelled'?`<div class="actions"><button class="btn" onclick="reviewPayment('${o.id}','approve')">Konfirmasi Transfer</button><button class="btn danger" onclick="reviewPayment('${o.id}','reject')">Tolak Bukti</button></div>`:''}
  ${p.method==='cod'&&p.status==='pending'&&o.status!=='cancelled'?`<div class="actions"><button class="btn secondary" onclick="confirmCod('${o.id}')">Konfirmasi COD Diterima</button></div>`:''}
  ${o.fulfillment_type==='delivery'&&o.status!=='cancelled'&&o.status!=='completed'?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><b>Pilih Kurir Delivery</b><div class="muted">${c.name?'Ditugaskan: '+esc(c.name):'Belum ditugaskan'}${c.whatsapp?' • WA '+esc(c.whatsapp):''}</div><div class="row" style="margin-top:6px"><select id="courier-${o.id}" class="grow" style="min-width:0;padding:10px;border-radius:10px"><option value="">Pilih kurir</option>${cs.filter(x=>x.active).map(x=>`<option value="${x.id}" ${o.courier_id===x.id?'selected':''}>${esc(x.name)} • ${rp(x.flat_fee)}</option>`).join('')}</select><button class="btn" onclick="assignCourier('${o.id}')">Tugaskan</button></div>${p.method==='transfer'?`<div class="muted">Untuk transfer, kurir harus memiliki ongkir Rp0 agar total tidak berubah setelah pembayaran.</div>`:''}</div>`:''}
  <div class="actions">${next&&canContinue?`<button class="btn" onclick="setOrderStatus('${o.id}','${next}')">${next==='processing'?'Proses':next==='shipped'?'Kirim':'Selesaikan'}</button>`:''}${next&&!canContinue?'<div class="muted">Menunggu bukti dan konfirmasi transfer.</div>':''}${['pending','processing'].includes(o.status)&&p.status!=='paid'&&p.status!=='submitted'?`<button class="btn danger" onclick="setOrderStatus('${o.id}','cancelled')">Batalkan</button>`:''}</div>
 </div>`;
}
function filterOrders(q){q=q.toLowerCase();document.querySelectorAll('.order-item').forEach(x=>x.classList.toggle('hidden',!x.dataset.q.includes(q)))}
function filterOrderStatus(s){document.querySelectorAll('.order-item').forEach(x=>x.classList.toggle('hidden',!!s&&x.dataset.status!==s))}
async function setOrderStatus(id,status){
 if(!confirm('Ubah status pesanan menjadi '+status+'?'))return;
 busy(true);try{await ownerApi('set_order_status',{id,status});toast('Status diperbarui.');await orders()}catch(e){fail(e)}finally{busy(false)}
}
async function reviewPayment(id,decision){
 const note=decision==='reject'?prompt('Alasan penolakan bukti transfer (wajib):','Foto tidak jelas'):'';
 if(note===null||decision==='reject'&&!note.trim())return;
 if(decision==='approve'&&!confirm('Pastikan dana sudah masuk ke rekening. Konfirmasi pembayaran?'))return;
 busy(true);try{await ownerApi('payment_review',{id,decision,note});toast('Pembayaran diperbarui.');await orders()}catch(e){fail(e)}finally{busy(false)}
}
async function confirmCod(id){if(!confirm('Pastikan uang COD telah diterima.'))return;busy(true);try{await ownerApi('confirm_cod_payment',{id});toast('COD dikonfirmasi.');await orders()}catch(e){fail(e)}finally{busy(false)}}
async function assignCourier(id){
 const courier_id=document.getElementById('courier-'+id)?.value;
 if(!courier_id)return toast('Pilih kurir terlebih dahulu.');
 busy(true);try{await ownerApi('assign_courier',{id,courier_id});toast('Kurir ditugaskan. Member dapat melihat kontak kurir.');await orders()}catch(e){fail(e)}finally{busy(false)}
}

async function products(){
 busy(true);try{
  const d=await ownerApi("products"),ps=d.products||[],vs=d.variants||[];
  state.cache.products=d;
  const html=ps.map(p=>`<div class="card"><div class="row"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${vs.filter(v=>v.product_id===p.id).length} varian ${p.best_seller?"• Best seller":""}</div></div><button class="switch ${p.active?"on":""}" onclick="toggleProduct('${p.id}',${!p.active})"></button></div>${vs.filter(v=>v.product_id===p.id).map(v=>`<div class="row" style="padding-top:12px;margin-top:12px;border-top:1px solid var(--line)"><div class="grow"><b style="font-size:13px">${esc(v.name)}</b><div class="muted">${rp(v.price)} • ${v.active?"Aktif":"Nonaktif"}</div></div><div class="stock"><button onclick="stock('${v.id}',${Math.max(0,Number(v.stock)-1)})">−</button><b>${v.stock}</b><button onclick="stock('${v.id}',${Number(v.stock)+1})">+</button></div><button class="btn secondary" onclick="editVariant('${v.id}')">Edit</button></div>`).join("")}</div>`).join("");
  if(state.page!=='products')return;root.innerHTML=shell(`<div class="section"><h2>Produk & Stok</h2>${html||'<div class="empty">Produk belum tersedia.</div>'}</div>`,"products")
 }catch(e){fail(e)}finally{busy(false)}
}
async function stock(id,n){busy(true);try{await ownerApi("set_stock",{id,stock:n});await products()}catch(e){fail(e)}finally{busy(false)}}
async function toggleProduct(id,on){busy(true);try{await ownerApi("set_product_active",{id,active:on});await products()}catch(e){fail(e)}finally{busy(false)}}
async function editVariant(id){
 const v=(state.cache.products?.variants||[]).find(x=>x.id===id);if(!v)return;
 const name=prompt("Nama varian",v.name);if(name===null)return;
 const price=prompt("Harga (angka)",v.price);if(price===null)return;
 const stockValue=prompt("Stok (angka)",v.stock);if(stockValue===null)return;
 busy(true);try{
  await ownerApi("update_variant",{id,name:name.trim(),price:Number(price),stock:Number(stockValue),active:!!v.active});
  toast("Varian diperbarui.");await products()
 }catch(e){fail(e)}finally{busy(false)}
}

async function members(){
 busy(true);try{
  const d=await ownerApi("members",{limit:200}),ms=d.members||[];
  if(state.page!=='members')return;root.innerHTML=shell(`<div class="section"><h2>Member</h2><div class="search"><input placeholder="Cari member" oninput="filterMembers(this.value)"></div><div id="memberList">${ms.map(m=>`<div class="card member-item" data-q="${esc(((m.full_name||"")+" "+(m.username||"")+" "+(m.email||"")).toLowerCase())}"><div class="row"><div class="grow"><b>${esc(m.full_name||m.username||"Member")}</b><div class="muted">@${esc(m.username||"-")} • ${esc(m.email||"-")}</div><div class="muted">${esc(m.level||"Classic")} • ${Number(m.points||0)} Point</div></div><span class="badge">${esc(m.status||"active")}</span></div></div>`).join("")||'<div class="empty">Belum ada member.</div>'}</div></div>`,"members")
 }catch(e){fail(e)}finally{busy(false)}
}
function filterMembers(q){q=q.toLowerCase();document.querySelectorAll(".member-item").forEach(x=>x.classList.toggle("hidden",!x.dataset.q.includes(q)))}

async function rewards(){
 busy(true);try{
  const d=await ownerApi("rewards"),rs=d.rewards||[],reds=d.redemptions||[];
  if(state.page!=='rewards')return;root.innerHTML=shell(`<div class="section"><div class="row"><h2 class="grow">Reward & Penukaran</h2><button class="btn secondary" onclick="go('settings')">Kembali</button></div><h3>Reward</h3>${rs.map(r=>`<div class="card"><div class="row"><div class="grow"><b>${esc(r.product_name)}</b><div class="muted">${esc(r.variant_name||"")} • ${r.points_cost} Point</div></div><div class="stock"><button onclick="rewardStock('${r.id}',${Math.max(0,Number(r.stock)-1)})">−</button><b>${r.stock}</b><button onclick="rewardStock('${r.id}',${Number(r.stock)+1})">+</button></div></div></div>`).join("")}<h3>Menunggu Diproses</h3>${reds.filter(x=>x.status==="pending").map(x=>`<div class="card"><div class="row"><div class="grow"><b>${esc(x.reward?.product_name||"Reward")}</b><div class="muted">${x.points_spent} Point • ${new Date(x.created_at).toLocaleString("id-ID")}</div></div><span class="badge pending">pending</span></div><div class="actions"><button class="btn" onclick="redemptionStatus('${x.id}','fulfilled')">Selesai</button><button class="btn danger" onclick="redemptionStatus('${x.id}','cancelled')">Batalkan & refund point</button></div></div>`).join("")||'<div class="empty">Tidak ada penukaran pending.</div>'}</div>`,"settings")
 }catch(e){fail(e)}finally{busy(false)}
}
async function rewardStock(id,n){busy(true);try{await ownerApi("set_reward_stock",{id,stock:n});await rewards()}catch(e){fail(e)}finally{busy(false)}}
async function redemptionStatus(id,status){if(!confirm("Ubah status reward menjadi "+status+"?"))return;busy(true);try{await ownerApi("set_redemption_status",{id,status});await rewards()}catch(e){fail(e)}finally{busy(false)}}

async function operations(){
 busy(true);try{
  const d=await ownerApi('settings'),bs=d.banners||[],cs=d.couriers||[],bank=d.bank_transfer||{};
  state.cache.operations=d;
  if(state.page!=='operations')return;root.innerHTML=shell(`<div class="section"><div class="row"><h2 class="grow">Pengaturan Operasional</h2><button class="btn secondary" onclick="go('settings')">Kembali</button></div>
   <div class="card"><h3>Rekening Transfer Cireng Indi</h3><div class="muted">Data rekening resmi Intan Istiqomah. Pilih BSI atau BRI untuk mengisi form rekening aktif, lalu simpan. Member dapat memilih BSI atau BRI per pesanan. Rekening terpilih tersimpan dalam detail pembayaran.</div><div class="bankReference"><button type="button" onclick="fillBank('BSI')"><b>BSI</b><span>7306336217</span><span>Intan Istiqomah</span></button><button type="button" onclick="fillBank('BRI')"><b>BRI</b><span>457901008978533</span><span>Intan Istiqomah</span></button></div>
   <label>Bank</label><input id="bankname" style="width:100%;margin:6px 0 10px" value="${esc(bank.bank_name||'')}" placeholder="Nama Bank">
   <label>Nomor rekening</label><input id="banknumber" inputmode="numeric" style="width:100%;margin:6px 0 10px" value="${esc(bank.account_number||'')}" placeholder="Nomor rekening asli">
   <label>Nama pemilik rekening</label><input id="bankholder" style="width:100%;margin:6px 0 10px" value="${esc(bank.account_holder||'')}" placeholder="Atas nama">
   <label style="display:flex;align-items:center;gap:10px;margin-top:8px"><input id="bankenabled" type="checkbox" ${bank.enabled?'checked':''}>Aktifkan transfer bank</label>
   <button class="btn" style="margin-top:12px" onclick="saveBank()">Simpan Rekening</button></div>
   <h3>Kurir Delivery</h3>${cs.map(c=>`<div class="card"><div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="muted">Ongkir ${rp(c.flat_fee)} • WhatsApp ${esc(c.whatsapp||'-')}</div></div><button class="switch ${c.active?'on':''}" onclick="toggleCourier('${c.id}',${!c.active})"></button><button class="btn secondary" onclick="editCourier('${c.id}')">Edit</button></div></div>`).join('')}
   <h3>Banner</h3>${bs.map(b=>`<div class="card"><div class="row"><div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.subtitle||'')}</div></div><button class="switch ${b.active?'on':''}" onclick="toggleBanner('${b.id}',${!b.active})"></button></div></div>`).join('')}
  </div>`,'settings');
 }catch(e){fail(e)}finally{busy(false)}
}
function fillBank(name){const banks={BSI:'7306336217',BRI:'457901008978533'};if(!banks[name])return;document.getElementById('bankname').value=name;document.getElementById('banknumber').value=banks[name];document.getElementById('bankholder').value='Intan Istiqomah';toast('Data '+name+' terisi. Simpan rekening untuk menerapkan.');}
async function saveBank(){
 const d={bank_name:bankname.value.trim(),account_number:banknumber.value.trim(),account_holder:bankholder.value.trim(),enabled:bankenabled.checked};
 if(d.enabled&&(!d.bank_name||!d.account_number||!d.account_holder))return toast('Lengkapi semua data rekening.');
 busy(true);try{await ownerApi('set_bank_transfer',d);toast('Rekening berhasil disimpan.');await operations()}catch(e){fail(e)}finally{busy(false)}
}
async function toggleBanner(id,active){const b=(state.cache.operations?.banners||[]).find(x=>x.id===id);if(!b)return;busy(true);try{await ownerApi('update_banner',{id:b.id,title:b.title,subtitle:b.subtitle,kind:b.kind,active,sort_order:b.sort_order});await operations()}catch(e){fail(e)}finally{busy(false)}}
async function toggleCourier(id,active){const c=(state.cache.operations?.couriers||[]).find(x=>x.id===id);if(!c)return;busy(true);try{await ownerApi('update_courier',{id:c.id,name:c.name,flat_fee:Number(c.flat_fee||0),active,sort_order:c.sort_order,whatsapp:c.whatsapp});await operations()}catch(e){fail(e)}finally{busy(false)}}
async function editCourier(id){
 const c=(state.cache.operations?.couriers||[]).find(x=>x.id===id);if(!c)return;
 const name=prompt('Nama kurir',c.name);if(name===null)return;
 const fee=prompt('Ongkir (Rp, angka)',c.flat_fee||0);if(fee===null)return;
 const whatsapp=prompt('WhatsApp kurir (format 62...)',c.whatsapp||'');if(whatsapp===null)return;
 busy(true);try{await ownerApi('update_courier',{id:c.id,name:name.trim(),flat_fee:Number(fee),active:!!c.active,sort_order:c.sort_order,whatsapp:whatsapp.trim()});toast('Kurir diperbarui.');await operations()}catch(e){fail(e)}finally{busy(false)}
}

async function settings(){
 busy(true);try{
  const me=await ownerApi("me");
  if(state.page!=='settings')return;root.innerHTML=shell(`<div class="section"><h2>Lainnya</h2><div class="card"><div class="row">${icon("i-store")}<div class="grow"><b>${esc(me.staff?.full_name||"Owner")}</b><div class="muted">${esc(me.staff?.role||"staff")} • ${esc(me.email||"")}</div></div></div></div><div class="card" onclick="go('rewards')"><div class="row">${icon("i-cash")}<div class="grow"><b>Reward & Penukaran</b><div class="muted">Stok reward dan persetujuan penukaran</div></div><b>›</b></div></div><div class="card" onclick="go('operations')"><div class="row">${icon("i-settings")}<div class="grow"><b>Rekening, Banner & Kurir</b><div class="muted">Kontrol konten operasional</div></div><b>›</b></div></div><div class="card"><div class="row">${icon("i-alert")}<div class="grow"><b>Keamanan</b><div class="muted">Semua mutasi sensitif divalidasi kembali oleh backend dan role staff.</div></div></div></div><div class="card"><div class="kv"><span>Aplikasi</span><b>Cireng Indi Owner</b></div><div class="kv"><span>Versi</span><b>${esc(Native.appVersion())}</b></div><div class="kv"><span>Pembayaran</span><b>COD & Transfer (jika diaktifkan)</b></div></div><button class="btn danger" style="width:100%" onclick="logout()">${icon("i-logout")} Keluar</button></div>`,"settings")
 }catch(e){fail(e)}finally{busy(false)}
}
async function logout(){busy(true);try{try{await ownerApi("logout")}catch(e){}clearSession();renderLogin()}finally{busy(false)}}

(async()=>{state.session=getSession();if(state.session?.access_token){busy(true);try{if(await verifyStaff())await dashboard();else{clearSession();renderLogin("Akun ini belum memiliki role Owner/Staff.")}}finally{busy(false)}}else renderLogin()})();
</script>
</body>
</html>
