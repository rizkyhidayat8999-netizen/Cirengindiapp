<script>
const SUPABASE_URL="https://tbviryuimoxgapubdjio.supabase.co";
const KEY="sb_publishable_DxP6XDJP2XfZAC45pAniHQ_1WJqC4Fr";
const state={session:null,page:"dashboard",cache:{},uiPreview:false};
const root=document.getElementById("root");
const instantViews=new Map();const pendingOwnerActions=new Set();let navId=0;
function reserveAction(key){if(pendingOwnerActions.has(key))return false;pendingOwnerActions.add(key);return true}
function releaseAction(key){pendingOwnerActions.delete(key)}
function previewPage(page){
 const old=instantViews.get(page);
 if(old){root.innerHTML=old;return;}
 const titles={dashboard:'Dashboard',orders:'Pesanan & Pembayaran',products:'Produk & Stok',members:'Member',rewards:'Reward & Penukaran',vouchers:'Voucher Member',operations:'Pengaturan Operasional',settings:'Lainnya'};

}
const icon=(id)=>`<svg class="icon"><use href="#${id}"></use></svg>`;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function getSession(){try{const s=Native.getSession();return s?JSON.parse(s):null}catch(e){return null}}
function saveSession(s){state.session=s;Native.saveSession(JSON.stringify(s))}
function clearSession(){state.session=null;instantViews.clear();pendingOwnerActions.clear();Native.clearSession()}

async function parse(r){const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch(e){}if(!r.ok){const reason=d.error_code||d.error_description||d.msg||d.message||d.error||((typeof d.code==='string'&&!/^\d+$/.test(d.code))?d.code:null)||('HTTP_'+r.status);const error=new Error(String(reason));error.status=r.status;throw error;}return d}
async function loginAuth(email,password){
 return parse(await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
  method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})
 }))
}
async function refresh(){
 const s=state.session||getSession();if(!s?.refresh_token)throw new Error("AUTH_REQUIRED");
 const d=await parse(await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
  method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})
 }));
 saveSession(d);return d
}
async function ownerApi(action,payload={},retry=true){
 if(state.uiPreview)throw new Error("PREVIEW_READ_ONLY");
 let s=state.session||getSession();state.session=s;if(!s?.access_token)throw new Error("AUTH_REQUIRED");
 const r=await fetch(SUPABASE_URL+"/functions/v1/cirengindi-owner-api",{
  method:"POST",
  headers:{"apikey":KEY,"Authorization":"Bearer "+s.access_token,"Content-Type":"application/json"},
  body:JSON.stringify({action,...payload})
 });
 if(r.status===401&&retry&&s?.refresh_token){await refresh();return ownerApi(action,payload,false)}
 return parse(r)
}

function ownerRecoveryTokenFromLink(text){
 const raw=String(text||'').trim();
 if(raw.length<20||raw.length>8192)return null;
 let url;
 try{url=new URL(raw)}catch(_){return null}
 const host=url.hostname.toLowerCase();
 if(!['tbviryuimoxgapubdjio.supabase.co','cirengindi.com','www.cirengindi.com','localhost','127.0.0.1'].includes(host))
  return null;
 if(url.protocol!=='https:'&&url.protocol!=='http:')return null;
 const hash=new URLSearchParams(url.hash.replace(/^#/,''));
 const type=url.searchParams.get('type')||hash.get('type');
 if(type&&type!=='recovery')return null;
 const token=url.searchParams.get('token_hash')||url.searchParams.get('token')||hash.get('token_hash');
 if(token&&/^[A-Za-z0-9._~-]{24,512}$/.test(token))return {token_hash:token};
 const accessToken=hash.get('access_token');
 if(accessToken&&accessToken.length>=64&&accessToken.length<=8192)
  return {access_token:accessToken};
 return null;
}
async function completeOwnerRecovery(){
 const email=(document.getElementById('ownerResetEmail')?.value||'').trim().toLowerCase();
 const otp=(document.getElementById('ownerResetOtp')?.value||'').trim();
 const link=(document.getElementById('ownerRecoveryLink')?.value||'').trim();
 const password=document.getElementById('ownerNewPassword')?.value||'';
 const confirmation=document.getElementById('ownerConfirmPassword')?.value||'';
 if(password.length<8||password.length>128||!/[a-z]/i.test(password)||!/[0-9]/.test(password))
  return ownerRecoveryMessage('Password harus 8–128 karakter dan mengandung huruf serta angka.');
 if(password!==confirmation)return ownerRecoveryMessage('Konfirmasi password belum sama.');
 let proof=null;
 if(otp){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||!/^\d{6}$/.test(otp))
   return ownerRecoveryMessage('Isi email dan kode OTP 6 angka yang benar.');
  proof={email,token:otp,type:'recovery'};
 }else{
  const legacy=ownerRecoveryTokenFromLink(link);
  if(!legacy)return ownerRecoveryMessage('Masukkan kode OTP 6 angka atau tautan pemulihan yang sah dari email.');
  if(legacy.access_token)proof={access_token:legacy.access_token};
  else proof={token_hash:legacy.token_hash,type:'recovery'};
 }
 if(!reserveAction('owner-reset-password'))return;
 const button=document.getElementById('ownerConfirmRecovery');
 if(button){button.disabled=true;button.textContent='Memverifikasi…'}
 ownerRecoveryMessage('');
 try{
  // GoTrue validates a single-use recovery token and returns a scoped session.
  // Do not store the recovery token in local storage / Android secure session.
  let token=proof.access_token||'';
  if(!token){
   const verified=await parse(await fetch(SUPABASE_URL+'/auth/v1/verify',{
    method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(proof)
   }));
   token=verified.access_token||verified.session?.access_token||'';
  }
  if(!token)throw new Error('RESET_TOKEN_EXPIRED');
  // Explicit Owner role check BEFORE changing password. Member or Staff credentials
  // cannot be used to change password through this Owner-only flow.
  const identity=await parse(await fetch(SUPABASE_URL+'/functions/v1/cirengindi-owner-api',{
   method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},
   body:JSON.stringify({action:'me'})
  }));
  if(identity.staff?.role!=='owner'||identity.staff?.active!==true)
   throw new Error('OWNER_REQUIRED');
  const changed=await parse(await fetch(SUPABASE_URL+'/auth/v1/user',{
   method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},
   body:JSON.stringify({password})
  }));
  if(!changed||changed.error)throw new Error('PASSWORD_RESET_UNAVAILABLE');
  ownerRecovery.email='';
  renderLogin('Password Owner berhasil diperbarui. Silakan masuk menggunakan password baru.');
 }catch(e){
  const code=String(e?.message||e).toUpperCase();
  if(code.includes('OWNER_REQUIRED')||code.includes('STAFF_REQUIRED')||code.includes('AUTH_REQUIRED'))
   ownerRecoveryMessage('Kode pemulihan hanya bisa digunakan untuk akun Owner yang sudah terverifikasi dan aktif.');
  else if(code.includes('RATE'))ownerRecoveryMessage('Terlalu banyak percobaan. Tunggu sebentar, lalu kirim kode baru.');
  else ownerRecoveryMessage('Kode OTP atau tautan salah, sudah terpakai, atau kedaluwarsa. Minta email pemulihan baru.');
 }finally{
  releaseAction('owner-reset-password');
  if(button?.isConnected){button.disabled=false;button.textContent='Verifikasi & Simpan Password'}
 }
}

function errorText(m){
 const code=String(m||'').trim();
 const map={AUTH_REQUIRED:"Sesi berakhir. Silakan masuk kembali.",STAFF_REQUIRED:"Akun belum mempunyai akses Owner. Pastikan email sudah diverifikasi, lalu masuk ulang.",
 email_not_confirmed:"Email Owner belum diverifikasi. Buka pesan verifikasi dari Supabase di inbox atau spam, lalu coba masuk kembali.",
 invalid_credentials:"Email atau password tidak sesuai. Periksa kembali atau buat akun Owner terlebih dahulu.",
 user_not_found:"Akun belum terdaftar. Gunakan menu Aktivasi Akun Owner.",
 over_email_send_rate_limit:"Terlalu sering meminta email. Coba lagi beberapa menit kemudian.",
 over_request_rate_limit:"Terlalu banyak percobaan. Tunggu sebentar sebelum mencoba lagi.",
 signup_disabled:"Pendaftaran Owner sementara tidak tersedia. Hubungi administrator.",
 email_exists:"Akun sudah terdaftar. Jika belum diverifikasi, gunakan Kirim ulang email verifikasi.",
 INVALID_STATUS_TRANSITION:"Perubahan status pesanan tidak diizinkan.",INVALID_STOCK:"Stok tidak valid."};
 const lower=code.toLowerCase();
 if(lower.includes('email not confirmed')||lower.includes('email_not_confirmed'))return map.email_not_confirmed;
 if(lower.includes('invalid login credentials')||lower.includes('invalid_credentials'))return map.invalid_credentials;
 if(lower.includes('email rate limit')||lower.includes('rate limit'))return map.over_email_send_rate_limit;
 if(lower.includes('already registered')||lower.includes('user already registered'))return map.email_exists;
 return map[code]||map[lower]||((code==='HTTP_400'||code==='400')?'Permintaan login ditolak. Verifikasi email Owner dengan tautan terbaru, lalu coba lagi.':code.replaceAll('_',' '));
}
function fail(e){const m=String(e?.message||e);if(m.includes("AUTH_REQUIRED")||m.includes("JWT")){clearSession();renderLogin("Sesi berakhir. Silakan masuk lagi.")}else if(m.includes("STAFF_REQUIRED")){clearSession();renderLogin("Akun tidak memiliki akses Owner/Staff.")}else toast(errorText(m))}

  if(state.page!=='rewards')return;root.innerHTML=shell(`<div class="section"><div class="row"><h2 class="grow">Reward & Penukaran</h2><button class="btn secondary" onclick="go('settings')">Kembali</button></div><h3>Reward</h3>${rs.map(r=>`<div class="card"><div class="row"><div class="grow"><b>${esc(r.product_name)}</b><div class="muted">${esc(r.variant_name||"")} • ${r.points_cost} Point</div></div><div class="stock"><button onclick="rewardStock('${r.id}',${Math.max(0,Number(r.stock)-1)})">−</button><b>${r.stock}</b><button onclick="rewardStock('${r.id}',${Number(r.stock)+1})">+</button></div></div></div>`).join("")}<h3>Menunggu Diproses</h3>${reds.filter(x=>x.status==="pending").map(x=>`<div class="card"><div class="row"><div class="grow"><b>${esc(x.reward?.product_name||"Reward")}</b><div class="muted">${x.points_spent} Point • ${new Date(x.created_at).toLocaleString("id-ID")}</div></div><span class="badge pending">pending</span></div><div class="actions"><button class="btn" onclick="redemptionStatus('${x.id}','fulfilled')">Selesai</button><button class="btn danger" onclick="redemptionStatus('${x.id}','cancelled')">Batalkan & refund point</button></div></div>`).join("")||'<div class="empty">Tidak ada penukaran pending.</div>'}</div>`,"settings")
 }catch(e){fail(e)}finally{busy(false)}
}
async function rewardStock(id,n){busy(true);try{await ownerApi("set_reward_stock",{id,stock:n});await rewards()}catch(e){fail(e)}finally{busy(false)}}
async function redemptionStatus(id,status){if(!confirm("Ubah status reward menjadi "+status+"?"))return;busy(true);try{await ownerApi("set_redemption_status",{id,status});await rewards()}catch(e){fail(e)}finally{busy(false)}}

async function operations(){
 busy(true);try{
  const d=await ownerApi('settings'),bs=d.banners||[],cs=d.couriers||[],bank=d.bank_transfer||{};
  state.cache.operations=d;
  if(state.page!=='operations')return;root.innerHTML=shell(`<div class="section"><div class="row"><h2 class="grow">Pengaturan Operasional</h2><button class="btn secondary" onclick="go('settings')">Kembali</button></div>
   <div class="card"><h3>Rekening Transfer Cireng Indi</h3><div class="muted">Data rekening resmi Intan Istiqomah. Pilih BSI atau BRI untuk mengisi form rekening aktif, lalu simpan. Member dapat memilih BSI atau BRI per pesanan. Rekening terpilih tersimpan dalam detail pembayaran.</div><div class="bankReference"><button type="button" onclick="fillBank('BSI')"><b>BSI</b><span>7306336217</span><span>Intan Istiqomah</span></button><button type="button" onclick="fillBank('BRI')"><b>BRI</b><span>457901008978533</span><span>Intan Istiqomah</span></button></div>
   <label>Bank</label><input id="bankname" style="width:100%;margin:6px 0 10px" value="${esc(bank.bank_name||'')}" placeholder="Nama Bank">
   <label>Nomor rekening</label><input id="banknumber" inputmode="numeric" style="width:100%;margin:6px 0 10px" value="${esc(bank.account_number||'')}" placeholder="Nomor rekening asli">
   <label>Nama pemilik rekening</label><input id="bankholder" style="width:100%;margin:6px 0 10px" value="${esc(bank.account_holder||'')}" placeholder="Atas nama">
   <label style="display:flex;align-items:center;gap:10px;margin-top:8px"><input id="bankenabled" type="checkbox" ${bank.enabled?'checked':''}>Aktifkan transfer bank</label>
   <button class="btn" style="margin-top:12px" onclick="saveBank()">Simpan Rekening</button></div>
   <h3>Kurir Delivery</h3>${cs.map(c=>`<div class="card"><div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="muted">Ongkir ${rp(c.flat_fee)} • WhatsApp ${esc(c.whatsapp||'-')}</div></div><button class="switch ${c.active?'on':''}" onclick="toggleCourier('${c.id}',${!c.active})"></button><button class="btn secondary" onclick="editCourier('${c.id}')">Edit</button></div></div>`).join('')}
   <h3>Banner</h3>${bs.map(b=>`<div class="card"><div class="row"><div class="grow"><b>${esc(b.title)}</b><div class="muted">${esc(b.subtitle||'')}</div></div><button class="switch ${b.active?'on':''}" onclick="toggleBanner('${b.id}',${!b.active})"></button></div></div>`).join('')}
  </div>`,'settings');
 }catch(e){fail(e)}finally{busy(false)}
}
function fillBank(name){const banks={BSI:'7306336217',BRI:'457901008978533'};if(!banks[name])return;document.getElementById('bankname').value=name;document.getElementById('banknumber').value=banks[name];document.getElementById('bankholder').value='Intan Istiqomah';toast('Data '+name+' terisi. Simpan rekening untuk menerapkan.');}
async function saveBank(){
 const d={bank_name:bankname.value.trim(),account_number:banknumber.value.trim(),account_holder:bankholder.value.trim(),enabled:bankenabled.checked};
 if(d.enabled&&(!d.bank_name||!d.account_number||!d.account_holder))return toast('Lengkapi semua data rekening.');
 if(!reserveAction('bank-settings'))return;
 try{await ownerApi('set_bank_transfer',d);toast('Rekening berhasil disimpan.');await operations()}catch(e){fail(e)}finally{releaseAction('bank-settings')}
}
async function toggleBanner(id,active){const b=(state.cache.operations?.banners||[]).find(x=>x.id===id);if(!b)return;busy(true);try{await ownerApi('update_banner',{id:b.id,title:b.title,subtitle:b.subtitle,kind:b.kind,active,sort_order:b.sort_order});await operations()}catch(e){fail(e)}finally{busy(false)}}
async function toggleCourier(id,active){const c=(state.cache.operations?.couriers||[]).find(x=>x.id===id);if(!c)return;busy(true);try{await ownerApi('update_courier',{id:c.id,name:c.name,flat_fee:Number(c.flat_fee||0),active,sort_order:c.sort_order,whatsapp:c.whatsapp});await operations()}catch(e){fail(e)}finally{busy(false)}}
async function editCourier(id){
 const c=(state.cache.operations?.couriers||[]).find(x=>x.id===id);if(!c)return;
 const name=prompt('Nama kurir',c.name);if(name===null)return;
 const fee=prompt('Ongkir (Rp, angka)',c.flat_fee||0);if(fee===null)return;
 const whatsapp=prompt('WhatsApp kurir (format 62...)',c.whatsapp||'');if(whatsapp===null)return;
 busy(true);try{await ownerApi('update_courier',{id:c.id,name:name.trim(),flat_fee:Number(fee),active:!!c.active,sort_order:c.sort_order,whatsapp:whatsapp.trim()});toast('Kurir diperbarui.');await operations()}catch(e){fail(e)}finally{busy(false)}
}


function ownerVoucherCard(v,data){
 const list=data.assignments||[];
 const usage=list.filter(a=>a.voucher_id===v.id&&a.status==='used').length;
 const claimed=list.filter(a=>a.voucher_id===v.id).length;
 const users=(data.members||[]).map(m=>'<option value="'+esc(m.user_id)+'">'+esc(m.username)+' · '+esc(m.full_name)+'</option>').join('');
 const discount=v.discount_type==='percent'?v.discount_value+'%':rp(v.discount_value);
 return '<div class="card"><div class="row"><div class="grow"><b>'+esc(v.title)+'</b><div class="muted">'+esc(v.code)+' • '+discount+' • Min. '+rp(v.min_spend)+'</div><div class="muted">Diterbitkan untuk '+(v.all_members?'semua member':'member pilihan')+' · '+claimed+' pemilik · '+usage+' terpakai</div><div class="muted">Berlaku sampai '+new Date(v.ends_at).toLocaleDateString('id-ID')+'</div></div><span class="badge '+(v.active?'completed':'cancelled')+'">'+(v.active?'Aktif':'Nonaktif')+'</span></div>'
  +(v.active?'<div class="row" style="margin-top:12px"><select class="grow" id="voucher-person-'+esc(v.id)+'" aria-label="Pilih member untuk voucher"><option value="">Pilih member</option>'+users+'</select><button class="btn" onclick="issueVoucher(\''+esc(v.id)+'\')">Beri</button></div>':'')
  +'<button class="btn secondary" style="margin-top:12px" onclick="toggleVoucher(\''+esc(v.id)+'\','+(!v.active)+')">'+(v.active?'Nonaktifkan':'Aktifkan')+'</button></div>';
}
async function vouchers(){
 const current=state.cache.vouchers;
 if(current&&state.page==='vouchers')renderOwnerVouchers(current);
 try{
  const data=await ownerApi('vouchers');state.cache.vouchers=data;
  if(state.page==='vouchers')renderOwnerVouchers(data);
 }catch(e){if(state.page==='vouchers')fail(e)}
}
function renderOwnerVouchers(data){
 root.innerHTML=shell('<div class="section"><div class="row"><h2 class="grow">Voucher Member</h2><button class="btn secondary" onclick="go(\'settings\')">Kembali</button></div>'
 +'<div class="card"><h3>Buat Voucher</h3><label>Judul voucher</label><input id="vTitle" placeholder="Contoh: Promo Cireng Indi" maxlength="100">'
 +'<label>Kode unik</label><input id="vCode" placeholder="CIRENG10" maxlength="30" autocomplete="off">'
 +'<div class="row"><div class="grow"><label>Tipe diskon</label><select id="vType"><option value="fixed">Nominal Rupiah</option><option value="percent">Persentase</option></select></div><div class="grow"><label>Nilai diskon</label><input id="vValue" type="number" min="1" placeholder="10000"></div></div>'
 +'<label>Minimal belanja (Rp)</label><input id="vMin" type="number" min="0" value="0">'
 +'<label>Berlaku untuk</label><select id="vScope"><option value="all">Pick Up & Delivery</option><option value="pickup">Pick Up</option><option value="delivery">Delivery</option></select>'
 +'<label>Masa berlaku sampai</label><input id="vExpiry" type="datetime-local">'
 +'<label class="row" style="gap:8px"><input id="vAll" type="checkbox" style="width:20px" ><span>Voucher tersedia untuk semua member</span></label>'
 +'<button class="full" onclick="createVoucher()">Terbitkan Voucher</button></div>'
 +'<h3>Voucher Diterbitkan</h3>'+(data.vouchers||[]).map(v=>ownerVoucherCard(v,data)).join('')
 +'</div>','settings');
}
async function createVoucher(){
 if(!reserveAction('create-voucher'))return;
 try{
  const expiry=document.getElementById('vExpiry').value;
  if(!expiry)throw new Error('Isi tanggal kedaluwarsa voucher.');
  await ownerApi('voucher_create',{
   title:document.getElementById('vTitle').value.trim(),
   code:document.getElementById('vCode').value.trim().toUpperCase(),
   discount_type:document.getElementById('vType').value,
   discount_value:Number(document.getElementById('vValue').value),
   min_spend:Number(document.getElementById('vMin').value||0),
   fulfillment_scope:document.getElementById('vScope').value,
   all_members:document.getElementById('vAll').checked,
   ends_at:new Date(expiry).toISOString()
  });
  toast('Voucher berhasil diterbitkan.');await vouchers();
 }catch(e){fail(e)}finally{releaseAction('create-voucher')}
}
async function issueVoucher(id){
 const member_id=document.getElementById('voucher-person-'+id)?.value;
 if(!member_id)return toast('Pilih member tujuan.');
 if(!reserveAction('voucher:'+id))return;
 try{await ownerApi('voucher_issue',{id,member_id});toast('Voucher berhasil diberikan.');await vouchers()}
 catch(e){fail(e)}finally{releaseAction('voucher:'+id)}
}
async function toggleVoucher(id,active){
 if(!reserveAction('voucher:'+id))return;
 try{await ownerApi('voucher_toggle',{id,active});toast('Status voucher diperbarui.');await vouchers()}
 catch(e){fail(e)}finally{releaseAction('voucher:'+id)}
}

 }catch(e){fail(e)}finally{busy(false)}
}

function enterOwnerPreview(){state.uiPreview=true;state.session=null;ownerPreview("dashboard")}
function exitOwnerPreview(){state.uiPreview=false;state.cache={};renderLogin()}
function previewNotice(){toast("Mode preview: aksi hanya simulasi, tidak menyimpan data.")}
function previewOrder(id,status,total){
 return '<div class="card"><div class="row"><div class="grow"><b>'+esc(id)+'</b><div class="muted">17 Oktober · Data contoh</div></div><span class="badge pending">'+esc(status)+'</span></div><div class="row" style="margin-top:10px"><strong class="grow money">'+rp(total)+'</strong><button class="btn secondary" onclick="previewNotice()">Rincian</button></div></div>';
}
function previewProducts(search){
 const q=String(search||"").trim().toLowerCase();
 const list=OWNER_PREVIEW_PRODUCTS.filter(p=>p.name.toLowerCase().includes(q));
 return list.length?list.map(p=>'<div class="card"><div class="row"><div class="grow"><b>'+esc(p.name)+'</b><div class="muted">Produk katalog · Stok contoh: 20</div></div><div style="text-align:right"><div class="money">'+rp(p.price)+'</div><button class="btn secondary" style="margin-top:7px" onclick="previewNotice()">Rincian</button></div></div></div>').join(""):'<div class="empty">Produk tidak ditemukan.</div>';
}
function filterPreviewProducts(v){const el=document.getElementById("previewProducts");if(el)el.innerHTML=previewProducts(v)}
function ownerPreview(page){
 if(!state.uiPreview)return;
 const allowed=["dashboard","orders","products","members","settings","vouchers","rewards","operations"];
 state.page=allowed.includes(page)?page:"dashboard";
 let body="",a=state.page;
 if(a==="dashboard"){
  body='<div class="section"><h2>Ringkasan Hari Ini</h2><div class="grid">'+[
   ["Pesanan hari ini","12"],["Omzet selesai","Rp750.000"],
   ["Perlu diproses","3"],["Stok menipis","2"],
   ["Produk aktif",String(OWNER_PREVIEW_PRODUCTS.length)],["Member aktif","98"]
  ].map(v=>'<div class="metric"><div class="label">'+v[0]+'</div><strong>'+v[1]+'</strong><div class="hint">Data contoh</div></div>').join("")+'</div></div><div class="section"><h2>Pesanan Terbaru</h2>'+previewOrder("CI-DEMO-001","Menunggu pembayaran",125000)+previewOrder("CI-DEMO-002","Diproses",89000)+'</div>';
 }else if(a==="orders"){
  body='<div class="section"><h2>Pesanan & Pembayaran</h2><div class="search"><input placeholder="Cari nomor pesanan" oninput="previewNotice()"></div>'+previewOrder("CI-DEMO-001","Pending",125000)+previewOrder("CI-DEMO-002","Diproses",89000)+'<div class="notice">Konfirmasi transfer dan penugasan kurir nonaktif pada preview.</div></div>';

  body='<div class="section"><h2>Lainnya</h2><div class="card"><b>Owner Preview</b><p class="muted">Tidak masuk ke akun Owner asli.</p></div>'+[
   ["Rekening, Banner & Kurir","operations"],["Voucher Member","vouchers"],["Reward & Penukaran","rewards"]
  ].map(v=>'<button class="btn secondary" style="width:100%;margin-bottom:9px" onclick="go(\''+v[1]+'\')">'+v[0]+' →</button>').join("")+
  '<div class="card"><b>Keamanan</b><p class="muted">Login Owner produksi tetap memerlukan akun terverifikasi dan izin owner.</p></div><button class="btn danger" style="width:100%" onclick="exitOwnerPreview()">Keluar Preview</button></div>';
 }else{
  const h={operations:"Rekening, Banner & Kurir",vouchers:"Voucher Member",rewards:"Reward & Penukaran"}[a]||"Preview";
  body='<div class="section"><h2>'+h+'</h2><div class="card"><b>'+h+' (contoh)</b><p class="muted">Halaman ini untuk tinjauan UI. Data dan tindakan produksi tidak tersedia.</p><button class="btn secondary" onclick="previewNotice()">Pratinjau Pengaturan</button></div></div>';
 }
 const banner='<div class="notice" style="margin:12px 18px 0" role="status"><b>MODE PREVIEW OWNER</b><div style="margin:5px 0">Tinjau dan revisi UI tanpa OTP. Data contoh; bukan akses akun produksi.</div><button class="btn secondary" onclick="exitOwnerPreview()">Keluar Preview</button></div>';
 root.innerHTML=shell(banner+body,["operations","vouchers","rewards"].includes(a)?"settings":a);
}

(async()=>{state.session=getSession();if(state.session?.access_token){previewPage('dashboard');try{if(await verifyStaff())await dashboard();else{clearSession();renderLogin("Akun ini belum memiliki role Owner/Staff.")}}catch(e){clearSession();renderLogin(errorText(e.message))}}else renderLogin()})();
