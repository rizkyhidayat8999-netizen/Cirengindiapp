plugins {
    id "com.android.application"
}

android {
    namespace "com.cirengindi.member"
    compileSdk 36

    defaultConfig {
        applicationId "com.cirengindi.member"
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName "2.1.2"
    }

    signingConfigs {
        if (System.getenv("CI_SIGNING_KEYSTORE")) {
            production {
                storeFile file(System.getenv("CI_SIGNING_KEYSTORE"))
                storePassword System.getenv("CI_STORE_PASSWORD")
                keyAlias System.getenv("CI_KEY_ALIAS")
                keyPassword System.getenv("CI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".internal"
            versionNameSuffix "-internal"
        }
        release {
            if (System.getenv("CI_SIGNING_KEYSTORE")) signingConfig signingConfigs.production
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
