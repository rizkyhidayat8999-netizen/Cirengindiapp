/* Premium design aligned with Cireng Indi storefront reference; keep navigation and checkout responsive. */
:root{--brand:#984c32;--brand2:#663123;--cream:#fff9f2;--soft:#f8e9dc;--line:#e9dace;--shadow:0 9px 27px rgba(83,47,29,.10)}
html,body{background:#fff8f0}.app{background:linear-gradient(160deg,#fffaf5 0%,#fff5e9 52%,#fff 100%)}
button,.locrow,.menurow,.card{touch-action:manipulation}
button:focus-visible,.locrow:focus-visible{outline:3px solid #bb6b44;outline-offset:2px}
.storeHead{position:relative;overflow:hidden;border-radius:0 0 34px 34px;background:radial-gradient(circle at 94% 3%,rgba(235,165,108,.30) 0 16%,transparent 17%),radial-gradient(circle at 0% 100%,rgba(36,13,9,.26) 0 20%,transparent 21%),linear-gradient(122deg,#5d3027 0%,#935238 60%,#b9764b 100%);padding:21px 20px 49px}
.storeHead h1{font-size:27px;line-height:1.2;display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:17px;font-weight:750;letter-spacing:-.5px}
.storeHead h1 .storeLogo{width:42px;height:42px;object-fit:contain;background:#fffdf9;border-radius:50%;padding:3px;box-shadow:0 3px 12px #35130d33}
.storeHead .storeTagline{margin:16px auto 0;max-width:360px;text-align:center;font-size:13px;line-height:1.45;font-weight:650;color:#ffe7c4}
.segment{width:100%;max-width:480px;box-shadow:0 6px 22px #1e100f18;background:#fffdf9}
.segment button{min-height:50px;font-size:17px}
.segment button.active{background:#f7e5d6;color:#90472e;border:1.5px solid #b67351}
.locationCard{position:relative;z-index:2;margin:-24px 16px 20px;background:#fffefa;border-color:#e5d5c6;border-radius:27px;box-shadow:0 13px 30px #5c2f241a}
.locrow{padding:17px 16px;min-height:80px}
.locrow:active{background:#fff5eb}
.locicon{width:48px;height:48px;flex:0 0 48px;background:#f9efe0}
.chips{padding:0 16px 16px;gap:8px}
.chip{background:#fffdf9;padding:10px 14px;border-color:#d9c9bc;font-size:14px}
.chip.active{border-color:#a35335;color:#9b482c;box-shadow:0 4px 8px #8d492018}
.promo{border-color:#efddbb;border-radius:25px;margin:0 16px 22px;background:linear-gradient(115deg,#fffaf0,#fbead0);box-shadow:0 9px 21px #a3724920}
.promo .circle{border-radius:18px;width:52px;height:52px;flex-shrink:0;box-shadow:0 5px 15px #b8884818}
.promo:active{transform:scale(.995)}
.section h2{letter-spacing:-.4px}
.hscroll{padding-left:16px;padding-right:16px}
.pCard{min-width:min(320px,88vw);grid-template-columns:105px minmax(0,1fr) 38px;border-radius:24px;box-shadow:0 8px 20px #85492313}
.pCard img{width:105px;height:106px;border-radius:18px}
.pCard h3,.prow h3{font-size:18px}
.pCard .meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add{background:var(--brand);width:38px;height:38px;border-radius:13px}
.productList{padding:0 16px 10px}
.prow{border:1px solid #e9dace;background:#fffefc;border-radius:23px;padding:12px;margin-bottom:12px;box-shadow:0 5px 15px #7137190d}
.prow img{border-radius:15px}
.bottomnav{background:#fffdfa;box-shadow:0 -4px 18px #56331e11}
.bottomnav button.active{color:var(--brand2)}
.top .topBrand{position:absolute;right:16px;width:35px;height:35px;object-fit:contain;border-radius:50%;background:#fffaf4}
@media(max-width:370px){.storeHead h1{font-size:23px}.locrow b{font-size:14px}.pCard{min-width:270px;grid-template-columns:90px minmax(0,1fr) 34px}.pCard img{width:90px;height:100px}.pCard .price{font-size:16px}}
@media(prefers-reduced-motion:reduce){.promo:active{transform:none}}


/* Enterprise-grade account entry: recovery is secondary, readable, and accessible */
.authTabs{max-width:100%;gap:10px;margin-bottom:16px}
.authTabs button{min-height:48px;font-size:14px;border:1px solid transparent}
.authTabs button.active{box-shadow:0 7px 16px rgba(102,49,35,.14)}
.auth .form{border-color:#e7d8ca;border-radius:24px;padding:20px 19px;box-shadow:0 12px 28px rgba(77,46,31,.08)}
.auth .form label{font-size:13px;margin:13px 0 7px}
.auth .form input{min-height:52px;border-radius:13px}
.auth-subactions{display:flex;justify-content:flex-end;margin-top:9px}
.auth-text-action{display:inline-flex;align-items:center;min-height:34px;padding:3px 0;border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer}
.auth-text-action:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.auth .fullbtn{min-height:52px;font-size:15px;margin-top:14px}
.auth-return{margin:6px 0 10px}
.auth-recovery-title{font-size:22px;margin:0 0 8px;color:var(--ink);letter-spacing:-.5px}
.auth .form .notice{font-size:13px;line-height:1.55;margin:0 0 15px}
@media(max-width:370px){.auth .form{padding:16px}.authTabs button{font-size:13px}.auth h1{font-size:26px}}
@media(max-height:700px){.auth{align-items:flex-start;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}.authLogo{width:92px;height:92px;margin-bottom:10px}.auth h1{font-size:26px}.auth .lead{margin:5px 0 14px}.auth .form{padding:16px}.authTabs{margin-bottom:12px}.auth .fullbtn{min-height:48px}}

.auth{min-height:100dvh;align-items:flex-start;padding:calc(25px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.authbox{margin:0 auto}
.auth--register .authLogo{width:72px;height:72px;margin-bottom:7px}
.auth--register h1{font-size:25px}.auth--register .lead{font-size:12px;margin:5px 0 12px}
.auth--register .form{padding:14px 17px}.auth--register .form label{margin:8px 0 5px}
.auth--register .form input{min-height:45px;padding:10px 12px}
.auth-feedback{background:#fff2e9;border:1px solid #e9bda8;color:#803524;padding:12px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px}
.auth-feedback:empty{display:none}
.auth--register .fullbtn:disabled{opacity:.65}
</style>

<div id="root"></div><div id="loader" class="loader hidden"><div class="spin"></div></div><div id="toast" class="toast"></div>
<script>
const SB='https://tbviryuimoxgapubdjio.supabase.co', KEY='sb_publishable_DxP6XDJP2XfZAC45pAniHQ_1WJqC4Fr';
const state={session:null,boot:null,me:null,route:'',category:'all',product:null,qty:1,fulfillment:'delivery'};
const root=document.getElementById('root');
const icon=(id,cls='')=>`<svg class="icon ${cls}"><use href="#${id}"></use></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=v=>'Rp'+Number(v||0).toLocaleString('id-ID');
const img=p=>{if(!p)return'';if(/^https?:/i.test(p))return p;return SB+'/storage/v1/object/public/cirengindi-products/'+String(p).split('/').map(encodeURIComponent).join('/')};
function loading(v){document.getElementById('loader').classList.toggle('hidden',!v)}let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
function sessionRead(){try{const r=Native.getSession();return r?JSON.parse(r):null}catch(e){return null}}function sessionSave(s){state.session=s;Native.saveSession(JSON.stringify(s))}function sessionClear(){state.session=null;state.me=null;Native.clearSession()}
async function parse(r){let d={};try{d=await r.json()}catch(e){}if(!r.ok){const m=d.error_code||d.error||d.message||('HTTP_'+r.status);const error=new Error(String(m));error.status=r.status;throw error;}return d}
async function auth(payload){return parse(await fetch(SB+'/functions/v1/member-auth',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(payload)}))}
async function refresh(){const s=state.session||sessionRead();if(!s?.refreshToken)throw new Error('AUTH_REQUIRED');const d=await parse(await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({refresh_token:s.refreshToken})}));sessionSave({accessToken:d.access_token,refreshToken:d.refresh_token,memberId:s.memberId||d.user?.id||''});return state.session}
async function api(action,payload={},secure=true,retry=true){let s=state.session||sessionRead();state.session=s;const h={'Content-Type':'application/json',apikey:KEY};if(secure&&s?.accessToken)h.Authorization='Bearer '+s.accessToken;const r=await fetch(SB+'/functions/v1/cirengindi-mobile-api',{method:'POST',headers:h,body:JSON.stringify({action,...payload})});if(r.status===401&&secure&&retry&&s?.refreshToken){await refresh();return api(action,payload,secure,false)}return parse(r)}
function fail(e){const m=String(e?.message||e);if(m==='AUTH_REQUIRED'||m.includes('JWT')){sessionClear();renderAuth('login');toast('Sesi berakhir. Silakan masuk lagi.');return}const map={INVALID_CREDENTIALS:'Username atau password salah.',USERNAME_TAKEN:'Username sudah digunakan.',EMAIL_TAKEN:'Email sudah digunakan.',WEAK_PASSWORD:'Password minimal 8 karakter dan mengandung huruf serta angka.',CART_EMPTY:'Keranjang masih kosong.',INSUFFICIENT_STOCK:'Stok tidak mencukupi.',INSUFFICIENT_POINTS:'Point belum cukup.'};toast(map[m]||m.replaceAll('_',' '))}
function shell(content,active='home'){const nav=[['home','i-home','Home'],['store','i-bag','Pesan'],['orders','i-receipt','Pesanan'],['profile','i-user','Akun']];return `<div class="app">${content}<nav class="bottomnav">${nav.map(n=>`<button class="${active===n[0]?'active':''}" onclick="go('${n[0]}')">${icon(n[1])}${n[2]}</button>`).join('')}</nav></div>`}
function uiTop(title,back='home'){return `<header class="top"><button class="back" onclick="go('${back}')">${icon('i-left')}</button><h1>${esc(title)}</h1><img class="topBrand" src="assets/logo_cireng_indi.png" alt="Logo Cireng Indi"></header>`}
function renderAuth(tab='login'){state.route='auth';let f='';if(tab==='login')f=`<div class="form"><label>Username</label><input id="luser" autocomplete="username"><label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password"><div class="auth-subactions"><button type="button" class="auth-text-action" onclick="renderAuth('forgot')">Lupa password?</button></div><button class="fullbtn" onclick="doLogin()">Masuk</button></div>`;if(tab==='register')f=`<div class="form"><div id="authStatus" class="auth-feedback" role="alert" aria-live="polite"></div><label>Nama lengkap</label><input id="rname"><label>Username</label><input id="ruser"><label>Email</label><input id="remail" type="email"><label>No. HP (opsional)</label><input id="rphone" inputmode="tel"><label>Kode referral (opsional)</label><input id="rref"><label>Password</label><input id="rpass" type="password"><label>Ulangi password</label><input id="rpass2" type="password"><button class="fullbtn" onclick="doRegister()">Daftar</button><div class="notice">Daftar tanpa OTP WhatsApp. Email dipakai untuk pemulihan password.</div></div>`;if(tab==='forgot')f=`<div class="form"><div class="auth-recovery-title">Atur ulang password</div><p class="notice">Masukkan email yang terhubung dengan akun. Kami akan mengirimkan tautan pemulihan jika email terdaftar.</p><label for="femail">Alamat email</label><input id="femail" type="email" inputmode="email" autocomplete="email" placeholder="contoh@email.com"><button class="fullbtn" onclick="doForgot()">Kirim Tautan Pemulihan</button><div class="auth-subactions"><button type="button" class="auth-text-action" onclick="renderAuth('login')">Kembali ke Masuk</button></div></div>`;root.innerHTML=`<section class="auth ${tab==='register'?'auth--register':''}"><div class="authbox"><img class="authLogo" src="assets/logo_cireng_indi.png"><h1>Cireng Indi</h1><p class="lead">Camilan & frozen food pilihan keluarga</p>${tab==='forgot'?'':`<div class="authTabs"><button type="button" class="${tab==='login'?'active':''}" onclick="renderAuth('login')">Masuk</button><button type="button" class="${tab==='register'?'active':''}" onclick="renderAuth('register')">Daftar</button></div>`}${f}</div></section>`}
async function doLogin(){const username=luser.value.trim(),password=lpass.value;if(!username||!password)return toast('Lengkapi username dan password.');loading(true);try{const d=await auth({action:'login',username,password});sessionSave({accessToken:d.session.access_token,refreshToken:d.session.refresh_token,memberId:d.member.user_id});state.boot=null;await go('home')}catch(e){fail(e)}finally{loading(false)}}
function registrationError(message){const box=document.getElementById('authStatus');if(box){box.textContent=message;box.scrollIntoView({block:'center'});}else toast(message)}
async function doRegister(){
 const fullName=rname.value.trim(),username=ruser.value.trim().toLowerCase(),email=remail.value.trim().toLowerCase(),
 phone=rphone.value.trim(),referralCode=rref.value.trim(),password=rpass.value;
 if(fullName.length<2)return registrationError('Nama lengkap minimal 2 karakter.');
 if(!/^[a-z0-9._]{3,24}$/.test(username))return registrationError('Username harus 3–24 karakter: huruf kecil, angka, titik, atau garis bawah.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return registrationError('Masukkan alamat email yang valid.');
 if(password.length<8||!/[a-z]/i.test(password)||!/[0-9]/.test(password))return registrationError('Password minimal 8 karakter, termasuk huruf dan angka.');
 if(password!==rpass2.value)return registrationError('Konfirmasi password tidak sama.');
 const submit=document.querySelector('.auth--register .fullbtn');
 if(submit?.disabled)return; if(submit){submit.disabled=true;submit.textContent='Memproses…'}
 const msg=document.getElementById('authStatus');if(msg)msg.textContent='';
 try{
  const d=await auth({action:'register',fullName,username,email,password,phone:phone||undefined,referralCode:referralCode||undefined});
  if(d.pendingVerification){renderAuth('login');toast('Pendaftaran diterima. Periksa email untuk verifikasi akun.');return}
  if(!d.session?.access_token)throw new Error('REGISTRATION_INCOMPLETE');
  sessionSave({accessToken:d.session.access_token,refreshToken:d.session.refresh_token,memberId:d.member.user_id});state.boot=null;await go('home');
 }catch(e){
  const m=String(e?.message||e).toLowerCase();
  if(/email.rate.limit|over_email_send_rate_limit|email_rate_limit|http_429/.test(m))registrationError('Pendaftaran belum berhasil karena layanan pengiriman email verifikasi sedang mencapai batas. Silakan coba nanti. Jangan menekan Daftar berulang kali.');
  else if(m.includes('username_taken'))registrationError('Username sudah digunakan.');
  else if(m.includes('email_taken'))registrationError('Email sudah terdaftar. Silakan masuk atau pulihkan password.');
  else registrationError('Pendaftaran belum berhasil: '+String(e.message||e).replaceAll('_',' '));
 }finally{if(submit?.isConnected){submit.disabled=false;submit.textContent='Daftar'}}
}
async function doForgot(){const email=document.getElementById('femail')?.value.trim()||'';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Masukkan alamat email yang valid.');loading(true);try{await auth({action:'forgot_password',email});renderAuth('login');toast('Jika email terdaftar, tautan pemulihan telah dikirim.')}catch(e){fail(e)}finally{loading(false)}}
async function boot(){if(state.boot)return state.boot;state.boot=await api('bootstrap',{},false);return state.boot}
async function go(r){state.route=r;try{if(r==='home')await home();else if(r==='store')await store();else if(r==='product')await product();else if(r==='addresses')await addresses();else if(r==='cart')await cart();else if(r==='checkout')await checkout();else if(r==='orders')await orders();else if(r==='rewards')await rewards();else if(r==='profile')await profile();window.scrollTo(0,0)}catch(e){fail(e)}}
async function home(){loading(true);try{const [m,b]=await Promise.all([api('me'),boot()]);state.me=m;const fav=(b.products||[]).filter(p=>p.best_seller).slice(0,2);root.innerHTML=shell(`<section class="hero"><img class="banner" src="assets/banner_reseller.webp"><img class="heroLogo" src="assets/logo_cireng_indi.png"><div class="heroCopy"><b>Renyah di luar, lembut di dalam</b><span>Camilan Cireng pilihan keluarga</span></div></section><div class="member"><h2>Hai, ${esc(m.profile.full_name||m.profile.username)}!</h2><div class="pills"><span class="pill">${icon('i-star','sm')} ${Number(m.points||0)} Point</span><span class="pill level">${esc(m.profile.level||"Classic")}</span><span class="pill ok">Aktif</span></div></div><div class="section"><h2>Mau Pesan Apa Hari Ini?</h2><div class="grid2"><button class="orderMode" onclick="go('store')"><div class="pic"><img src="assets/product_cireng_isi.webp"></div><div class="body"><b>Siap Makan</b><span>Langsung nikmati camilan favoritmu</span></div></button><button class="orderMode" onclick="go('store')"><div class="pic"><img src="assets/product_mix.webp"></div><div class="body"><b>Frozen</b><span>Stok camilan praktis di rumah</span></div></button></div></div><div class="section" style="padding-top:2px"><h2>Spesial Untukmu di Cireng Indi</h2><div class="featureGrid"><button class="feature" onclick="go('rewards')"><div class="circle">${icon('i-gift')}</div><b>Reward</b><span>Tukar point dengan hadiah</span></button><button class="feature"><div class="circle">${icon('i-store')}</div><b>Paket Reseller</b><span>Dapatkan harga khusus</span></button><button class="feature"><div class="circle">${icon('i-coffee')}</div><b>Paket Cafe</b><span>Untuk partner bisnis kuliner</span></button><button class="feature" onclick="shareReferral()"><div class="circle">${icon('i-users')}</div><b>REFerral</b><span>Ajak teman, dapat point</span></button></div></div>`, 'home')}finally{loading(false)}}
async function store(){loading(true);try{const b=await boot();const ps=(b.products||[]).filter(p=>state.category==='all'||p.category_id===state.category);const cats=b.categories||[];const rec=ps.filter(p=>p.best_seller).slice(0,3);root.innerHTML=shell(`<div class="storeHead"><h1><img class="storeLogo" src="assets/logo_cireng_indi.png" alt="Logo Cireng Indi"><span>Cireng Indi</span></h1><div class="segment"><button class="${state.fulfillment==='pickup'?'active':''}" onclick="setFulfillment('pickup')">Pick Up</button><button class="${state.fulfillment==='delivery'?'active':''}" onclick="setFulfillment('delivery')">Delivery</button></div><p class="storeTagline">Pesan cepat, stok real-time, tampilan lebih premium.</p></div><div class="locationCard"><div class="locrow" role="button" tabindex="0" onclick="showOutlet()" onkeydown="if(event.key==='Enter')showOutlet()"><div class="locicon">${icon('i-store')}</div><div class="grow"><b>Cireng Indi • Tanah Grogot</b><span>Outlet utama</span></div>${icon('i-right')}</div>${state.fulfillment==='delivery'?`<div class="locrow" onclick="go('addresses')"><div class="locicon">${icon('i-pin')}</div><div class="grow"><b>Lokasi pengiriman</b><span>Pilih alamat tersimpan</span></div>${icon('i-right')}</div>`:`<div class="locrow"><div class="locicon">${icon('i-bag')}</div><div class="grow"><b>Ambil di outlet</b><span>Pesanan disiapkan untuk pickup</span></div>${icon('i-right')}</div>`}</div><div class="chips"><button class="chip ${state.category==='all'?'active':''}" onclick="setCat('all')">Favorit</button>${cats.map(c=>`<button class="chip ${state.category===c.id?'active':''}" onclick="setCat('${c.id}')">${esc(c.name)}</button>`).join('')}</div><div class="promo" role="button" tabindex="0" onclick="go('rewards')" onkeydown="if(event.key==='Enter')go('rewards')"><div class="circle">${icon('i-gift')}</div><div class="grow"><b>Bonus Puding Member!</b><span>Promo sesuai minimum transaksi</span></div>${icon('i-right')}</div><div class="section" style="padding-bottom:12px"><h2>Rekomendasi</h2></div><div class="hscroll">${rec.map(p=>pcard(p,b)).join('')}</div><div class="section" style="padding-bottom:2px"><h2>Menu Cireng Indi</h2></div><div class="productList">${ps.map(p=>prow(p,b)).join('')}</div>`, 'store');await cartBar()}finally{loading(false)}}
function showOutlet(){toast('Outlet utama Cireng Indi • Tanah Grogot, Kalimantan Timur')}
async function setFulfillment(v){state.fulfillment=v==='pickup'?'pickup':'delivery';await store()}
function variantFor(p,b){return (b.variants||[]).find(v=>v.product_id===p.id)}
function localPic(n){
 n=String(n||'').toLowerCase();
 if(n.includes('cireng isi'))return'product_cireng_isi.webp';
 if(n==='cireng')return'product_cireng.webp';
 if(n.includes('cilok'))return'product_cilok.webp';
 if(n.includes('sempol'))return'product_sempol.webp';
 if(n.includes('tahu bakso'))return'product_tahu_bakso.webp';
 if(n.includes('pempek'))return'product_pempek.webp';
 if(n.includes('chicken katsu'))return'product_chicken_katsu.webp';
 if(n.includes('nugget'))return'product_nugget.webp';
 if(n.includes('bola ayam keju'))return'product_bola_keju.webp';
 if(n.includes('bitterballen'))return'product_bitterballen.webp';
 if(n.includes('bakso ayam'))return'product_bakso_ayam.webp';
 if(n.includes('ebi furai'))return'product_ebi.webp';
 if(n.includes('baceman'))return'product_baceman.webp';
 if(n.includes('ayam ungkep'))return'product_ayam_ungkep.webp';
 if(n.includes('dimsum'))return'product_dimsum.webp';
 if(n.includes('rollade'))return'product_rollade.webp';
 if(n.includes('kebab'))return'product_kebab.webp';
 if(n.includes('corndog'))return'product_corndog.webp';
 if(n.includes('churros'))return'product_churros.webp';
 if(n.includes('kentang'))return'product_kentang.webp';
 if(n.includes('frozen mix'))return'product_mix.webp';
 if(n.includes('manjakani')||n.includes('sari kacang'))return'product_jamu_manis.webp';
 if(n.includes('jamu')||n.includes('kunyit'))return'product_jamu.webp';
 if(n.includes('jahe'))return'product_jahe.webp';
 if(n.includes('puding')||n.includes('salad jelly'))return'product_puding.webp';
 if(n.includes('rengginang'))return'product_rengginang.webp';
 return'product_cireng.webp';
}
function pic(p){const local=localPic(p?.name);return local?'assets/'+local:(p?.image_path?img(p.image_path):'assets/product_cireng.webp')}
function pcard(p,b){const v=variantFor(p,b);return `<div class="pCard" onclick="openP('${p.id}')"><img src="${esc(pic(p))}"><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.description||'Favorit member')}</div><div class="price">${rp(v?.price??p.base_price)}</div></div><button class="add" onclick="event.stopPropagation();quickAdd('${v?.id||''}')">${icon('i-plus')}</button></div>`}
function prow(p,b){const v=variantFor(p,b);return `<div class="prow" onclick="openP('${p.id}')"><img src="${esc(pic(p))}"><div><h3>${esc(p.name)}</h3><p>${esc(p.description||'Camilan dan frozen food Cireng Indi')}</p><div class="price">${rp(v?.price??p.base_price)}</div></div><button class="add" onclick="event.stopPropagation();quickAdd('${v?.id||''}')">${icon('i-plus')}</button></div>`}
async function setCat(id){state.category=id;await store()}async function openP(id){const b=await boot();const p=(b.products||[]).find(x=>x.id===id);if(!p)return;state.product={p,vars:(b.variants||[]).filter(v=>v.product_id===id)};state.qty=1;await product()}
async function product(){const x=state.product;if(!x)return go('store');const p=x.p, vars=x.vars||[];const v=vars[0];root.innerHTML=`<div class="app" style="padding-bottom:92px"><section class="productHero"><img src="${esc(pic(p))}"><button class="back" onclick="go('store')">${icon('i-left')}</button></section><div class="detail"><h1>${esc(p.name)}</h1><div class="muted">mulai dari</div><div class="price" style="font-size:25px">${rp(v?.price??p.base_price)}</div><p class="muted">${esc(p.description||'Produk pilihan Cireng Indi.')}</p></div><div class="option"><h2>Pilihan Produk <span>Wajib, pilih 1</span></h2>${vars.map((q,i)=>`<div class="optrow" onclick="selVariant('${q.id}')"><div class="grow"><b>${esc(q.name)}</b><div class="price" style="font-size:14px">${rp(q.price)}</div></div><div class="radio ${i===0?'on':''}" data-v="${q.id}"></div></div>`).join('')}</div><div class="option"><h2>Catatan <span>Opsional</span></h2><textarea id="pnote" rows="3" placeholder="Contoh: sambal dipisah"></textarea></div><div class="pointsHint">${icon('i-star')} Kamu berpotensi mendapatkan point dari transaksi ini.</div><div class="stickyAction"><div class="qty"><button onclick="changeQty(-1)">${icon('i-minus')}</button><b id="qv">1</b><button class="plus" onclick="changeQty(1)">${icon('i-plus')}</button></div><button class="cta" onclick="addFromProduct()">Tambah ke Keranjang</button></div></div>`;state.product.selected=v?.id||null}
function selVariant(id){state.product.selected=id;document.querySelectorAll('.radio[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===id))}function changeQty(d){state.qty=Math.max(1,Math.min(20,state.qty+d));qv.textContent=state.qty}
async function quickAdd(id){if(!id)return toast('Varian belum tersedia.');loading(true);try{const c=await api('cart');const e=(c.items||[]).find(x=>x.variant_id===id);await api('cart_set',{variant_id:id,quantity:Number(e?.quantity||0)+1});toast('Ditambahkan ke keranjang.');await cartBar()}catch(e){fail(e)}finally{loading(false)}}
async function addFromProduct(){const id=state.product?.selected;if(!id)return toast('Pilih varian.');loading(true);try{const c=await api('cart');const e=(c.items||[]).find(x=>x.variant_id===id);await api('cart_set',{variant_id:id,quantity:Number(e?.quantity||0)+state.qty});showSheet()}catch(e){fail(e)}finally{loading(false)}}
function showSheet(){const p=state.product.p;document.body.insertAdjacentHTML('beforeend',`<div id="sheet" class="sheetBg" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="grab"></div><h2>Berhasil ditambahkan</h2><div class="added"><img src="${esc(pic(p))}"><div class="grow"><b>${esc(p.name)}</b><div class="success">Masuk ke keranjang</div></div></div><div class="sheetActions"><button class="primary" onclick="sheet.remove();go('cart')">Cek Keranjang</button><button class="secondary" onclick="sheet.remove();go('store')">Lanjut Belanja</button></div></div></div>`)}
async function cartBar(){try{const c=await api('cart');const n=(c.items||[]).reduce((a,x)=>a+Number(x.quantity||0),0);if(n){document.querySelector('.app')?.insertAdjacentHTML('beforeend',`<div class="cartbar" onclick="go('cart')"><div class="grow">${icon('i-bag','sm')} Cek Keranjang <span class="count">${n}</span></div><b>${rp(c.subtotal)}</b>${icon('i-right')}</div>`)}}catch(e){}}
async function addresses(){loading(true);try{const d=await api('addresses');const a=d.addresses||[];root.innerHTML=`<div class="app">${uiTop('Pilih Lokasi Pengiriman','store')}<div class="search">${icon('i-search')}<input placeholder="Cari lokasi"></div><div class="tabs"><button class="active">Terakhir</button><button>Tersimpan</button></div><div class="address"><div class="circle">${icon('i-location')}</div><div class="grow"><b>Lokasimu saat ini</b><p>Gunakan lokasi perangkat untuk pengiriman</p></div></div>${a.map(x=>`<div class="address" onclick="defaultAddr('${x.id}')"><div class="circle">${icon('i-pin')}</div><div class="grow"><b>${esc(x.label||'Alamat')}</b><p>${esc(x.address_line)}, ${esc(x.city)}, ${esc(x.province)}</p></div>${icon('i-right')}</div>`).join('')}<div class="section"><button class="outline" style="width:100%" onclick="addAddressForm()">Tambah Alamat</button></div></div>`}finally{loading(false)}}
function addAddressForm(){root.innerHTML=`<div class="app">${uiTop('Tambah Alamat','addresses')}<div class="section"><div class="form"><label>Label</label><input id="alabel" placeholder="Rumah / Kantor"><label>Nama penerima</label><input id="aname"><label>No. HP</label><input id="aphone" inputmode="tel"><label>Alamat lengkap</label><textarea id="aline" rows="3"></textarea><label>Kota/Kabupaten</label><input id="acity"><label>Provinsi</label><input id="aprov"><label>Kode pos</label><input id="apost"><button class="fullbtn" onclick="saveAddress()">Simpan Alamat</button></div></div></div>`}
async function saveAddress(){loading(true);try{const d=await api('address_create',{label:alabel.value.trim(),recipient_name:aname.value.trim(),phone:aphone.value.trim(),address_line:aline.value.trim(),city:acity.value.trim(),province:aprov.value.trim(),postal_code:apost.value.trim()});await api('address_default',{id:d.address.id});await addresses()}catch(e){fail(e)}finally{loading(false)}}async function defaultAddr(id){loading(true);try{await api('address_default',{id});toast('Alamat utama diperbarui.')}catch(e){fail(e)}finally{loading(false)}}
async function cart(){loading(true);try{const c=await api('cart');const items=c.items||[];root.innerHTML=`<div class="app" style="padding-bottom:92px">${uiTop('Keranjang','store')}<div class="section">${items.length?items.map(i=>{const v=i.variant||{},p=v.product||{},price=Number(v.price??p.base_price??0);return `<div class="orderCard"><div class="orderProduct" style="margin:0;border-top:0"><img src="assets/${localPic(p.name)}"><div style="flex:1"><b>${esc(p.name)}</b><div style="color:var(--muted);font-size:12px">${esc(v.name||'')}</div><div class="price">${rp(price*i.quantity)}</div></div><div class="qty"><button onclick="cartQty('${i.variant_id}',${i.quantity-1})">${icon('i-minus')}</button><b>${i.quantity}</b><button class="plus" onclick="cartQty('${i.variant_id}',${i.quantity+1})">${icon('i-plus')}</button></div></div></div>`}).join(''):`<p style="text-align:center;color:var(--muted);padding:40px 0">Keranjang masih kosong.</p>`}</div>${items.length?`<div class="stickyAction"><div style="flex:1"><small>Subtotal</small><div class="price">${rp(c.subtotal)}</div></div><button class="cta" onclick="go('checkout')">Lanjut Checkout</button></div>`:''}</div>`}finally{loading(false)}}async function cartQty(id,q){loading(true);try{await api('cart_set',{variant_id:id,quantity:q});await cart()}catch(e){fail(e)}finally{loading(false)}}
async function checkout(){
 loading(true);try{
  const [c,b]=await Promise.all([api('cart'),boot()]);
  if(!(c.items||[]).length)return go('cart');
  let as=[];const delivery=state.fulfillment==='delivery';
  if(delivery){as=(await api('addresses')).addresses||[];if(!as.length)return go('addresses');}
  const bank=b.bank_transfer||{};
  const availableBanks=Array.isArray(bank.accounts)&&bank.accounts.length?bank.accounts:[bank].filter(a=>a.bank_name&&a.account_number);
  root.innerHTML=`<div class="app" style="padding-bottom:104px">
   <div class="checkoutHead">${uiTop('Checkout','cart')}<div class="fulfillment">${icon(delivery?'i-truck':'i-bag','lg')}<div class="grow"><b>${delivery?'Delivery':'Pick Up'}</b><div style="color:var(--muted);font-size:12px">${delivery?'Diantar oleh kurir yang ditentukan Owner':'Ambil langsung di outlet'}</div></div><button class="outline" onclick="state.fulfillment='${delivery?'pickup':'delivery'}';checkout()">Ubah</button></div></div>
   <div class="checkoutSec"><h2>Outlet</h2><div class="route"><div class="circle">${icon('i-store')}</div><div><b>Cireng Indi • Tanah Grogot</b><span>Outlet utama</span></div></div>
   ${delivery?`<div class="route"><div class="circle">${icon('i-pin')}</div><div class="grow"><b>Alamat tujuan</b><select id="coaddr">${as.map(x=>`<option value="${x.id}" ${x.is_default?'selected':''}>${esc(x.label||'Alamat')} — ${esc(x.city)}</option>`).join('')}</select></div></div><div class="eta">Kurir dan kontak WhatsApp akan muncul di riwayat pesanan setelah dipilih Owner. Ongkir final dikonfirmasi Owner sebelum pembayaran COD.</div>`:`<div class="eta">Waktu pengambilan dikonfirmasi Owner.</div>`}</div>
   <div class="checkoutSec"><h2>Detail Pesanan</h2>${(c.items||[]).map(i=>{const v=i.variant||{},prd=v.product||{};return `<div class="checkoutItem"><div class="grow"><b>${esc(prd.name||'Produk')}</b><div style="color:var(--muted);font-size:12px">${esc(v.name||'')} × ${i.quantity}</div><div class="price">${rp(Number(v.price||0)*i.quantity)}</div></div><img loading="lazy" onerror="this.style.display='none'" src="assets/${localPic(prd.name)}" alt="${esc(prd.name)}"></div>`}).join('')}</div>
   <div class="checkoutSec"><h2>Metode Pembayaran</h2><label class="payrow" style="cursor:pointer"><input type="radio" name="copay" value="cod" checked><div class="grow"><b>COD / Bayar di Tempat</b><div style="font-size:12px;color:var(--muted)">${delivery?'Bayar ke kurir':'Bayar saat pickup'}</div></div></label>
   ${bank.enabled&&availableBanks.length?`<div class="payrow" style="margin-top:10px;align-items:flex-start"><input type="radio" name="copay" id="transferRadio" value="transfer" aria-label="Transfer bank"><div class="grow"><label for="transferRadio" style="font-weight:750">Transfer BSI / BRI</label><div style="font-size:12px;color:var(--muted)">Pilih rekening penerima sebelum membuat pesanan.</div><select id="cobank" aria-label="Pilih bank tujuan" style="width:100%;margin:8px 0;padding:11px;border:1px solid var(--line);border-radius:12px" onchange="document.getElementById('transferRadio').checked=true">${availableBanks.map(a=>`<option value="${esc(a.code||a.bank_name)}">${esc(a.bank_name)} • ${esc(a.account_number)} • a.n. ${esc(a.account_holder)}</option>`).join('')}</select><div style="font-size:12px;color:var(--muted)">Nomor rekening terpilih juga tercantum di Riwayat Pesanan. Unggah bukti transfer setelah checkout.</div></div></div>`:`<div class="eta">Transfer bank tersedia setelah rekening dikonfigurasi Owner.</div>`}</div>
   <div class="stickyAction"><div style="flex:1"><small>Subtotal (belum termasuk ongkir)</small><div class="price">${rp(c.subtotal)}</div></div><button class="cta" onclick="placeOrder()">Pesan Sekarang</button></div>
  </div>`;
 }catch(e){fail(e)}finally{loading(false)}
}
async function placeOrder(){
 if(state.placingOrder)return;
 state.placingOrder=true;loading(true);
 try{
  const delivery=state.fulfillment==='delivery';
  const payment_method=document.querySelector('input[name="copay"]:checked')?.value||'cod';
  const bank_code=payment_method==='transfer'?(document.getElementById('cobank')?.value||null):null;
  if(payment_method==='transfer'&&!bank_code)throw new Error('PILIH_BANK');
  const d=await api('checkout',{fulfillment_type:state.fulfillment,payment_method,bank_code,address_id:delivery?(document.getElementById('coaddr')?.value||null):null,notes:null});
  toast('Pesanan '+d.order.order_number+' berhasil dibuat.');await go('orders');
 }catch(e){fail(e)}finally{state.placingOrder=false;loading(false)}
}
async function uploadProof(id,input){
 const file=input.files?.[0];if(!file)return;
 if(file.size>3*1024*1024)return toast('Bukti maksimal 3 MB.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Gunakan foto JPG, PNG, atau WebP.');
 loading(true);try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('FILE_READ_FAILED'));reader.readAsDataURL(file)});
  await api('payment_proof_upload',{order_id:id,mime:file.type,base64:dataUrl.split(',')[1]});
  toast('Bukti berhasil dikirim. Menunggu konfirmasi Owner.');await orders();
 }catch(e){fail(e)}finally{loading(false)}
}
async function orders(){
 loading(true);try{
  const d=await api('orders');const os=d.orders||[];
  root.innerHTML=shell(`${uiTop('Riwayat Pesanan','home')}<div class="section">${os.map(o=>{
   const p=o.payment||{},courier=o.courier||{},wa=String(courier.whatsapp||'').replace(/[^0-9]/g,'');
   const payText=p.method==='transfer'?'Transfer Bank':'COD';
   const statusText={pending:'Menunggu pembayaran',submitted:'Bukti dikirim, menunggu Owner',paid:'Pembayaran dikonfirmasi',rejected:'Bukti ditolak',cancelled:'Dibatalkan'}[p.status]||'Menunggu';
   return `<div class="orderCard" style="margin-bottom:14px"><div class="orderTop"><div class="circle">${icon(o.fulfillment_type==='pickup'?'i-bag':'i-truck')}</div><div class="grow"><b>${esc(o.order_number||'Pesanan')}</b><div style="font-size:12px;color:var(--muted)">${new Date(o.created_at).toLocaleString('id-ID')} · ${o.fulfillment_type==='pickup'?'Pick Up':'Delivery'}</div></div><span class="tag ${o.status==='completed'?'done':''}">${esc(o.status)}</span></div>
   <div class="orderProduct"><img src="assets/${localPic(o.items?.[0]?.product_name||'cireng')}" alt="Produk" onerror="this.style.display='none'"><div><b>${esc(o.items?.[0]?.product_name||'Pesanan Cireng Indi')}</b><div style="color:var(--muted);font-size:12px">${(o.items||[]).length} jenis produk</div></div></div>
   <div style="padding:6px 0;font-size:13px"><b>${esc(payText)} — ${esc(statusText)}</b>${p.review_note?`<div style="color:#a7372e">Alasan: ${esc(p.review_note)}</div>`:''}</div>
   ${p.method==='transfer'&&p.bank_snapshot?`<div class="eta" style="margin:8px 0;padding:12px"><b>Transfer ke ${esc(p.bank_snapshot.bank_name||'Bank')}</b><div>Nomor: <b>${esc(p.bank_snapshot.account_number||'')}</b></div><div>Atas nama: <b>${esc(p.bank_snapshot.account_holder||'')}</b></div><div>Nominal pesanan: <b>${rp(o.total)}</b></div></div>`:''}
   ${o.fulfillment_type==='delivery'?`<div style="padding:7px 0;font-size:13px">${courier.name?`<b>Kurir: ${esc(courier.name)}</b>${wa?`<button class="outline" style="margin-left:8px" onclick="Native.openUrl('https://wa.me/${wa}')">WhatsApp Kurir</button>`:''}`:'Kurir sedang ditentukan oleh Owner.'}</div>`:'<div style="font-size:12px;color:var(--muted)">Pengambilan langsung di outlet Tanah Grogot</div>'}
   ${p.method==='transfer'&&['pending','rejected'].includes(p.status)&&o.status!=='cancelled'?`<div class="form" style="margin:10px 0"><label>Bukti transfer (JPG/PNG/WebP, maksimal 3 MB)</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadProof('${o.id}',this)"></div>`:''}
   ${p.proof_url?`<button class="outline" onclick="Native.openUrl('${esc(p.proof_url)}')">Lihat bukti transfer</button>`:''}
   <div class="orderFoot"><div class="grow"><b>${rp(o.total)}</b></div>${o.status==='pending'&&p.status!=='paid'&&p.status!=='submitted'?`<button class="outline" onclick="cancelOrder('${o.id}')">Batalkan</button>`:`<button class="outline" onclick="go('store')">Beli Lagi</button>`}</div></div>`;
  }).join('')||`<p style="text-align:center;color:var(--muted)">Belum ada pesanan.</p>`}</div>`,'orders');
 }catch(e){fail(e)}finally{loading(false)}
}
async function cancelOrder(id){if(!confirm('Batalkan pesanan? Stok akan dikembalikan.'))return;loading(true);try{await api('order_cancel',{id});await orders()}catch(e){fail(e)}finally{loading(false)}}

async function rewards(){loading(true);try{const d=await api('rewards');root.innerHTML=`<div class="app">${uiTop('Member & Point','home')}<div class="member" style="margin:14px 18px 0"><h2>${Number(d.points||0)} Point</h2><div style="height:8px;background:#eee;border-radius:99px"><div style="height:8px;width:35%;background:var(--brand);border-radius:99px"></div></div><p style="font-size:12px;color:var(--muted)">Gunakan point untuk menukar reward Cireng Indi.</p></div><div class="section"><h2>Tukar Point</h2><div class="grid2">${(d.rewards||[]).map(r=>`<div class="feature" style="min-height:160px"><div class="circle">${icon('i-gift')}</div><b>${esc(r.product_name)}</b><span>${esc(r.variant_name||'')}</span><div class="price">${r.points_cost} Point</div><button class="outline" style="margin-top:10px" onclick="redeem('${r.id}')">Tukar</button></div>`).join('')}</div></div></div>`}finally{loading(false)}}async function redeem(id){loading(true);try{await api('reward_redeem',{id});toast('Reward berhasil diajukan.');await rewards()}catch(e){fail(e)}finally{loading(false)}}
async function profile(){loading(true);try{const d=await api('me');state.me=d;const p=d.profile||{};root.innerHTML=shell(`${uiTop('Akun','home')}<div class="profile"><div class="avatar">${icon('i-user','lg')}</div><div class="grow"><h2>${esc(p.full_name||p.username)}</h2><p>@${esc(p.username)}</p></div>${icon('i-right')}</div><div class="menuGroup"><div class="menurow" onclick="shareReferral()"><div class="circle">${icon('i-users')}</div><div class="grow"><b>REFerral</b><div style="font-size:12px;color:var(--muted)">${esc(p.referral_code||'Bagikan kode referral')}</div></div>${icon('i-right')}</div><div class="menurow" onclick="go('addresses')">${icon('i-pin')}<div class="grow">Alamat Tersimpan</div>${icon('i-right')}</div><div class="menurow" onclick="go('rewards')">${icon('i-star')}<div class="grow">Point & Reward</div>${icon('i-right')}</div><div class="menurow">${icon('i-settings')}<div class="grow">Pengaturan</div>${icon('i-right')}</div><div class="menurow" onclick="logout()">${icon('i-logout')}<div class="grow">Keluar</div>${icon('i-right')}</div></div><div class="section"><p style="text-align:center;font-size:12px;color:var(--muted)">Cireng Indi v${esc(Native.appVersion())}</p></div>`, 'profile')}finally{loading(false)}}
function shareReferral(){const c=state.me?.profile?.referral_code;if(c)Native.shareText('Kode referral Cireng Indi saya: '+c);else toast('Kode referral belum tersedia.')}async function logout(){loading(true);try{try{await api('logout')}catch(e){}sessionClear();state.boot=null;renderAuth('login')}finally{loading(false)}}
window.onNativeDeepLink=function(url){try{const u=new URL(url);const p=new URLSearchParams((u.hash||'').replace(/^#/,''));const a=p.get('access_token'),r=p.get('refresh_token');if(a){sessionSave({accessToken:a,refreshToken:r||'',memberId:''});root.innerHTML=`<section class="auth"><div class="authbox"><img class="authLogo" src="assets/logo_cireng_indi.png"><h1>Reset Password</h1><div class="form"><label>Password baru</label><input id="npw" type="password"><button class="fullbtn" onclick="changeRecovery()">Simpan Password</button></div></div></section>`}}catch(e){}};async function changeRecovery(){loading(true);try{await api('change_password',{password:npw.value});toast('Password berhasil diubah.');await logout()}catch(e){fail(e)}finally{loading(false)}}
(async()=>{state.session=sessionRead();if(state.session?.accessToken){try{await go('home')}catch(e){fail(e)}}else renderAuth('login')})();
</script>
</body>
</html>
