/* Premium design aligned with Cireng Indi storefront reference; keep navigation and checkout responsive. */
:root{--brand:#984c32;--brand2:#663123;--cream:#fff9f2;--soft:#f8e9dc;--line:#e9dace;--shadow:0 9px 27px rgba(83,47,29,.10)}
html,body{background:#fff8f0}.app{background:linear-gradient(160deg,#fffaf5 0%,#fff5e9 52%,#fff 100%)}
button,.locrow,.menurow,.card{touch-action:manipulation}
button:focus-visible,.locrow:focus-visible{outline:3px solid #bb6b44;outline-offset:2px}
.storeHead{position:relative;overflow:hidden;border-radius:0 0 34px 34px;background:radial-gradient(circle at 94% 3%,rgba(235,165,108,.30) 0 16%,transparent 17%),radial-gradient(circle at 0% 100%,rgba(36,13,9,.26) 0 20%,transparent 21%),linear-gradient(122deg,#5d3027 0%,#935238 60%,#b9764b 100%);padding:21px 20px 49px}
.storeHead h1{font-size:27px;line-height:1.2;display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:17px;font-weight:750;letter-spacing:-.5px}
.storeHead h1 .storeLogo{width:42px;height:42px;object-fit:contain;background:#fffdf9;border-radius:50%;padding:3px;box-shadow:0 3px 12px #35130d33}
.storeHead .storeTagline{margin:16px auto 0;max-width:360px;text-align:center;font-size:13px;line-height:1.45;font-weight:650;color:#ffe7c4}
.segment{width:100%;max-width:480px;box-shadow:0 6px 22px #1e100f18;background:#fffdf9}
.segment button{min-height:50px;font-size:17px}
.segment button.active{background:#f7e5d6;color:#90472e;border:1.5px solid #b67351}
.locationCard{position:relative;z-index:2;margin:-24px 16px 20px;background:#fffefa;border-color:#e5d5c6;border-radius:27px;box-shadow:0 13px 30px #5c2f241a}
.locrow{padding:17px 16px;min-height:80px}
.locrow:active{background:#fff5eb}
.locicon{width:48px;height:48px;flex:0 0 48px;background:#f9efe0}
.chips{padding:0 16px 16px;gap:8px}
.chip{background:#fffdf9;padding:10px 14px;border-color:#d9c9bc;font-size:14px}
.chip.active{border-color:#a35335;color:#9b482c;box-shadow:0 4px 8px #8d492018}
.promo{border-color:#efddbb;border-radius:25px;margin:0 16px 22px;background:linear-gradient(115deg,#fffaf0,#fbead0);box-shadow:0 9px 21px #a3724920}
.promo .circle{border-radius:18px;width:52px;height:52px;flex-shrink:0;box-shadow:0 5px 15px #b8884818}
.promo:active{transform:scale(.995)}
.section h2{letter-spacing:-.4px}
.hscroll{padding-left:16px;padding-right:16px}
.pCard{min-width:min(320px,88vw);grid-template-columns:105px minmax(0,1fr) 38px;border-radius:24px;box-shadow:0 8px 20px #85492313}
.pCard img{width:105px;height:106px;border-radius:18px}
.pCard h3,.prow h3{font-size:18px}
.pCard .meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add{background:var(--brand);width:38px;height:38px;border-radius:13px}
.productList{padding:0 16px 10px}
.prow{border:1px solid #e9dace;background:#fffefc;border-radius:23px;padding:12px;margin-bottom:12px;box-shadow:0 5px 15px #7137190d}
.prow img{border-radius:15px}
.bottomnav{background:#fffdfa;box-shadow:0 -4px 18px #56331e11}
.bottomnav button.active{color:var(--brand2)}
.top .topBrand{position:absolute;right:16px;width:35px;height:35px;object-fit:contain;border-radius:50%;background:#fffaf4}
@media(max-width:370px){.storeHead h1{font-size:23px}.locrow b{font-size:14px}.pCard{min-width:270px;grid-template-columns:90px minmax(0,1fr) 34px}.pCard img{width:90px;height:100px}.pCard .price{font-size:16px}}
@media(prefers-reduced-motion:reduce){.promo:active{transform:none}}



/* HISTORIC LAYOUT + ESSENTIAL MODERN SECURITY/ACCESSIBILITY */
.authTabs{grid-template-columns:repeat(2,1fr)}
/* Enterprise-grade account entry: recovery is secondary, readable, and accessible */
.authTabs{max-width:100%;gap:10px;margin-bottom:16px}
.authTabs button{min-height:48px;font-size:14px;border:1px solid transparent}
.authTabs button.active{box-shadow:0 7px 16px rgba(102,49,35,.14)}
.auth .form{border-color:#e7d8ca;border-radius:24px;padding:20px 19px;box-shadow:0 12px 28px rgba(77,46,31,.08)}
.auth .form label{font-size:13px;margin:13px 0 7px}
.auth .form input{min-height:52px;border-radius:13px}
.auth-subactions{display:flex;justify-content:flex-end;margin-top:9px}
.auth-text-action{display:inline-flex;align-items:center;min-height:34px;padding:3px 0;border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer}
.auth-text-action:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.auth .fullbtn{min-height:52px;font-size:15px;margin-top:14px}
.auth-return{margin:6px 0 10px}
.auth-recovery-title{font-size:22px;margin:0 0 8px;color:var(--ink);letter-spacing:-.5px}
.auth .form .notice{font-size:13px;line-height:1.55;margin:0 0 15px}
@media(max-width:370px){.auth .form{padding:16px}.authTabs button{font-size:13px}.auth h1{font-size:26px}}
@media(max-height:700px){.auth{align-items:flex-start;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}.authLogo{width:92px;height:92px;margin-bottom:10px}.auth h1{font-size:26px}.auth .lead{margin:5px 0 14px}.auth .form{padding:16px}.authTabs{margin-bottom:12px}.auth .fullbtn{min-height:48px}}

.auth{min-height:100dvh;align-items:flex-start;padding:calc(25px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.authbox{margin:0 auto}
.auth--register .authLogo{width:72px;height:72px;margin-bottom:7px}
.auth--register h1{font-size:25px}.auth--register .lead{font-size:12px;margin:5px 0 12px}
.auth--register .form{padding:14px 17px}.auth--register .form label{margin:8px 0 5px}
.auth--register .form input{min-height:45px;padding:10px 12px}
.auth-feedback{background:#fff2e9;border:1px solid #e9bda8;color:#803524;padding:12px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px}
.auth-feedback:empty{display:none}
.auth--register .fullbtn:disabled{opacity:.65}

/* Preserve the old shell, cards, lists and navigation. Only autoplay banner behavior is modern. */
.heroSlides{position:absolute;inset:0}
.heroSlides .banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease}
.heroSlides .banner.is-active{opacity:1}
.heroDots{position:absolute;right:15px;bottom:10px;z-index:5;display:flex;align-items:center;gap:7px}
.heroDots button{border:0;padding:0;width:8px;height:8px;border-radius:999px;background:#f5e6dc80}
.heroDots button.active{width:20px;background:#fff}
.hero:after{pointer-events:none}
.heroCopy{z-index:3;max-width:calc(100% - 58px);text-shadow:0 1px 5px #331d18b0}

/* Cireng Indi member v2.0.1: unified Android system-bars clearance & screen polish.
   Keep all app pages BELOW the status bar even if Android 15 lays WebView edge-to-edge.
   The scroll view itself starts below the system bar: sticky headings never climb under it.
   No native reinstall is needed for this HTML/CSS OTA correction. */
:root{
  --ci-status-clearance:max(34px, env(safe-area-inset-top, 0px));
  --ci-gesture-clearance:max(14px, env(safe-area-inset-bottom, 0px));
}
html,body{background:#fff9f2!important}
#root{isolation:isolate}
#root:has(> .app){height:100dvh!important;max-height:100dvh!important;overflow:hidden!important}
#root > .app{
  box-sizing:border-box!important;
  position:relative!important;
  margin-top:var(--ci-status-clearance)!important;
  height:calc(100dvh - var(--ci-status-clearance))!important;
  max-height:calc(100dvh - var(--ci-status-clearance))!important;
  min-height:0!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior-y:contain!important;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#root > .app::-webkit-scrollbar{display:none}
/* Also keep unauthenticated entry/recovery forms away from status indicators. */
#root > .auth{
  box-sizing:border-box;
  min-height:100dvh;
  padding-top:calc(var(--ci-status-clearance) + 16px)!important;
  padding-bottom:calc(var(--ci-gesture-clearance) + 40px)!important;
}
#root > .bottomnav{
  height:calc(64px + var(--ci-gesture-clearance))!important;
  padding:0 0 var(--ci-gesture-clearance)!important;
  border-top:1px solid #e9dace!important;
}
#root > .bottomnav button{
  min-height:48px;
  padding:7px 3px 5px;
  font-size:11px;
  line-height:1.12;
}
#root > .bottomnav button .icon{width:21px;height:21px;margin:0 auto 3px}
/* Fixed order/checkout actions never cover Android's gesture handle. */
#root > .ciCartFooter,
#root > .ciCheckoutFooter,
.ciProductBottom,
.stickyAction{
  padding-bottom:calc(10px + var(--ci-gesture-clearance))!important;
}
#root > .ciCartFooter{min-height:calc(61px + var(--ci-gesture-clearance))!important}
#root > .ciCheckoutFooter{padding-top:10px!important}
#root > .ciCartScreen{padding-bottom:calc(94px + var(--ci-gesture-clearance))!important}
#root > .ciCheckoutScreen{padding-bottom:calc(104px + var(--ci-gesture-clearance))!important}
#root > .ciProductPage{padding-bottom:calc(105px + var(--ci-gesture-clearance))!important}
.ciSheet{padding-bottom:calc(18px + var(--ci-gesture-clearance))!important}
.cartbar{bottom:calc(73px + var(--ci-gesture-clearance))!important}

// Website order is determined by the published catalogue sort_order (Cireng = 1).
// Always normalize local fallback, cached payloads, and backend responses: older
// API versions could return sort_order in reverse and place Rengginang first.
function websiteCatalogueOrder(rows){
 return [...(rows||[])].sort((a,b)=>{
  const aOrder=Number.isFinite(Number(a?.sort_order))?Number(a.sort_order):Number.MAX_SAFE_INTEGER;
  const bOrder=Number.isFinite(Number(b?.sort_order))?Number(b.sort_order):Number.MAX_SAFE_INTEGER;
  return aOrder-bOrder||String(a?.name||'').localeCompare(String(b?.name||''),'id');
 });
}
function normaliseMemberCatalogue(data){

  categories:websiteCatalogueOrder(data.categories),
  products:websiteCatalogueOrder(data.products),
  variants:websiteCatalogueOrder(data.variants),
  banners:websiteCatalogueOrder(data.banners),
  couriers:websiteCatalogueOrder(data.couriers)
 };
}

 for(const group of list.querySelectorAll('.ciWebsiteCategory')){

   const visible=mode==='all'||mode===category||
    (mode==='bestseller'&&Boolean(item.querySelector('.ciBestSellerBadge')));
   item.hidden=!visible;
   if(visible)count++;
  }
  group.hidden=count===0;
  const badge=group.querySelector('.ciGroupCount');
  if(badge)badge.textContent=count+' menu';
 }
 for(const button of pane.querySelectorAll('#ciCatalogFilters button')){
  const selected=button.dataset.category===mode;
  button.classList.toggle('active',selected);

   inline:'nearest',block:'nearest',behavior:'auto'

 const number=Number(key.replace('app-product-',''));

function stablePhotoSource(id,productName){
 if(id===1)return AI_CIRENG_PHOTO_URL;
 if(Number.isInteger(id)&&id>=2&&id<=31)return 'assets/official_'+String(id).padStart(2,'0')+'.webp';
 return 'assets/'+localPic(productName);
}
function photoFallback(image){
 image.onerror=null;
 const fallback=image.dataset.localPhoto;
 if(fallback&&!image.dataset.localRecovery){
  image.dataset.localRecovery='1';
  image.src='assets/'+fallback;
 }
}
function photoAttrs(p){
 const resolved=BUILTIN_PUBLIC_CATALOG.products.find(x=>x.source_key===p?.source_key
  ||x.name?.toLowerCase()===String(p?.name||'').toLowerCase())||p;
 const id=officialImageId(resolved);
 const local=localPic(resolved?.name);
 const source=CI_NORMALIZED_PHOTOS[id]||stablePhotoSource(id,resolved?.name);
 return 'src="'+esc(source)+'" width="208" height="208" alt="'+esc(resolved?.name||'Produk Cireng Indi')+
  '" decoding="async" loading="eager"'+
  (id&&id!==1?' data-local-photo="'+esc(local)+'" onerror="photoFallback(this)"':'');
}
function productMediaFrame(product){
 return '<span class="ciFixedPhotoFrame ciPhotoStandard">'+
  '<img '+photoAttrs(product)+' draggable="false"></span>';
}

function pcard(p,b){
 const v=variantFor(p,b);
 return `<div class="pCard" onclick="openP('${p.id}')">
  ${productMediaFrame(p)}
  <div><h3>${esc(p.name)}</h3>${p.best_seller?'<span class="ciBestSellerBadge">Best Seller</span>':''}
  <div class="meta">${esc(p.description||'Favorit member')}</div>
  <div class="price">${rp(v?.price??p.base_price)}</div></div>
  <button type="button" class="add" aria-label="Tambah ${esc(p.name)}" onclick="event.stopPropagation();quickAddOrSelect('${p.id}')"><span class="ciStraightPlus" aria-hidden="true"></span></button>
 </div>`;
}

function prow(p,b){
 const v=variantFor(p,b);
 return `<article class="prow ciCatalogProduct" tabindex="0" role="button" aria-label="Detail ${esc(p.name)}"
  onclick="openP('${p.id}')" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openP('${p.id}')}">
  ${productMediaFrame(p)}
  <div class="ciCatalogProductCopy"><h3>${esc(p.name)}</h3>${p.best_seller?'<span class="ciBestSellerBadge">Best Seller</span>':''}
  <p>${esc(p.description||'Camilan dan frozen food Cireng Indi')}</p><div class="price">${rp(v?.price??p.base_price)}</div></div>
  <button type="button" class="add" aria-label="Tambah ${esc(p.name)} ke keranjang"
    onclick="event.stopPropagation();quickAddOrSelect('${p.id}')"><span class="ciStraightPlus" aria-hidden="true"></span></button>
 </article>`;
}
function setCat(id){
 if(state.category===id)return;
 state.category=id;
 if(state.route==='store'&&applyCatalogFilter(id,true))return;
 void store();
}
async function openP(id){const b=await boot();const p=(b.products||[]).find(x=>x.id===id);if(!p)return;state.product={p,vars:(b.variants||[]).filter(v=>v.product_id===id)};state.qty=1;await go('product')}
function productOptionsMarkup(vars,minPrice,selectedId){
 return vars.map(v=>{
  const available=v.active!==false&&Number(v.stock||0)>0;
  const delta=Math.max(0,Number(v.price||0)-Number(minPrice||0));
  return '<button type="button" class="ciVariant '+(selectedId===v.id?'selected':'')+'" data-variant="'+esc(v.id)+'" onclick="selVariant(\''+esc(v.id)+'\')" '+(available?'':'disabled')+' aria-pressed="'+(selectedId===v.id)+'">'+
   '<span class="ciVariantName">'+esc(v.name)+'</span>'+
   '<span class="ciVariantRight">'+(delta>0?'<small>+'+rp(delta)+'</small>':'')+
   (available?'<i class="ciVariantRadio" aria-hidden="true"></i>':'<small>Habis</small>')+'</span></button>';
 }).join('');
}
function productCategoryText(p){
 const name=String(p?.name||'').toLowerCase();
 const drink=/jamu|jahe|kacang hijau/.test(name);
 return drink?'Minuman Pilihan':'Frozen Homemade';
}
async function product(){
 const x=state.product;
 if(!x)return go('store');
 const p=x.p,vars=(x.vars||[]).filter(v=>v.active!==false)
  .sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0));
 const available=vars.filter(v=>Number(v.stock||0)>0);
 const cheapest=available.reduce((n,v)=>Math.min(n,Number(v.price||Infinity)),Infinity);
 const minPrice=Number.isFinite(cheapest)?cheapest:Number(p.base_price||0);
 const selected=available.find(v=>v.id===x.selected)||available[0]||null;
 x.selected=selected?.id||null;
 state.qty=Math.max(1,Math.min(state.qty||1,Number(selected?.stock||1),20));
 const rec=(state.boot?.products||[]).filter(q=>q.id!==p.id&&q.active!==false)
  .sort((a,b)=>Number(!!b.best_seller)-Number(!!a.best_seller)||Number(a.sort_order)-Number(b.sort_order)).slice(0,6);
 root.innerHTML='<div class="app ciProductPage">'+
 '<div class="ciProductHero"><img '+photoAttrs(p)+' alt="'+esc(p.name)+'">'+
 '<button type="button" class="ciProductBack" onclick="go(\'store\')" aria-label="Kembali ke menu">'+icon('i-left')+'</button></div>'+
 '<section class="ciProductIntro"><span class="ciProductTag">'+esc(productCategoryText(p))+'</span>'+
 '<h1>'+esc(p.name)+'</h1><p class="ciStartLabel">Mulai dari</p><div class="ciStartingPrice">'+rp(minPrice)+'</div>'+
 '<p class="ciProductDesc">'+esc(p.description||'Produk pilihan Cireng Indi, dibuat untuk dinikmati bersama keluarga.')+'</p></section>'+
 '<section class="ciProductOptions" aria-labelledby="ciVariantHeading">'+
 '<div class="ciOptionTitle"><h2 id="ciVariantHeading">'+(vars.length>1?'Pilih Varian Produk':'Pilihan Produk')+'</h2><span>Wajib, pilih 1</span></div>'+
 '<div class="ciVariantList" role="group" aria-label="Varian dan ukuran produk">'+productOptionsMarkup(vars,minPrice,x.selected)+'</div></section>'+
 '<div class="ciProductPoints">'+icon('i-star','sm')+' Poin reward mengikuti ketentuan transaksi.</div>'+
 '<section class="ciProductRecommendations"><h2>Lebih cocok dinikmati bersama ini</h2><div class="ciRelatedScroll">'+rec.map(q=>{
  const v=variantFor(q,state.boot);
  return '<div class="ciRelatedCard"><img '+photoAttrs(q)+'><div class="ciRelatedInfo"><b>'+esc(q.name)+'</b><span>Mulai '+rp(v?.price??q.base_price)+'</span></div><button type="button" aria-label="Tambahkan '+esc(q.name)+'" onclick="quickAddOrSelect(\''+esc(q.id)+'\')">'+icon('i-plus')+'</button></div>';
 }).join('')+'</div></section>'+
 '<div class="ciProductBottom"><div class="ciQtyControl">'+
 '<button type="button" aria-label="Kurangi jumlah" onclick="changeQty(-1)">'+icon('i-minus')+'</button>'+
 '<b id="qv">'+state.qty+'</b>'+
 '<button type="button" aria-label="Tambah jumlah" onclick="changeQty(1)">'+icon('i-plus')+'</button></div>'+
 '<button type="button" id="ciAddButton" class="ciAddToCart" onclick="addFromProduct()" '+(selected?'':'disabled')+'>'+
 (selected?'Tambah – '+rp(Number(selected.price||0)*state.qty):'Stok Habis')+'</button></div></div>';
}
function updateProductSelection(){
 const selected=state.product?.vars?.find(v=>v.id===state.product?.selected);
 if(!selected)return;
 const maxQty=Math.max(1,Math.min(20,Number(selected.stock||1)));
 state.qty=Math.min(maxQty,Math.max(1,state.qty||1));
 const qv=document.getElementById('qv');if(qv)qv.textContent=String(state.qty);
 const btn=document.getElementById('ciAddButton');
 if(btn)btn.textContent='Tambah – '+rp(Number(selected.price||0)*state.qty);
 document.querySelectorAll('.ciVariant').forEach(el=>{
  const selectedNow=el.dataset.variant===selected.id;
  el.classList.toggle('selected',selectedNow);
  el.setAttribute('aria-pressed',String(selectedNow));
 });
}
function selVariant(id){
 const v=state.product?.vars?.find(x=>x.id===id);
 if(!v||v.active===false||Number(v.stock||0)<=0)return;
 state.product.selected=id;
 updateProductSelection();
}
function changeQty(delta){
 const selected=state.product?.vars?.find(v=>v.id===state.product?.selected);
 const maxQty=Math.max(1,Math.min(20,Number(selected?.stock||20)));
 state.qty=Math.max(1,Math.min(maxQty,Number(state.qty||1)+delta));
 updateProductSelection();
}
function quickAddOrSelect(productId){
 const p=state.boot?.products?.find(x=>x.id===productId);
 if(!p)return openP(productId);
 const variants=(state.boot?.variants||[]).filter(x=>x.product_id===productId&&x.active!==false&&Number(x.stock||0)>0);
 if(variants.length!==1)return openP(productId); // User chooses correct size/taste.
 return quickAdd(variants[0].id);
}
async function quickAdd(id){if(!id)return toast('Varian belum tersedia.');if(pendingCartActions.has(id))return;pendingCartActions.add(id);try{const c=state.cartSnapshot||await api('cart');const e=(c.items||[]).find(x=>x.variant_id===id);await api('cart_set',{variant_id:id,quantity:Number(e?.quantity||0)+1});state.cartSnapshot=null;toast('Ditambahkan ke keranjang.');void cartBar()}catch(e){fail(e)}finally{pendingCartActions.delete(id)}}
async function addFromProduct(){
 const id=state.product?.selected;
 if(!id)return toast('Pilih varian.');
 if(pendingCartActions.has(id))return;
 const v=state.product.vars.find(v=>v.id===id);
 if(!v||Number(v.stock||0)<=0)return toast('Stok pilihan ini sedang habis.');
 pendingCartActions.add(id);
 const button=document.getElementById('ciAddButton');
 if(button)button.disabled=true;
 try{
  const c=state.cartSnapshot||await api('cart');
  const e=(c.items||[]).find(x=>x.variant_id===id);
  const desired=Number(e?.quantity||0)+Number(state.qty||1);
  if(desired>Number(v.stock))return toast('Jumlah melebihi stok yang tersedia.');
  await api('cart_set',{variant_id:id,quantity:desired});
  state.cartSnapshot=null;
  showSheet();
 }catch(e){fail(e)}
 finally{pendingCartActions.delete(id);if(button)button.disabled=false}
}
function showSheet(){
 const p=state.product.p;
 const v=state.product.vars.find(x=>x.id===state.product.selected);
 document.getElementById('sheet')?.remove();
 const suggestions=(state.boot?.products||[]).filter(x=>x.id!==p.id&&x.active!==false)
  .sort((a,b)=>Number(!!b.best_seller)-Number(!!a.best_seller)||Number(a.sort_order)-Number(b.sort_order)).slice(0,6);
 const cards=suggestions.map(q=>{
  const first=variantFor(q,state.boot);
  return '<div class="ciSheetRec"><img '+photoAttrs(q)+'><div><b>'+esc(q.name)+'</b><strong>Mulai '+rp(first?.price??q.base_price)+'</strong></div>'+
  '<button type="button" aria-label="Tambahkan '+esc(q.name)+'" onclick="sheetAddSuggestion(\''+esc(q.id)+'\')">'+icon('i-plus')+'</button></div>';
 }).join('');
 document.body.insertAdjacentHTML('beforeend',
  '<div id="sheet" class="sheetBg ciSheetOverlay" role="presentation" onclick="if(event.target===this)closeProductSheet()">'+
  '<section class="sheet ciSheet" role="dialog" aria-modal="true" aria-labelledby="ciSheetHeading">'+

/* Keep every cart product <img> node mounted for plus/minus taps. */
function updateCartQuantityInPlace(cart,id,quantity){
 if(state.route!=='cart'||quantity<=0)return false;
 const page=root.querySelector('.ciCartScreen');
 if(!page)return false;
 const rows=[...page.querySelectorAll('.ciCartItem')];
 const row=rows.find(el=>el.dataset.variantId===id);
 if(!row||rows.length!==cart.items.length)return false;
 const item=cart.items.find(x=>x.variant_id===id);
 const output=row.querySelector('.ciCartQty output');
 const price=row.querySelector('.ciCartLinePrice');
 const controls=row.querySelectorAll('.ciCartQty button');
 const subtotal=root.querySelector('.ciCartSummary strong');
 if(!item||!output||!price||controls.length!==2||!subtotal)return false;
 const unit=Number(item.variant?.price??item.variant?.product?.base_price??0);
 output.textContent=String(quantity);
 price.textContent=rp(unit*quantity);
 controls[0].setAttribute('onclick',"cartQty('"+esc(id)+"',"+(quantity-1)+")");
 controls[1].setAttribute('onclick',"cartQty('"+esc(id)+"',"+(quantity+1)+")");
 subtotal.textContent=rp(cart.subtotal);
 page.dataset.renderSignature=cartDisplaySignature(cart);
 return true;
}
function cartQty(id,q){
 const old=state.cartSnapshot;
 if(!Array.isArray(old?.items))return;
 const current=old.items.find(x=>x.variant_id===id);
 if(!current)return;
 const quantity=Math.max(0,Math.min(99,Math.trunc(Number(q)||0)));
 const items=old.items.map(i=>i.variant_id===id?{...i,quantity}:i).filter(i=>Number(i.quantity)>0);
 const subtotal=items.reduce((sum,i)=>{
  const v=i.variant||{};
  return sum+Number(v.price??v.product?.base_price??0)*Number(i.quantity||0);
 },0);
 state.cartSnapshot={...old,items,subtotal};
 if(!updateCartQuantityInPlace(state.cartSnapshot,id,quantity))renderCart(state.cartSnapshot);
 let request=cartPendingById.get(id);
 if(!request){request={desired:quantity,revision:0,task:null};cartPendingById.set(id,request)}
 request.desired=quantity;
 request.revision++;
 if(!request.task)request.task=flushCartQty(id,request);
}
async function flushCartQty(id,request){
 let failed=false;
 try{
  while(true){
   const revision=request.revision,quantity=request.desired;
   try{await api('cart_set',{variant_id:id,quantity})}
   catch(e){failed=true;if(request.revision===revision){toast('Perubahan jumlah gagal disimpan. Memuat ulang keranjang.');break}}
   if(request.revision===revision)break;
  }
 }finally{
  cartPendingById.delete(id);
  if(cartPendingById.size===0){
   try{
    const latest=await api('cart');
    if(cartPendingById.size===0){
     state.cartSnapshot=latest;
     if(state.route==='cart')renderCart(latest);
    }
   }catch(e){if(failed&&state.route==='cart')fail(e)}
  }
 }
}


/* Fast checkout: use a previously verified cart to paint instantly, then
   verify amounts/stocks server-side before enabling the actual order button. */
let checkoutRequestId=0;
async function checkout(){
 const request=++checkoutRequestId;
 const screen=root.querySelector('.ciCheckoutScreen');
 const oldScroll=screen?.scrollTop||0;
 if(screen){
   const pay=document.querySelector('input[name="copay"]:checked')?.value;
   if(pay)state.checkoutPayment=pay;
   const bank=document.getElementById('cobank')?.value;
   if(bank)state.checkoutBank=bank;
   const address=document.getElementById('coaddr')?.value;
   if(address)state.checkoutAddress=address;
 }
 state.checkoutVerified=false;
 const button=root.querySelector('.ciCheckoutFooter button');
 if(button){button.disabled=true;button.setAttribute('aria-busy','true');}
 try{
   // Optimistic screen uses real, previously fetched cart and bank data.
   // Never offer an active Place Order button with unverified data.
   if(state.cartSnapshot?.items?.length&&state.boot&&state.catalogFetched&&
      !cartPendingById.size){
     await renderCheckoutSnapshot(state.cartSnapshot,state.boot,false,oldScroll);
   }
   if(cartPendingById.size)await Promise.all([...cartPendingById.values()].map(x=>x.task));
   const [c,b]=await Promise.all([api('cart'),state.catalogFetched?boot():freshCatalog()]);
   if(request!==checkoutRequestId||state.route!=='checkout')return;
   state.cartSnapshot=c;
   if(!(c.items||[]).length)return go('cart');
   await renderCheckoutSnapshot(c,b,true,oldScroll);
 }catch(e){
   if(request!==checkoutRequestId||state.route!=='checkout')return;
   state.checkoutVerified=false;
   const action=root.querySelector('.ciCheckoutFooter button');
   if(action){action.disabled=true;action.setAttribute('aria-busy','false');}
   fail(e);
 }
}
async function renderCheckoutSnapshot(c,b,verified,oldScroll){
 if(state.route!=='checkout')return;
    const delivery=state.fulfillment==='delivery';
    let as=state.addressesSnapshot||[];
    if(delivery&&!as.length&&verified){try{as=(await api('addresses')).addresses||[];state.addressesSnapshot=as;}catch(e){as=[];}}
    const bank=b.bank_transfer||{};
    const banks=Array.isArray(bank.accounts)&&bank.accounts.length?bank.accounts:[bank].filter(a=>a.bank_name&&a.account_number);
    const canTransfer=!!bank.enabled&&banks.length>0;
    const payment=state.checkoutPayment==='transfer'&&canTransfer?'transfer':'cod';
    const eligible=availableVouchers(Number(c.subtotal||0),state.fulfillment).sort((a,d)=>previewDiscount(d,c.subtotal)-previewDiscount(a,c.subtotal));
    if(state.selectedVoucherId&&!eligible.some(v=>v.id===state.selectedVoucherId))state.selectedVoucherId=null;
    const selected=eligible.find(v=>v.id===state.selectedVoucherId);
    const discount=previewDiscount(selected,Number(c.subtotal||0));
    const subtotal=Number(c.subtotal||0);

function checkoutSwitchMode(){
  state.fulfillment=state.fulfillment==='pickup'?'delivery':'pickup';
  state.selectedVoucherId=null;
  checkout();
}

function checkoutPaymentChanged(method){
  state.checkoutPayment=method==='transfer'?'transfer':'cod';
  const radio=document.querySelector('input[name="copay"][value="'+state.checkoutPayment+'"]');
  if(radio)radio.checked=true;
  const area=document.getElementById('checkoutBankArea');
  if(area)area.style.display=state.checkoutPayment==='transfer'?'block':'none';
}

function updateCheckoutVoucher(){
  const id=document.getElementById('checkoutVoucher')?.value||null;
  state.selectedVoucherId=id;
  const v=(state.vouchers||[]).find(x=>x.id===id);
  const amount=Number(document.getElementById('checkoutEstimate')?.dataset.subtotal||0);
  const saving=previewDiscount(v,amount);
  const final=Math.max(0,amount-saving);
  const discount=document.getElementById('checkoutDiscount');
  if(discount)discount.textContent=saving?'-'+rp(saving):rp(0);
  const total=document.getElementById('checkoutBillTotal');
  if(total)total.textContent=rp(final);
  const estimate=document.getElementById('checkoutEstimate');
  if(estimate)estimate.textContent='Estimasi '+rp(final)+(state.fulfillment==='delivery'?' · belum termasuk ongkir':'');
  const hint=document.getElementById('checkoutVoucherMessage');
  if(hint)hint.textContent=v?'Estimasi diskon '+rp(saving)+' · Sistem memvalidasi voucher ketika pesanan dibuat.':'Tanpa voucher.';
  const label=document.getElementById('checkoutVoucherHighlight');
  if(label)label.textContent=v?v.title+' · Potongan '+rp(saving):'Tanpa voucher';
}

function checkoutApplyBestVoucher(){
  const subtotal=Number(document.getElementById('checkoutEstimate')?.dataset.subtotal||0);
  const available=availableVouchers(subtotal,state.fulfillment).sort((a,b)=>previewDiscount(b,subtotal)-previewDiscount(a,subtotal));
  if(!available.length)return toast('Belum ada voucher yang tersedia.');
  const target=available.find(x=>x.id!==state.selectedVoucherId)||available[0];
  const select=document.getElementById('checkoutVoucher');
  if(select){select.value=target.id;updateCheckoutVoucher();}
}

async function checkoutQty(id,q){
  const c=state.cartSnapshot;
  const current=(c?.items||[]).find(x=>x.variant_id===id);
  if(!current)return;
  if(q>Number(current.variant?.stock??99))return toast('Jumlah melebihi stok yang tersedia.');
  state.checkoutVerified=false;
  const action=root.querySelector('.ciCheckoutFooter button');
  if(action)action.disabled=true;
  cartQty(id,q);
  const request=cartPendingById.get(id);
  if(request?.task)await request.task;
  if(state.route==='checkout')await checkout();
}

async function checkoutAddSuggested(id){
  state.checkoutVerified=false;
  const action=root.querySelector('.ciCheckoutFooter button');
  if(action)action.disabled=true;
  const p=state.boot?.products?.find(x=>x.id===id);
  if(!p)return;
  const variants=(state.boot?.variants||[]).filter(v=>v.product_id===id&&v.active!==false&&Number(v.stock||0)>0);
  if(variants.length!==1){await openP(id);return;}
  const v=variants[0];
  if(pendingCartActions.has(v.id))return;
  pendingCartActions.add(v.id);
  try{
    const c=await api('cart'),existing=(c.items||[]).find(i=>i.variant_id===v.id);
    const desired=Number(existing?.quantity||0)+1;
    if(desired>Number(v.stock||0))return toast('Stok produk tidak mencukupi.');
    await api('cart_set',{variant_id:v.id,quantity:desired});
    state.cartSnapshot=null;
    toast('Produk ditambahkan.');
    if(state.route==='checkout')await checkout();
  }catch(e){fail(e)}finally{
    pendingCartActions.delete(v.id);
    // An unavailable suggestion or a failed network request must not leave
    // the checkout button disabled indefinitely.
    if(state.route==='checkout'&&!state.checkoutVerified)void checkout();
  }
}

async function openCheckoutProduct(id){await openP(id)}


async function placeOrder(){
 if(state.placingOrder)return;
 if(!state.checkoutVerified)return toast('Keranjang sedang diverifikasi. Coba lagi setelah total diperbarui.');
 state.placingOrder=true;loading(true);
 try{
  const delivery=state.fulfillment==='delivery';
  const payment_method=document.querySelector('input[name="copay"]:checked')?.value||'cod';
  const voucher_id=document.getElementById('checkoutVoucher')?.value||null;
  const bank_code=payment_method==='transfer'?(document.getElementById('cobank')?.value||null):null;
  if(payment_method==='transfer'&&!bank_code)throw new Error('PILIH_BANK');
  const d=await api('checkout',{fulfillment_type:state.fulfillment,payment_method,bank_code,voucher_id,address_id:delivery?(document.getElementById('coaddr')?.value||null):null,notes:null});
  state.cartSnapshot=null;state.ordersSnapshot=[];state.selectedVoucherId=null;toast('Pesanan '+d.order.order_number+' berhasil dibuat.');await go('orders');
 }catch(e){fail(e)}finally{state.placingOrder=false;loading(false)}
}
async function uploadProof(id,input){
 const file=input.files?.[0];if(!file)return;
 if(file.size>3*1024*1024)return toast('Bukti maksimal 3 MB.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Gunakan foto JPG, PNG, atau WebP.');
 loading(true);try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('FILE_READ_FAILED'));reader.readAsDataURL(file)});
  await api('payment_proof_upload',{order_id:id,mime:file.type,base64:dataUrl.split(',')[1]});
  toast('Bukti berhasil dikirim. Menunggu konfirmasi Owner.');await orders();
 }catch(e){fail(e)}finally{loading(false)}
}

function orderStatusText(status){
 return ({pending:'Menunggu konfirmasi',processing:'Diproses',ready_for_pickup:'Siap diambil',shipped:'Dalam pengiriman',completed:'Selesai',cancelled:'Dibatalkan'})[status]||'Dalam proses';
}
function orderTimeline(order){
 if(order.status==='cancelled')return '<p class="muted">Pesanan ini dibatalkan.</p>';
 const names=['Dikonfirmasi','Diproses',order.fulfillment_type==='pickup'?'Siap Diambil':'Dalam Pengiriman','Selesai'];
 const progress={pending:-1,processing:1,ready_for_pickup:2,shipped:2,completed:3}[order.status]??-1;
 const dates=order.timeline||[];
 const events=[dates.find(d=>d.status==='processing'),dates.find(d=>d.status==='processing'),
  dates.find(d=>d.status==='ready_for_pickup'||d.status==='shipped'),dates.find(d=>d.status==='completed')];
 return '<div class="orderTimeline" role="list" aria-label="Progres pesanan">'+names.map((name,i)=>{
  const phase=i<progress?'done':i===progress?'active':'';
  const when=events[i]?.at?new Date(events[i].at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  return '<div class="orderStep '+phase+'" role="listitem"><span>'+name+'</span>'+(i<=progress&&when?'<small>'+esc(when)+'</small>':'')+'</div>';
 }).join('')+'</div>';
}

async function updateOrdersQuietly(){
 if(state.route!=='orders'||orderPollBusy||document.visibilityState!=='visible')return;
 orderPollBusy=true;
 try{
  const d=await api('orders');
  const latest=d.orders||[];
  if(state.route!=='orders')return;
  const changed=JSON.stringify(latest.map(x=>[x.id,x.status,x.updated_at,x.courier_id,x.payment?.status]))
   !==JSON.stringify((state.ordersSnapshot||[]).map(x=>[x.id,x.status,x.updated_at,x.courier_id,x.payment?.status]));
  state.ordersSnapshot=latest;
  if(changed)renderOrders(latest);
 }catch(e){/* Keep last known orders visible while offline. */}
 finally{orderPollBusy=false}
}
async function orders(){
 // Show the latest already known orders immediately without a blocking spinner.
 renderOrders(state.ordersSnapshot||[]);
 await updateOrdersQuietly();
 clearInterval(orderPollTimer);
 if(state.route==='orders')orderPollTimer=setInterval(updateOrdersQuietly,15000);
}
async function cancelOrder(id){if(!confirm('Batalkan pesanan? Stok akan dikembalikan.'))return;loading(true);try{await api('order_cancel',{id});await orders()}catch(e){fail(e)}finally{loading(false)}}


function voucherLabel(v){return v.discount_type==='percent'?'Diskon '+Number(v.discount_value)+'%':'Potongan '+rp(v.discount_value)}
function availableVouchers(subtotal=0,fulfillment=state.fulfillment){
 const now=Date.now();
 return state.vouchers.filter(v=>v.status==='available'&&v.active!==false
  &&(!subtotal||Number(v.min_spend||0)<=subtotal)&&(!fulfillment||v.fulfillment_scope==='all'||v.fulfillment_scope===fulfillment)
  &&Date.parse(v.starts_at)<=now&&Date.parse(v.ends_at)>now);
}
function previewDiscount(v,subtotal){
 if(!v||subtotal<Number(v.min_spend||0))return 0;
 const original=v.discount_type==='percent'?Math.floor(subtotal*Number(v.discount_value)/100):Number(v.discount_value);
 return Math.max(0,Math.min(subtotal,Number(v.max_discount||Infinity),original));
}
function voucherCard(v){
 const usable=v.status==='available';
 const valid=Number.isFinite(Date.parse(v.ends_at))?new Date(v.ends_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
 const states={available:'Tersedia',used:'Sudah digunakan',revoked:'Dicabut Owner',expired:'Kedaluwarsa',upcoming:'Segera hadir'};
 return '<div class="voucherCard"><span class="voucherTag">'+esc(states[v.status]||v.status)+'</span><h3>'+esc(v.title)+'</h3><b>'+esc(voucherLabel(v))+'</b><p>'+esc(v.description||'Promo khusus member Cireng Indi')+'</p><p>Min. belanja '+rp(v.min_spend)+' · Berlaku sampai '+esc(valid)+'</p><p>'+esc(v.fulfillment_scope==='all'?'Pick Up & Delivery':v.fulfillment_scope==='pickup'?'Khusus Pick Up':'Khusus Delivery')+'</p>'
  +(usable?'<button class="outline" onclick="useVoucher(\''+esc(v.id)+'\')">Gunakan Voucher</button>':'')+'</div>';
}
function renderVoucherPage(){
 const vs=state.vouchers||[];
 const signature=JSON.stringify(vs.map(v=>[v.id,v.status,v.active,v.title,v.discount_value,v.starts_at,v.ends_at]));
 if(root.querySelector('.ciVoucherPage')?.dataset.renderSignature===signature)return;
 const first=vs.filter(v=>v.status==='available');const rest=vs.filter(v=>v.status!=='available');
 root.innerHTML=shell(uiTop('Voucher Saya','home')+
 '<div class="section ciVoucherPage"><h2>Voucher Untukmu</h2><p class="muted">Voucher berasal dari promo yang diterbitkan oleh Owner Cireng Indi.</p>'+
 (first.length?first.map(voucherCard).join(''):'<div class="voucherCard"><h3>Belum ada voucher aktif</h3><p>Voucher baru akan muncul di sini jika Owner menerbitkan promo untuk akunmu.</p></div>')+
 (rest.length?'<h2>Riwayat Voucher</h2>'+rest.map(voucherCard).join(''):'')+
 '</div>','home');
 const page=root.querySelector('.ciVoucherPage');
 if(page)page.dataset.renderSignature=signature;
}
async function vouchers(){
 renderVoucherPage();
 try{
  const response=await api('vouchers');
  state.vouchers=response.vouchers||[];
  if(state.route==='vouchers')renderVoucherPage();
  refreshVoucherCount();
 }catch(e){if(state.route==='vouchers')fail(e)}
}
function useVoucher(id){
 const v=state.vouchers.find(x=>x.id===id);
 if(!v||v.status!=='available')return toast('Voucher tidak tersedia.');
 state.selectedVoucherId=id;
 toast('Voucher dipilih. Diskon akan dihitung pada checkout.');
 go('store');
}

function renderRewards(d){
 if(state.route!=='rewards')return;
 const list=Array.isArray(d?.rewards)?d.rewards:[];
 const points=Number(d?.points||0);
 const signature=JSON.stringify([points,...list.map(x=>[x.id,x.product_name,x.variant_name,x.points_cost])]);
 if(root.querySelector('.ciRewardsView')?.dataset.renderSignature===signature)return;
 root.innerHTML=shell(uiTop('Member & Point','home')+
 '<main class="ciRewardsView"><div class="member" style="margin:14px 18px 0">'+
 '<h2>'+points+' Point</h2><div style="height:8px;background:#eee;border-radius:99px">'+
 '<div style="height:8px;width:35%;background:var(--brand);border-radius:99px"></div></div>'+
 '<p style="font-size:12px;color:var(--muted)">Gunakan point untuk menukar reward Cireng Indi.</p></div>'+
 '<div class="section"><h2>Tukar Point</h2><div class="grid2">'+list.map(r=>
 '<div class="feature" style="min-height:160px"><div class="circle">'+icon('i-gift')+'</div>'+
 '<b>'+esc(r.product_name)+'</b><span>'+esc(r.variant_name||'')+'</span>'+
 '<div class="price">'+Number(r.points_cost||0)+' Point</div>'+
 '<button type="button" class="outline" style="margin-top:10px" onclick="redeem(\''+esc(r.id)+'\')">Tukar</button></div>').join('')+
 '</div></div></main>','home');
 const view=root.querySelector('.ciRewardsView');
 if(view)view.dataset.renderSignature=signature;
}
async function rewards(){
 renderRewards(state.rewardsSnapshot||{points:state.me?.points||0,rewards:[]});
 try{
  const d=await api('rewards');
  state.rewardsSnapshot=d;
  if(state.route==='rewards')renderRewards(d);
 }catch(e){if(state.route==='rewards'&&!state.rewardsSnapshot)toast('Reward belum dapat diperbarui.');}
}
async function redeem(id){
 try{
  await api('reward_redeem',{id});
  state.rewardsSnapshot=null;
  toast('Reward berhasil diajukan.');
  await rewards();
 }catch(e){fail(e)}
}

function renderProfile(d){
 if(state.route!=='profile')return;

 if(root.querySelector('.profile')?.dataset.renderSignature===signature)return;
 root.innerHTML=shell(`${uiTop('Akun','home')}<div class="profile"><div class="avatar">${icon('i-user','lg')}</div><div class="grow"><h2>${esc(p.full_name||p.username)}</h2><p>@${esc(p.username)}</p></div>${icon('i-right')}</div><div class="menuGroup"><div class="menurow" onclick="shareReferral()"><div class="circle">${icon('i-users')}</div><div class="grow"><b>Ajak Teman / Referral</b><div style="font-size:12px;color:var(--muted)">${esc(p.referral_code||'Bagikan kode referral')}</div></div>${icon('i-right')}</div><div class="menurow" onclick="go('addresses')">${icon('i-pin')}<div class="grow">Alamat Tersimpan</div>${icon('i-right')}</div><div class="menurow" onclick="go('rewards')">${icon('i-star')}<div class="grow">Point & Reward</div>${icon('i-right')}</div><div class="menurow" onclick="go('vouchers')">${icon('i-gift')}<div class="grow">Voucher Saya</div>${icon('i-right')}</div><div class="menurow" onclick="go('settings')">${icon('i-settings')}<div class="grow">Pengaturan</div>${icon('i-right')}</div><div class="menurow" onclick="logout()">${icon('i-logout')}<div class="grow">Keluar</div>${icon('i-right')}</div></div>`, 'profile');
 const card=root.querySelector('.profile');
 if(card)card.dataset.renderSignature=signature;
}
async function profile(){
 // The cached identity draws instantly; server updates only repaint if changed.
 renderProfile(state.me||{profile:{username:state.session?.username||'',full_name:state.session?.fullName||''}});
 try{
  const d=await api('me');
  state.me=d;cacheMemberIdentity(d?.profile);
  if(state.route==='profile')renderProfile(d);
 }catch(e){if(state.route==='profile'&&!state.me)toast('Data akun belum dapat diperbarui.');}
}

function shareReferral(){const c=state.me?.profile?.referral_code;if(c)Native.shareText('Kode referral Cireng Indi saya: '+c);else toast('Kode referral belum tersedia.')}async function logout(){loading(true);try{try{await api('logout')}catch(e){}sessionClear();state.boot=null;renderAuth('login')}finally{loading(false)}}
window.onNativeDeepLink=function(url){try{const u=new URL(url);const p=new URLSearchParams((u.hash||'').replace(/^#/,''));const a=p.get('access_token'),r=p.get('refresh_token');if(a){sessionSave({accessToken:a,refreshToken:r||'',memberId:''});root.innerHTML=`<section class="auth"><div class="authbox"><img class="authLogo" src="assets/logo_cireng_indi.png"><h1>Reset Password</h1><div class="form"><label>Password baru</label><input id="npw" type="password"><button class="fullbtn" onclick="changeRecovery()">Simpan Password</button></div></div></section>`}}catch(e){}};async function changeRecovery(){loading(true);try{await api('change_password',{password:npw.value});toast('Password berhasil diubah.');await logout()}catch(e){fail(e)}finally{loading(false)}}
(async()=>{state.session=sessionRead();readPublicCatalog();if(state.session?.accessToken){try{await go('home');updateCatalogQuietly()}catch(e){fail(e)}}else{renderAuth('login');void freshCatalog().catch(()=>{})}})();
// The brand frame finishes by 1 second, regardless of network activity.
setTimeout(()=>document.getElementById('launchBrand')?.classList.add('hide'),840);
setTimeout(()=>document.getElementById('launchBrand')?.remove(),1000);
</script>
