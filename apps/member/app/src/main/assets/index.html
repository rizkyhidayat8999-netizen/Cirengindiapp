/* Premium design aligned with Cireng Indi storefront reference; keep navigation and checkout responsive. */
:root{--brand:#984c32;--brand2:#663123;--cream:#fff9f2;--soft:#f8e9dc;--line:#e9dace;--shadow:0 9px 27px rgba(83,47,29,.10)}
html,body{background:#fff8f0}.app{background:linear-gradient(160deg,#fffaf5 0%,#fff5e9 52%,#fff 100%)}
button,.locrow,.menurow,.card{touch-action:manipulation}
button:focus-visible,.locrow:focus-visible{outline:3px solid #bb6b44;outline-offset:2px}
.storeHead{position:relative;overflow:hidden;border-radius:0 0 34px 34px;background:radial-gradient(circle at 94% 3%,rgba(235,165,108,.30) 0 16%,transparent 17%),radial-gradient(circle at 0% 100%,rgba(36,13,9,.26) 0 20%,transparent 21%),linear-gradient(122deg,#5d3027 0%,#935238 60%,#b9764b 100%);padding:21px 20px 49px}
.storeHead h1{font-size:27px;line-height:1.2;display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:17px;font-weight:750;letter-spacing:-.5px}
.storeHead h1 .storeLogo{width:42px;height:42px;object-fit:contain;background:#fffdf9;border-radius:50%;padding:3px;box-shadow:0 3px 12px #35130d33}
.storeHead .storeTagline{margin:16px auto 0;max-width:360px;text-align:center;font-size:13px;line-height:1.45;font-weight:650;color:#ffe7c4}
.segment{width:100%;max-width:480px;box-shadow:0 6px 22px #1e100f18;background:#fffdf9}
.segment button{min-height:50px;font-size:17px}
.segment button.active{background:#f7e5d6;color:#90472e;border:1.5px solid #b67351}
.locationCard{position:relative;z-index:2;margin:-24px 16px 20px;background:#fffefa;border-color:#e5d5c6;border-radius:27px;box-shadow:0 13px 30px #5c2f241a}
.locrow{padding:17px 16px;min-height:80px}
.locrow:active{background:#fff5eb}
.locicon{width:48px;height:48px;flex:0 0 48px;background:#f9efe0}
.chips{padding:0 16px 16px;gap:8px}
.chip{background:#fffdf9;padding:10px 14px;border-color:#d9c9bc;font-size:14px}
.chip.active{border-color:#a35335;color:#9b482c;box-shadow:0 4px 8px #8d492018}
.promo{border-color:#efddbb;border-radius:25px;margin:0 16px 22px;background:linear-gradient(115deg,#fffaf0,#fbead0);box-shadow:0 9px 21px #a3724920}
.promo .circle{border-radius:18px;width:52px;height:52px;flex-shrink:0;box-shadow:0 5px 15px #b8884818}
.promo:active{transform:scale(.995)}
.section h2{letter-spacing:-.4px}
.hscroll{padding-left:16px;padding-right:16px}
.pCard{min-width:min(320px,88vw);grid-template-columns:105px minmax(0,1fr) 38px;border-radius:24px;box-shadow:0 8px 20px #85492313}
.pCard img{width:105px;height:106px;border-radius:18px}
.pCard h3,.prow h3{font-size:18px}
.pCard .meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.add{background:var(--brand);width:38px;height:38px;border-radius:13px}
.productList{padding:0 16px 10px}
.prow{border:1px solid #e9dace;background:#fffefc;border-radius:23px;padding:12px;margin-bottom:12px;box-shadow:0 5px 15px #7137190d}
.prow img{border-radius:15px}
.bottomnav{background:#fffdfa;box-shadow:0 -4px 18px #56331e11}
.bottomnav button.active{color:var(--brand2)}
.top .topBrand{position:absolute;right:16px;width:35px;height:35px;object-fit:contain;border-radius:50%;background:#fffaf4}
@media(max-width:370px){.storeHead h1{font-size:23px}.locrow b{font-size:14px}.pCard{min-width:270px;grid-template-columns:90px minmax(0,1fr) 34px}.pCard img{width:90px;height:100px}.pCard .price{font-size:16px}}
@media(prefers-reduced-motion:reduce){.promo:active{transform:none}}



/* HISTORIC LAYOUT + ESSENTIAL MODERN SECURITY/ACCESSIBILITY */
.authTabs{grid-template-columns:repeat(2,1fr)}
/* Enterprise-grade account entry: recovery is secondary, readable, and accessible */
.authTabs{max-width:100%;gap:10px;margin-bottom:16px}
.authTabs button{min-height:48px;font-size:14px;border:1px solid transparent}
.authTabs button.active{box-shadow:0 7px 16px rgba(102,49,35,.14)}
.auth .form{border-color:#e7d8ca;border-radius:24px;padding:20px 19px;box-shadow:0 12px 28px rgba(77,46,31,.08)}
.auth .form label{font-size:13px;margin:13px 0 7px}
.auth .form input{min-height:52px;border-radius:13px}
.auth-subactions{display:flex;justify-content:flex-end;margin-top:9px}
.auth-text-action{display:inline-flex;align-items:center;min-height:34px;padding:3px 0;border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer}
.auth-text-action:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.auth .fullbtn{min-height:52px;font-size:15px;margin-top:14px}
.auth-return{margin:6px 0 10px}
.auth-recovery-title{font-size:22px;margin:0 0 8px;color:var(--ink);letter-spacing:-.5px}
.auth .form .notice{font-size:13px;line-height:1.55;margin:0 0 15px}
@media(max-width:370px){.auth .form{padding:16px}.authTabs button{font-size:13px}.auth h1{font-size:26px}}
@media(max-height:700px){.auth{align-items:flex-start;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}.authLogo{width:92px;height:92px;margin-bottom:10px}.auth h1{font-size:26px}.auth .lead{margin:5px 0 14px}.auth .form{padding:16px}.authTabs{margin-bottom:12px}.auth .fullbtn{min-height:48px}}

.auth{min-height:100dvh;align-items:flex-start;padding:calc(25px + env(safe-area-inset-top,0px)) 16px calc(110px + env(safe-area-inset-bottom,0px))}
.authbox{margin:0 auto}
.auth--register .authLogo{width:72px;height:72px;margin-bottom:7px}
.auth--register h1{font-size:25px}.auth--register .lead{font-size:12px;margin:5px 0 12px}
.auth--register .form{padding:14px 17px}.auth--register .form label{margin:8px 0 5px}
.auth--register .form input{min-height:45px;padding:10px 12px}
.auth-feedback{background:#fff2e9;border:1px solid #e9bda8;color:#803524;padding:12px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px}
.auth-feedback:empty{display:none}
.auth--register .fullbtn:disabled{opacity:.65}

/* Preserve the old shell, cards, lists and navigation. Only autoplay banner behavior is modern. */
.heroSlides{position:absolute;inset:0}
.heroSlides .banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease}
.heroSlides .banner.is-active{opacity:1}
.heroDots{position:absolute;right:15px;bottom:10px;z-index:5;display:flex;align-items:center;gap:7px}
.heroDots button{border:0;padding:0;width:8px;height:8px;border-radius:999px;background:#f5e6dc80}
.heroDots button.active{width:20px;background:#fff}
.hero:after{pointer-events:none}
.heroCopy{z-index:3;max-width:calc(100% - 58px);text-shadow:0 1px 5px #331d18b0}

 .sort((a,b)=>Number(a.price||Infinity)-Number(b.price||Infinity)||Number(a.sort_order||0)-Number(b.sort_order||0));
 return vs.find(v=>Number(v.stock||0)>0)||vs[0];
}

function officialImageId(p){
 const key=String(p?.source_key||'');
 const number=Number(key.replace('app-product-',''));
 return /^app-product-\d+$/.test(key)&&Number.isInteger(number)&&number>=1&&number<=31?number:null;
}
function pic(p){
 // Bundled photos work immediately on already installed Android APKs.
 return 'assets/'+localPic(p?.name);
}
function bannerFallback(image){
 const i=Number(image.dataset.bannerId||0);
 if(!Number.isInteger(i)||i<1||i>4){image.onerror=null;return}
 const stage=Number(image.dataset.failStage||0);
 image.dataset.failStage=String(stage+1);
 if(stage===0){image.src=BRANDED_BASE+'official_banner_'+String(i).padStart(2,'0')+'.webp';return}
 const legacy=['banner_reseller.webp','banner_churros.webp','banner_cafe.webp','banner_puding.webp'];
 if(stage===1){image.src='assets/'+legacy[i-1];return}
 image.onerror=null;
}
function photoFallback(image){
 image.onerror=null;
 if(!image.dataset.localRecovery){
  image.dataset.localRecovery='1';
  image.src='assets/'+(image.dataset.localPhoto||'product_cireng.webp');
 }
}
const upgradedImages=new Map();
const upgradedImageObserver=typeof IntersectionObserver==='function'
 ?new IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>{
  if(!isIntersecting)return;
  upgradedImageObserver.unobserve(target);
  upgradeImageWhenReady(target);
 }),{rootMargin:'200px'}):null;
function upgradeImageWhenReady(img){
 const id=Number(img.dataset.photoId);
 if(!Number.isInteger(id)||id<1||id>31||img.dataset.upgradeRequested)return;
 img.dataset.upgradeRequested='1';
 if(!upgradedImages.has(id)){
  upgradedImages.set(id,new Promise(resolve=>{
   const remote=BRANDED_BASE+'official_'+String(id).padStart(2,'0')+'.webp';
   const test=new Image();
   test.onload=()=>resolve(remote);test.onerror=()=>resolve(null);test.src=remote;
  }));
 }
 upgradedImages.get(id).then(url=>{
  if(url&&img.isConnected){
   const prior=img.src;
   img.onerror=()=>{img.onerror=null;img.src=prior};
   img.src=url;
  }
 });
}
function observeCatalogPhotos(){
 for(const img of root.querySelectorAll('img[data-photo-id]:not([data-photo-watched])')){
  img.dataset.photoWatched='1';
  if(upgradedImageObserver)upgradedImageObserver.observe(img);else upgradeImageWhenReady(img);
 }
}
const bannerPrefetch=new Map();
function observeBanners(){
 const old=['banner_reseller.webp','banner_churros.webp','banner_cafe.webp','banner_puding.webp'];
 for(const img of root.querySelectorAll('.heroSlides img[data-banner-id]:not([data-banner-watched])')){
  img.dataset.bannerWatched='1';
  const index=Number(img.dataset.bannerId);
  if(index<1||index>4)continue;
  const uri=BRANDED_BASE+'official_banner_'+String(index).padStart(2,'0')+'.webp';
  if(!bannerPrefetch.has(index)){
   bannerPrefetch.set(index,new Promise(resolve=>{
    const image=new Image();image.onload=()=>resolve(uri);image.onerror=()=>resolve(null);image.src=uri;
   }));
  }
  bannerPrefetch.get(index).then(url=>{
   if(url&&img.isConnected){
    img.onerror=()=>{img.onerror=null;img.src='assets/'+old[index-1]};
    img.src=url;
   }
  });
 }
}
new MutationObserver(()=>{observeCatalogPhotos();observeBanners()}).observe(root,{childList:true,subtree:true});

  const c=await api('cart');state.cartSnapshot=c;
  if(state.route==='cart')renderCart(c);
 }catch(e){if(state.route==='cart')fail(e)}
}
async function cartQty(id,q){if(pendingCartActions.has(id))return;pendingCartActions.add(id);try{state.cartSnapshot=await api('cart_set',{variant_id:id,quantity:q});await cart()}catch(e){fail(e)}finally{pendingCartActions.delete(id)}}
async function checkout(){
 loading(true);try{
  const [c,b]=await Promise.all([state.cartSnapshot||api('cart'),state.catalogFetched?boot():freshCatalog()]);state.cartSnapshot=c;
  if(!(c.items||[]).length)return go('cart');
  let as=[];const delivery=state.fulfillment==='delivery';
  if(delivery){as=state.addressesSnapshot.length?state.addressesSnapshot:(await api('addresses')).addresses||[];state.addressesSnapshot=as;if(!as.length)return go('addresses');}
  const bank=b.bank_transfer||{};
  const availableBanks=Array.isArray(bank.accounts)&&bank.accounts.length?bank.accounts:[bank].filter(a=>a.bank_name&&a.account_number);
  const eligible=availableVouchers(Number(c.subtotal||0),state.fulfillment);
  if(state.selectedVoucherId&&!eligible.some(v=>v.id===state.selectedVoucherId))state.selectedVoucherId=null;
  const selected=eligible.find(v=>v.id===state.selectedVoucherId);
  if(state.route!=='checkout')return;root.innerHTML=`<div class="app" style="padding-bottom:104px">
   <div class="checkoutHead">${uiTop('Checkout','cart')}<div class="fulfillment">${icon(delivery?'i-truck':'i-bag','lg')}<div class="grow"><b>${delivery?'Delivery':'Pick Up'}</b><div style="color:var(--muted);font-size:12px">${delivery?'Diantar oleh kurir yang ditentukan Owner':'Ambil langsung di outlet'}</div></div><button class="outline" onclick="state.fulfillment='${delivery?'pickup':'delivery'}';checkout()">Ubah</button></div></div>
   <div class="checkoutSec"><h2>Outlet</h2><div class="route"><div class="circle">${icon('i-store')}</div><div><b>Cireng Indi • Tanah Grogot</b><span>Outlet utama</span></div></div>
   ${delivery?`<div class="route"><div class="circle">${icon('i-pin')}</div><div class="grow"><b>Alamat tujuan</b><select id="coaddr">${as.map(x=>`<option value="${x.id}" ${x.is_default?'selected':''}>${esc(x.label||'Alamat')} — ${esc(x.city)}</option>`).join('')}</select></div></div><div class="eta">Kurir dan kontak WhatsApp akan muncul di riwayat pesanan setelah dipilih Owner. Ongkir final dikonfirmasi Owner sebelum pembayaran COD.</div>`:`<div class="eta">Waktu pengambilan dikonfirmasi Owner.</div>`}</div>
   <div class="checkoutSec"><h2>Detail Pesanan</h2>${(c.items||[]).map(i=>{const v=i.variant||{},prd=v.product||{};return `<div class="checkoutItem"><div class="grow"><b>${esc(prd.name||'Produk')}</b><div style="color:var(--muted);font-size:12px">${esc(v.name||'')} × ${i.quantity}</div><div class="price">${rp(Number(v.price||0)*i.quantity)}</div></div><img ${photoAttrs(prd)}></div>`}).join('')}</div>
   <div class="checkoutSec"><h2>Voucher Cireng Indi</h2><p class="muted" style="font-size:12px;margin:0 0 9px">Voucher aktif dari Owner dapat digunakan pada pesanan ini.</p>
   <select id="checkoutVoucher" aria-label="Pilih voucher" style="width:100%;border:1px solid var(--line);padding:12px" onchange="updateCheckoutVoucher()">
   <option value="">Tanpa voucher</option>${eligible.map(v=>`<option value="${esc(v.id)}" ${v.id===state.selectedVoucherId?'selected':''}>${esc(v.title)} — ${esc(voucherLabel(v))}</option>`).join('')}</select>
   <p id="checkoutVoucherMessage" style="font-size:12px;color:var(--muted)">${selected?'Estimasi potongan '+rp(previewDiscount(selected,c.subtotal)):'Pilih voucher untuk melihat estimasi diskon.'}</p></div>
   <div class="checkoutSec"><h2>Metode Pembayaran</h2><label class="payrow" style="cursor:pointer"><input type="radio" name="copay" value="cod" checked><div class="grow"><b>COD / Bayar di Tempat</b><div style="font-size:12px;color:var(--muted)">${delivery?'Bayar ke kurir':'Bayar saat pickup'}</div></div></label>
   ${bank.enabled&&availableBanks.length?`<div class="payrow" style="margin-top:10px;align-items:flex-start"><input type="radio" name="copay" id="transferRadio" value="transfer" aria-label="Transfer bank"><div class="grow"><label for="transferRadio" style="font-weight:750">Transfer BSI / BRI</label><div style="font-size:12px;color:var(--muted)">Pilih rekening penerima sebelum membuat pesanan.</div><select id="cobank" aria-label="Pilih bank tujuan" style="width:100%;margin:8px 0;padding:11px;border:1px solid var(--line);border-radius:12px" onchange="document.getElementById('transferRadio').checked=true">${availableBanks.map(a=>`<option value="${esc(a.code||a.bank_name)}">${esc(a.bank_name)} • ${esc(a.account_number)} • a.n. ${esc(a.account_holder)}</option>`).join('')}</select><div style="font-size:12px;color:var(--muted)">Nomor rekening terpilih juga tercantum di Riwayat Pesanan. Unggah bukti transfer setelah checkout.</div></div></div>`:`<div class="eta">Transfer bank tersedia setelah rekening dikonfigurasi Owner.</div>`}</div>
   <div class="stickyAction"><div style="flex:1"><small>Estimasi total (belum termasuk ongkir)</small><div id="checkoutEstimate" data-subtotal="${Number(c.subtotal||0)}" class="price">${rp(Number(c.subtotal||0)-previewDiscount(selected,Number(c.subtotal||0)))}</div></div><button class="cta" onclick="placeOrder()">Pesan Sekarang</button></div>
  </div>`;
 }catch(e){fail(e)}finally{loading(false)}
}

function updateCheckoutVoucher(){
 const id=document.getElementById('checkoutVoucher')?.value||null;
 const v=state.vouchers.find(x=>x.id===id);
 state.selectedVoucherId=id;
 const el=document.getElementById('checkoutEstimate');
 const subtotal=Number(el?.dataset.subtotal||0);
 const discount=previewDiscount(v,subtotal);
 if(el)el.textContent=rp(subtotal-discount);
 const message=document.getElementById('checkoutVoucherMessage');
 if(message)message.textContent=v?'Estimasi diskon '+rp(discount)+' · Server akan memvalidasi voucher sebelum pesanan dibuat.':'Tanpa voucher';
}

async function placeOrder(){
 if(state.placingOrder)return;
 state.placingOrder=true;loading(true);
 try{
  const delivery=state.fulfillment==='delivery';
  const payment_method=document.querySelector('input[name="copay"]:checked')?.value||'cod';
  const voucher_id=document.getElementById('checkoutVoucher')?.value||null;
  const bank_code=payment_method==='transfer'?(document.getElementById('cobank')?.value||null):null;
  if(payment_method==='transfer'&&!bank_code)throw new Error('PILIH_BANK');
  const d=await api('checkout',{fulfillment_type:state.fulfillment,payment_method,bank_code,voucher_id,address_id:delivery?(document.getElementById('coaddr')?.value||null):null,notes:null});
  state.cartSnapshot=null;state.ordersSnapshot=[];state.selectedVoucherId=null;toast('Pesanan '+d.order.order_number+' berhasil dibuat.');await go('orders');
 }catch(e){fail(e)}finally{state.placingOrder=false;loading(false)}
}
async function uploadProof(id,input){
 const file=input.files?.[0];if(!file)return;
 if(file.size>3*1024*1024)return toast('Bukti maksimal 3 MB.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Gunakan foto JPG, PNG, atau WebP.');
 loading(true);try{
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('FILE_READ_FAILED'));reader.readAsDataURL(file)});
  await api('payment_proof_upload',{order_id:id,mime:file.type,base64:dataUrl.split(',')[1]});
  toast('Bukti berhasil dikirim. Menunggu konfirmasi Owner.');await orders();
 }catch(e){fail(e)}finally{loading(false)}
}

function orderStatusText(status){
 return ({pending:'Menunggu konfirmasi',processing:'Diproses',ready_for_pickup:'Siap diambil',shipped:'Dalam pengiriman',completed:'Selesai',cancelled:'Dibatalkan'})[status]||'Dalam proses';
}
function orderTimeline(order){
 if(order.status==='cancelled')return '<p class="muted">Pesanan ini dibatalkan.</p>';
 const names=['Dikonfirmasi','Diproses',order.fulfillment_type==='pickup'?'Siap Diambil':'Dalam Pengiriman','Selesai'];
 const progress={pending:-1,processing:1,ready_for_pickup:2,shipped:2,completed:3}[order.status]??-1;
 const dates=order.timeline||[];
 const events=[dates.find(d=>d.status==='processing'),dates.find(d=>d.status==='processing'),
  dates.find(d=>d.status==='ready_for_pickup'||d.status==='shipped'),dates.find(d=>d.status==='completed')];
 return '<div class="orderTimeline" role="list" aria-label="Progres pesanan">'+names.map((name,i)=>{
  const phase=i<progress?'done':i===progress?'active':'';
  const when=events[i]?.at?new Date(events[i].at).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  return '<div class="orderStep '+phase+'" role="listitem"><span>'+name+'</span>'+(i<=progress&&when?'<small>'+esc(when)+'</small>':'')+'</div>';
 }).join('')+'</div>';
}

function renderOrders(os){
 if(state.route!=='orders')return;root.innerHTML=shell(`${uiTop('Riwayat Pesanan','home')}<div class="section">${os.map(o=>{
   const p=o.payment||{},courier=o.courier||{},wa=String(courier.whatsapp||'').replace(/[^0-9]/g,'');
   const payText=p.method==='transfer'?'Transfer Bank':'COD';
   const statusText={pending:'Menunggu pembayaran',submitted:'Bukti dikirim, menunggu Owner',paid:'Pembayaran dikonfirmasi',rejected:'Bukti ditolak',cancelled:'Dibatalkan'}[p.status]||'Menunggu';
   return `<div class="orderCard" style="margin-bottom:14px"><div class="orderTop"><div class="circle">${icon(o.fulfillment_type==='pickup'?'i-bag':'i-truck')}</div><div class="grow"><b>${esc(o.order_number||'Pesanan')}</b><div style="font-size:12px;color:var(--muted)">${new Date(o.created_at).toLocaleString('id-ID')} · ${o.fulfillment_type==='pickup'?'Pick Up':'Delivery'}</div></div><span class="tag ${o.status==='completed'?'done':''}">${esc(orderStatusText(o.status))}</span></div>
   ${orderTimeline(o)}<div class="orderProduct"><img ${photoAttrs({name:o.items?.[0]?.product_name||'Cireng'})}><div><b>${esc(o.items?.[0]?.product_name||'Pesanan Cireng Indi')}</b><div style="color:var(--muted);font-size:12px">${(o.items||[]).length} jenis produk</div></div></div>
   <div style="padding:6px 0;font-size:13px"><b>${esc(payText)} — ${esc(statusText)}</b>${p.review_note?`<div style="color:#a7372e">Alasan: ${esc(p.review_note)}</div>`:''}</div>
   ${p.method==='transfer'&&p.bank_snapshot?`<div class="eta" style="margin:8px 0;padding:12px"><b>Transfer ke ${esc(p.bank_snapshot.bank_name||'Bank')}</b><div>Nomor: <b>${esc(p.bank_snapshot.account_number||'')}</b></div><div>Atas nama: <b>${esc(p.bank_snapshot.account_holder||'')}</b></div><div>Nominal pesanan: <b>${rp(o.total)}</b></div></div>`:''}
   ${o.fulfillment_type==='delivery'?`<div style="padding:7px 0;font-size:13px">${courier.name?`<b>Kurir: ${esc(courier.name)}</b>${wa?`<button class="outline" style="margin-left:8px" onclick="Native.openUrl('https://wa.me/${wa}')">WhatsApp Kurir</button>`:''}`:'Kurir sedang ditentukan oleh Owner.'}</div>`:'<div style="font-size:12px;color:var(--muted)">Pengambilan langsung di outlet Tanah Grogot</div>'}
   ${p.method==='transfer'&&['pending','rejected'].includes(p.status)&&o.status!=='cancelled'?`<div class="form" style="margin:10px 0"><label>Bukti transfer (JPG/PNG/WebP, maksimal 3 MB)</label><input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadProof('${o.id}',this)"></div>`:''}
   ${p.proof_url?`<button class="outline" onclick="Native.openUrl('${esc(p.proof_url)}')">Lihat bukti transfer</button>`:''}
   <div class="orderFoot"><div class="grow"><b>${rp(o.total)}</b></div>${o.status==='pending'&&p.status!=='paid'&&p.status!=='submitted'?`<button class="outline" onclick="cancelOrder('${o.id}')">Batalkan</button>`:`<button class="outline" onclick="go('store')">Beli Lagi</button>`}</div></div>`;
  }).join('')||`<p style="text-align:center;color:var(--muted)">Belum ada pesanan.</p>`}</div>`,'orders');
}
async function updateOrdersQuietly(){
 if(state.route!=='orders'||orderPollBusy||document.visibilityState!=='visible')return;
 orderPollBusy=true;
 try{
  const d=await api('orders');
  const latest=d.orders||[];
  if(state.route!=='orders')return;
  const changed=JSON.stringify(latest.map(x=>[x.id,x.status,x.updated_at,x.courier_id,x.payment?.status]))
   !==JSON.stringify((state.ordersSnapshot||[]).map(x=>[x.id,x.status,x.updated_at,x.courier_id,x.payment?.status]));
  state.ordersSnapshot=latest;
  if(changed)renderOrders(latest);
 }catch(e){/* Keep last known orders visible while offline. */}
 finally{orderPollBusy=false}
}
async function orders(){
 // Show the latest already known orders immediately without a blocking spinner.
 renderOrders(state.ordersSnapshot||[]);
 await updateOrdersQuietly();
 clearInterval(orderPollTimer);
 if(state.route==='orders')orderPollTimer=setInterval(updateOrdersQuietly,15000);
}
async function cancelOrder(id){if(!confirm('Batalkan pesanan? Stok akan dikembalikan.'))return;loading(true);try{await api('order_cancel',{id});await orders()}catch(e){fail(e)}finally{loading(false)}}


function voucherLabel(v){return v.discount_type==='percent'?'Diskon '+Number(v.discount_value)+'%':'Potongan '+rp(v.discount_value)}
function availableVouchers(subtotal=0,fulfillment=state.fulfillment){
 const now=Date.now();
 return state.vouchers.filter(v=>v.status==='available'&&v.active!==false
  &&(!subtotal||Number(v.min_spend||0)<=subtotal)&&(!fulfillment||v.fulfillment_scope==='all'||v.fulfillment_scope===fulfillment)
  &&Date.parse(v.starts_at)<=now&&Date.parse(v.ends_at)>now);
}
function previewDiscount(v,subtotal){
 if(!v||subtotal<Number(v.min_spend||0))return 0;
 const original=v.discount_type==='percent'?Math.floor(subtotal*Number(v.discount_value)/100):Number(v.discount_value);
 return Math.max(0,Math.min(subtotal,Number(v.max_discount||Infinity),original));
}
function voucherCard(v){
 const usable=v.status==='available';
 const valid=Number.isFinite(Date.parse(v.ends_at))?new Date(v.ends_at).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
 const states={available:'Tersedia',used:'Sudah digunakan',revoked:'Dicabut Owner',expired:'Kedaluwarsa',upcoming:'Segera hadir'};
 return '<div class="voucherCard"><span class="voucherTag">'+esc(states[v.status]||v.status)+'</span><h3>'+esc(v.title)+'</h3><b>'+esc(voucherLabel(v))+'</b><p>'+esc(v.description||'Promo khusus member Cireng Indi')+'</p><p>Min. belanja '+rp(v.min_spend)+' · Berlaku sampai '+esc(valid)+'</p><p>'+esc(v.fulfillment_scope==='all'?'Pick Up & Delivery':v.fulfillment_scope==='pickup'?'Khusus Pick Up':'Khusus Delivery')+'</p>'
  +(usable?'<button class="outline" onclick="useVoucher(\''+esc(v.id)+'\')">Gunakan Voucher</button>':'')+'</div>';
}
function renderVoucherPage(){
 const vs=state.vouchers||[];
 const first=vs.filter(v=>v.status==='available');const rest=vs.filter(v=>v.status!=='available');
 root.innerHTML=shell(uiTop('Voucher Saya','home')+
 '<div class="section"><h2>Voucher Untukmu</h2><p class="muted">Voucher berasal dari promo yang diterbitkan oleh Owner Cireng Indi.</p>'+
 (first.length?first.map(voucherCard).join(''):'<div class="voucherCard"><h3>Belum ada voucher aktif</h3><p>Voucher baru akan muncul di sini jika Owner menerbitkan promo untuk akunmu.</p></div>')+
 (rest.length?'<h2>Riwayat Voucher</h2>'+rest.map(voucherCard).join(''):'')+
 '</div>','home');
}
async function vouchers(){
 renderVoucherPage();
 try{
  const response=await api('vouchers');
  state.vouchers=response.vouchers||[];
  if(state.route==='vouchers')renderVoucherPage();
  refreshVoucherCount();
 }catch(e){if(state.route==='vouchers')fail(e)}
}
function useVoucher(id){
 const v=state.vouchers.find(x=>x.id===id);
 if(!v||v.status!=='available')return toast('Voucher tidak tersedia.');
 state.selectedVoucherId=id;
 toast('Voucher dipilih. Diskon akan dihitung pada checkout.');
 go('store');
}

 root.innerHTML=shell(uiTop('Kemitraan Cireng Indi','home')+
 '<div class="section"><div class="voucherCard"><span class="voucherTag">Cireng Indi • Tanah Grogot</span><h3>Untuk Cafe, Reseller & Partner Usaha</h3><p>Program kemitraan meliputi pilihan produk, kebutuhan pasokan, harga mitra, dan kerja sama sesuai kesepakatan.</p><p>Harga dan komposisi paket dikonfirmasi langsung melalui Cireng Indi. Tidak ada harga paket yang ditetapkan sepihak di aplikasi.</p><button class="cta" style="width:100%;margin-top:12px" onclick="Native.openUrl(\'https://cirengindi.com\')">Lihat Program Kemitraan</button></div></div>','home');

async function rewards(){loading(true);try{const d=await api('rewards');if(state.route!=='rewards')return;root.innerHTML=`<div class="app">${uiTop('Member & Point','home')}<div class="member" style="margin:14px 18px 0"><h2>${Number(d.points||0)} Point</h2><div style="height:8px;background:#eee;border-radius:99px"><div style="height:8px;width:35%;background:var(--brand);border-radius:99px"></div></div><p style="font-size:12px;color:var(--muted)">Gunakan point untuk menukar reward Cireng Indi.</p></div><div class="section"><h2>Tukar Point</h2><div class="grid2">${(d.rewards||[]).map(r=>`<div class="feature" style="min-height:160px"><div class="circle">${icon('i-gift')}</div><b>${esc(r.product_name)}</b><span>${esc(r.variant_name||'')}</span><div class="price">${r.points_cost} Point</div><button class="outline" style="margin-top:10px" onclick="redeem('${r.id}')">Tukar</button></div>`).join('')}</div></div></div>`}finally{loading(false)}}async function redeem(id){loading(true);try{await api('reward_redeem',{id});toast('Reward berhasil diajukan.');await rewards()}catch(e){fail(e)}finally{loading(false)}}

function shareReferral(){const c=state.me?.profile?.referral_code;if(c)Native.shareText('Kode referral Cireng Indi saya: '+c);else toast('Kode referral belum tersedia.')}async function logout(){loading(true);try{try{await api('logout')}catch(e){}sessionClear();state.boot=null;renderAuth('login')}finally{loading(false)}}
window.onNativeDeepLink=function(url){try{const u=new URL(url);const p=new URLSearchParams((u.hash||'').replace(/^#/,''));const a=p.get('access_token'),r=p.get('refresh_token');if(a){sessionSave({accessToken:a,refreshToken:r||'',memberId:''});root.innerHTML=`<section class="auth"><div class="authbox"><img class="authLogo" src="assets/logo_cireng_indi.png"><h1>Reset Password</h1><div class="form"><label>Password baru</label><input id="npw" type="password"><button class="fullbtn" onclick="changeRecovery()">Simpan Password</button></div></div></section>`}}catch(e){}};async function changeRecovery(){loading(true);try{await api('change_password',{password:npw.value});toast('Password berhasil diubah.');await logout()}catch(e){fail(e)}finally{loading(false)}}
(async()=>{state.session=sessionRead();readPublicCatalog();if(state.session?.accessToken){try{await go('home');updateCatalogQuietly()}catch(e){fail(e)}}else{renderAuth('login');void freshCatalog().catch(()=>{})}})();
// The brand frame finishes by 1 second, regardless of network activity.
setTimeout(()=>document.getElementById('launchBrand')?.classList.add('hide'),840);
setTimeout(()=>document.getElementById('launchBrand')?.remove(),1000);
</script>
