function renderListOnly(){const el=document.getElementById('productsList');if(el)el.innerHTML=productRows()}
function selectCat(id){s.cat=id;show()}
function productRow(p){return '<div class="item"><img loading="lazy" src="'+pic(p.image_path)+'" alt="'+safe(p.name)+'"><div class="itemBody"><b>'+safe(p.name)+'</b><p>'+safe(p.description)+'</p><span class="price">'+rp(price(p))+'</span> <span class="tiny">mulai</span></div><button class="add" aria-label="Pilih '+safe(p.name)+'" onclick="openProduct(\''+p.id+'\')">+</button></div>'}
function openProduct(id){s.product=DATA.products.find(p=>p.id===id);s.variant=variants(s.product)[0]||null;s.qty=1;show()}
function productSheet(){const p=s.product;return '<div class="overlay" onclick="closeSheet(event)"><div class="sheet" role="dialog" aria-modal="true"><div class="sheetHead"><h2>'+safe(p.name)+'</h2><button class="ghost" onclick="s.product=null;show()">Tutup ✕</button></div><img class="sheetImg" src="'+pic(p.image_path)+'" alt=""><div class="subtle">'+safe(p.description)+'</div><h3 class="h3" style="margin-top:19px">Pilih varian</h3>'+variants(p).map(v=>'<button class="variant '+(s.variant&&s.variant.id===v.id?'on':'')+'" onclick="chooseVariant(\''+v.id+'\')"><span>'+safe(v.name)+'</span><b>'+rp(v.price)+'</b></button>').join('')+'<div class="row" style="margin-top:20px"><b>Jumlah</b><div class="quantity"><button onclick="s.qty=Math.max(1,s.qty-1);show()">−</button>'+s.qty+'<button onclick="s.qty++;show()">+</button></div></div><button class="cta" onclick="addToCart()">Masukkan Keranjang · '+rp((s.variant?.price||p.base_price)*s.qty)+'</button><p class="tiny">Simulasi, tidak membuat pesanan asli.</p></div></div>'}
function closeSheet(e){if(e.target.classList.contains('overlay')){s.product=null;show()}}
function chooseVariant(id){s.variant=DATA.variants.find(x=>x.id===id);show()}
function addToCart(){const p=s.product;const v=s.variant;const k=p.id+':'+(v?.id||'default');let item=s.cart.find(x=>x.key===k);if(item)item.qty+=s.qty;else s.cart.push({key:k,name:p.name,variant:v?.name||'Default',price:v?.price||p.base_price,qty:s.qty});s.product=null;show()}
function changeQty(i,n){s.cart[i].qty+=n;if(s.cart[i].qty<1)s.cart.splice(i,1);show()}
function previewInfo(section){document.getElementById('app').insertAdjacentHTML('beforeend','<div id="msg" class="overlay" onclick="this.remove()"><div class="sheet"><div class="sheetHead"><h2>'+safe(section)+'</h2><button class="ghost">Tutup</button></div><p class="safe">Bagian ini bisa kita revisi tampilannya. Semua data dan aksi pada preview bersifat contoh.</p></div></div>')}
function renderOwner(){
 switch(s.page){
 case 'dashboard':return '<section class="pad"><h2 class="h2">Ringkasan Hari Ini</h2><div class="grid2">'+[['Pesanan hari ini','12'],['Omzet selesai','Rp750.000'],['Perlu diproses','3'],['Stok menipis','2'],['Produk aktif',String(DATA.products.length)],['Member aktif','98']].map(a=>'<div class="metric"><small>'+a[0]+'</small><strong>'+a[1]+'</strong></div>').join('')+'</div><h2 class="h2">Pesanan Terbaru</h2>'+orderDemo('CI-001','Pending',125000)+orderDemo('CI-002','Diproses',89000)+'<button class="cta" onclick="route(\'orders\')">Lihat Semua Pesanan</button></section>';
 case 'orders':return '<section class="pad"><h2 class="h2">Pesanan & Pembayaran</h2><div class="filters" style="padding:0 0 14px"><button class="chip '+(s.filter==='all'?'on':'')+'" onclick="s.filter=\'all\';show()">Semua</button><button class="chip '+(s.filter==='pending'?'on':'')+'" onclick="s.filter=\'pending\';show()">Pending</button><button class="chip '+(s.filter==='process'?'on':'')+'" onclick="s.filter=\'process\';show()">Diproses</button></div>'+(s.filter==='process'?'':orderDemo('CI-001','Menunggu Pembayaran',125000))+(s.filter==='pending'?'':orderDemo('CI-002','Diproses',89000))+'<p class="safe">Konfirmasi pembayaran dan penugasan kurir tidak aktif di preview.</p></section>';
 case 'products':return '<section class="pad"><h2 class="h2">Produk & Stok</h2><div class="subtle">Katalog contoh dari aplikasi Cireng Indi</div>'+DATA.products.slice(0,14).map(p=>'<div class="item"><img src="'+pic(p.image_path)+'"><div class="itemBody"><b>'+safe(p.name)+'</b><div class="subtle">'+safe(catFor(p.category_id))+'</div><span class="price">'+rp(price(p))+'</span></div><button class="ghost" onclick="previewInfo(\'Edit Produk\')">Edit</button></div>').join('')+'</section>';
 case 'members':return '<section class="pad"><h2 class="h2">Member</h2><input class="search" placeholder="Cari member (demo)" oninput="document.getElementById(\'demoMembers\').style.display=this.value&&!(\'rizky demo\'.includes(this.value.toLowerCase()))?\'none\':\'block\'"><div id="demoMembers" class="card"><div class="row"><div><b>Rizky · Akun Contoh</b><div class="subtle">Member aktif</div></div><span class="pill">120 Point</span></div></div></section>';
 case 'settings':return '<section class="pad"><h2 class="h2">Lainnya</h2><div class="card"><b>Owner Demo</b><div class="subtle">Hanya tampilan, bukan akses admin produksi.</div></div>'+['Rekening Transfer','Kurir Delivery','Banner & Promo','Voucher Member','Reward & Penukaran','Keamanan Akun / OTP'].map(x=>'<div class="setting"><button onclick="previewInfo(\''+x+'\')">'+x+'</button><span>›</span></div>').join('')+'</section>';
 default:return ''
 }
}
function orderDemo(num,status,total){return '<div class="card"><div class="row"><div><b>#'+num+'</b><div class="tiny">17 Okt 2026 · contoh</div></div><span class="status">'+status+'</span></div><div class="row"><span class="money">'+rp(total)+'</span><button class="ghost" onclick="previewInfo(\'Detail Pesanan\')">Lihat Detail</button></div></div>'}
show();
</script></body></html>
