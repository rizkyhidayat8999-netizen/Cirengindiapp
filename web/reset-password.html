<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Reset Password — Cireng Indi</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff8f1;color:#211814;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.card{width:min(90%,420px);background:#fff;border:1px solid #eee4de;border-radius:24px;padding:28px;box-shadow:0 12px 36px rgba(75,40,20,.1);text-align:center}
.logo{width:64px;height:64px;border-radius:20px;background:#c95724;color:#fff;margin:0 auto 16px;display:grid;place-items:center;font-weight:900}
h1{margin:0 0 8px}p{color:#756b65;line-height:1.5}
button{width:100%;border:0;border-radius:999px;padding:14px 16px;background:#c95724;color:#fff;font:inherit;font-weight:850}
</style>
</head>
<body>
<div class="card"><div class="logo">CI</div><h1>Cireng Indi</h1><p>Link pemulihan siap dibuka di aplikasi.</p><button id="open">Buka Aplikasi Cireng Indi</button></div>
<script>
const target=()=>`cirengindi://reset-password${location.search||""}${location.hash||""}`;
document.getElementById("open").onclick=()=>location.href=target();
setTimeout(()=>location.href=target(),300);
</script>
</body>
</html>
